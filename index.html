<!doctype html>
<html lang="ko" data-kokmatch-version="6.0" data-kokmatch-build="2026.08.31.standalone.9">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2453d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="콕매치">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>콕매치 v6.0</title>
  <script>
  (()=>{
    'use strict';
    const BUILD_FALLBACK='2026.08.31.standalone.9';
    const u=new URL(location.href);
    const launch=u.searchParams.get('_km');
    if(!launch){
      u.searchParams.set('_km',Date.now().toString(36));
      location.replace(u.pathname+u.search+u.hash);
      return;
    }
    const nonce=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
    window.__kokmatchStandalone='6.0';
    window.__kokmatchVersionLock='6.0';
    window.__kokmatchBuild=BUILD_FALLBACK;
    window.__kokmatchEntryNonce=nonce;
    document.documentElement.dataset.kokmatchEntry='fresh-v1';
    const manifest=document.createElement('link');
    manifest.rel='manifest';manifest.href='/manifest.webmanifest?_km='+encodeURIComponent(nonce);document.head.appendChild(manifest);
    const css=document.createElement('link');
    css.rel='stylesheet';css.href='/app-v6.0.css?_km='+encodeURIComponent(nonce);document.head.appendChild(css);
    const js=document.createElement('script');
    js.src='/app-v6.0.js?_km='+encodeURIComponent(nonce);js.async=false;document.head.appendChild(js);
    let visibleAt=Date.now();
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'){visibleAt=Date.now();return;}
      if(Date.now()-visibleAt>30000){
        const next=new URL(location.href);next.searchParams.set('_km',Date.now().toString(36));location.replace(next.pathname+next.search+next.hash);
      }
    });
    window.addEventListener('pageshow',e=>{if(e.persisted){const next=new URL(location.href);next.searchParams.set('_km',Date.now().toString(36));location.replace(next.pathname+next.search+next.hash)}});
  })();
  </script>
</head>
<body></body>
</html>
