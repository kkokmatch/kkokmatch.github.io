<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>콕매치 복구</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;color:#111}
    body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    .card{width:min(420px,100%);background:#fff;border:1px solid #e7e7ea;border-radius:20px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .spinner{width:34px;height:34px;border:4px solid #e5e5e5;border-top-color:#111;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:20px;margin:0 0 10px}p{font-size:14px;line-height:1.55;color:#666;margin:0}
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>콕매치 복구 중</h1>
    <p id="status">기기에 남은 이전 앱 상태를 정리하고 있습니다.</p>
  </div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.allSettled(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.allSettled(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  status.textContent='정리 완료. 최신 콕매치로 다시 연결합니다.';
  const stamp=Date.now();
  setTimeout(()=>location.replace('/?recovered='+stamp),600);
})();
</script>
</body>
</html>
