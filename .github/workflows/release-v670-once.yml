name: Release v6.70 session boundary once

on:
  push:
    paths:
      - '.github/workflows/release-v670-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v6.70 from current standalone runtime
        run: python3 scripts/build-v670.py

      - name: Syntax, 05:00 session and standalone invariants
        run: |
          node --check app-v6.70.js
          node scripts/qa-session-v670.mjs
          node scripts/validate-standalone-runtime.mjs
          grep -F 'app-v6.70.js?v=6.70' index.html >/dev/null
          grep -F 'app-v6.70.css?v=6.70' index.html >/dev/null
          grep -F "KOKMATCH_SW_VERSION='6.70'" kokmatch-sw.js >/dev/null
          grep -F 'kokmatch-sw.js?v=6.70' sw.js >/dev/null
          grep -F 'discardStaleStartupSessionV670();' app-v6.70.js >/dev/null
          grep -F 'await reloginLatest(requestToken)' app-v6.70.js >/dev/null
          ! grep -F "location.replace('/?relogin='" app-v6.70.js

      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v670-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v670-http.log
          exit 1

      - name: Apply proven production QA compatibility guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/qa-boot-diagnostic.mjs','scripts/qa-current-runtime.mjs','scripts/qa-save-layout-current.mjs']
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1');const kill=()=>document.getElementById('pwaPrompt629')?.remove();new MutationObserver(kill).observe(document,{childList:true,subtree:true});addEventListener('DOMContentLoaded',kill)}catch{}});"""
          for f in files:
              p=Path(f); s=p.read_text(encoding='utf-8')
              m=re.search(r"const page=await browser\.newPage\([^;]+\);",s)
              if m and guard not in s:
                  s=s[:m.end()]+'\n'+guard+s[m.end():]
              p.write_text(s,encoding='utf-8')
          p=Path('scripts/qa-save-layout-current.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("if(url.pathname.endsWith('/kokmatch-v60-api')){if(body.op==='member_save')", "if(url.pathname.endsWith('/kokmatch-v60-api')||url.pathname.endsWith('/kokmatch-member-v646')){if(body.op==='member_save')")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Current production core regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs

      - name: Restore temporary QA edits
        if: always()
        run: git checkout -- scripts/qa-boot-diagnostic.mjs scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs

      - name: Commit release only after green QA
        run: |
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v6.70.js app-v6.70.css index.html manifest.webmanifest kokmatch-sw.js sw.js latest-version.json
          git rm -f --ignore-unmatch scripts/build-v670.py scripts/qa-session-v670.mjs .github/workflows/release-v670-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Release v6.70 no-reopen login after 05:00 expiry'
          git push origin HEAD:main
