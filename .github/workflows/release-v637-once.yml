name: Release v6.37 once

on:
  push:
    paths:
      - '.github/workflows/release-v637-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.37
        run: python3 scripts/build-v637.py
      - name: Syntax and standalone validation
        run: |
          node --check app-v6.37.js
          node scripts/validate-standalone-runtime.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v637-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v637-http.log
          exit 1
      - name: Guard QA from PWA permission overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-current-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          needle='  await page.waitForTimeout(350);'
          repl=needle+"\n  await page.evaluate(()=>document.getElementById('pwaPrompt629')?.remove());"
          if needle not in s: raise SystemExit('qa overlay insertion point missing')
          p.write_text(s.replace(needle,repl,1),encoding='utf-8')
          PY
      - name: Existing runtime regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs
      - name: Role and pagination regression QA
        run: node scripts/qa-member-pagination-v637.mjs
      - name: Commit release only after green QA
        run: |
          git checkout -- scripts/qa-current-runtime.mjs
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v6.37.js app-v6.37.css index.html manifest.webmanifest kokmatch-sw.js latest-version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release v6.37 member pagination stabilization'
          git push origin HEAD:main
