name: Refresh v5.5 fix2 cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v55-fix2-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bump loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          ns,n=re.subn(r'app-v5\.4-hotfix-loader\.js\?v=[0-9.]+','app-v5.4-hotfix-loader.js?v=14.1',s)
          if n!=1:
              raise SystemExit(f'loader reference replacements={n}')
          p.write_text(ns)
          PY
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use v5.5 fix2 loader cache key'
          git push
