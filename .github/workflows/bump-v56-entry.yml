name: Bump v5.6 entry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v56-entry.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch entry to v5.6
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'data-kokmatch-version="[0-9.]+"','data-kokmatch-version="5.6"',s,count=1)
          s=re.sub(r'<title>콕매치 v[0-9.]+</title>','<title>콕매치 v5.6</title>',s,count=1)
          s=re.sub(r"window\.__kokmatchVersionLock='[0-9.]+'","window.__kokmatchVersionLock='5.6'",s,count=1)
          s=re.sub(r"dataset\.kokmatchVersion='[0-9.]+'","dataset.kokmatchVersion='5.6'",s,count=1)
          s=re.sub(r"document\.title='콕매치 v[0-9.]+'","document.title='콕매치 v5.6'",s,count=1)
          s=s.replace("sessionStorage.setItem('kokmatch_auto_update_target_v39','5.4')","sessionStorage.setItem('kokmatch_auto_update_target_v39','5.6')")
          s=s.replace("sessionStorage.setItem('kokmatch_auto_update_target_v40','5.4')","sessionStorage.setItem('kokmatch_auto_update_target_v40','5.6')")
          s,n=re.subn(r'/app-v5\.4-hotfix-loader\.js\?v=[0-9.]+','/app-v5.4-hotfix-loader.js?v=17.1',s,count=1)
          if n!=1: raise SystemExit('loader reference not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v5.6 entry
        run: |
          git config user.name github-actions[bot]
          git config user.email 4189826+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use v5.6 app entry and cache key 17.1'
          git push
