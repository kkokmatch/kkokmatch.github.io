name: Release v6.33 Android PWA recovery once
on:
  push:
    paths:
      - '.github/workflows/release-v633-android-pwa-recovery-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.33 candidate
        run: python3 scripts/build-v633.py
      - name: Static checks
        run: |
          node --check app-v6.33.js
          node scripts/validate-standalone-runtime.mjs
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('app-v6.33.js','utf8');
          const idx=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('kokmatch-sw.js','utf8');
          for(const x of ['__kokmatchUpdateGuard633','__kokmatchCheckVersion633','__kokmatchHardReload633','CURRENT633','patchVersion633','__kokmatchPaintRosterCanonical633']){
            if(!js.includes(x))throw new Error('missing '+x);
          }
          if(js.includes("serviceWorker.register('/kokmatch-sw.js?v="))throw new Error('versioned SW registration remains');
          if(!idx.includes("register('/kokmatch-sw.js'"))throw new Error('index stable SW bootstrap missing');
          if(!sw.includes("KOKMATCH_SW_VERSION='6.33'"))throw new Error('sw version missing');
          console.log('PASS v6.33 static update recovery markers');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Adapt existing QA for intentional PWA modal
        run: |
          cp scripts/qa-current-runtime.mjs /tmp/qa-current-runtime.mjs.bak
          cp scripts/qa-partner-poll-current.mjs /tmp/qa-partner-poll-current.mjs.bak
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-current-runtime.mjs');s=p.read_text()
          needle='  await page.waitForTimeout(350);'
          repl="  await page.waitForTimeout(350);\n  await page.locator('#pwaSecondary629').click({timeout:1500}).catch(()=>{});"
          if needle not in s: raise SystemExit('runtime QA insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          p=Path('scripts/qa-partner-poll-current.mjs');s=p.read_text()
          needle="\n  await page.evaluate(()=>window.openPartner66('mgr'));"
          repl="\n  await page.waitForTimeout(900);\n  await page.locator('#pwaSecondary629').click({timeout:1500}).catch(()=>{});\n  await page.evaluate(()=>window.openPartner66('mgr'));"
          if needle not in s: raise SystemExit('focused QA insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Existing boot QA
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Existing roster QA
        run: node scripts/qa-current-runtime.mjs
      - name: Existing partner and poll QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Android tablet first-login update and layout QA
        run: node scripts/qa-v633-android-tablet.mjs
      - name: Commit only after green QA
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          cp /tmp/qa-current-runtime.mjs.bak scripts/qa-current-runtime.mjs
          cp /tmp/qa-partner-poll-current.mjs.bak scripts/qa-partner-poll-current.mjs
          rm -f .github/workflows/release-v633-android-pwa-recovery-once.yml scripts/build-v633.py scripts/qa-v633-android-tablet.mjs
          git add app-v6.33.js app-v6.33.css index.html manifest.webmanifest latest-version.json kokmatch-sw.js sw.js .github/workflows/release-v633-android-pwa-recovery-once.yml scripts/build-v633.py scripts/qa-v633-android-tablet.mjs scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs
          git commit -m 'v6.33 recover Android PWA updates and stabilize tablet login'
          git push
