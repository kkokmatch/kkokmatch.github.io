name: QA v5.4 interactions v23
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix23.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-hotfix-loader.js'
      - '.github/workflows/qa-v54-interactions-v23.yml'
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Run current production-chain iPhone interaction QA
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9ZkAAAAASUVORK5CYII=' | base64 -d > qa.png
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          cat > qa-v23.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const browser=await webkit.launch({headless:true});
          const page=await browser.newPage({...devices['iPhone 13'],userAgent:devices['iPhone 13'].userAgent+' KAKAOTALK'});
          page.setDefaultTimeout(20000);
          let profilePosts=0;
          const savedProfiles={grp_a:{},grp_b:{}};
          const member=(id,name,gender,cls,role='member',year=1990)=>({id,name,gender,cls,role,year,age:String(Math.floor((2026-year)/10)*10),type:'member',state:'out',totalGames:0,joinedAt:Date.now()-60000});
          const membersA=[member('mgr','배솜다리','여','C','manager',1990),...Array.from({length:17},(_,i)=>member('m'+(i+1),'회원'+(i+1),(i%2?'여':'남'),['A','B','C','D','E'][i%5],'member',1980+i))];
          const membersB=[member('mgrb','배솜다리','여','C','manager',1990),member('b1','비회원1','남','B','member',1988),member('b2','비회원2','여','D','member',1992)];
          const state=(gid)=>({
            data:{dayKey:'2026-08-28',courtCount:4,courtNames:['1코트','2코트','3코트','4코트'],members:gid==='grp_b'?membersB:membersA,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},
            user:{role:'manager',displayName:'배솜다리',memberId:gid==='grp_b'?'mgrb':'mgr',globalAdmin:false,groupId:gid,groupName:gid==='grp_b'?'B모임':'테스트모임'},
            group:{groupId:gid,name:gid==='grp_b'?'B모임':'테스트모임'},
            groups:[{groupId:'grp_a',name:'테스트모임'},{groupId:'grp_b',name:'B모임'}]
          });
          await page.addInitScript(()=>{
            localStorage.setItem('kokmatch_v1_6_reset_once','done');
            localStorage.setItem('kokmatch_token','qa-token-a');
            localStorage.setItem('kokmatch_group_id','grp_a');
          });
          await page.route('**/latest-version.json*',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:54,label:'5.4',semanticVersion:'5.4'})}));
          await page.route('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/**',async route=>{
            const req=route.request(),u=new URL(req.url()),path=u.pathname;let body={};try{body=req.postData()?JSON.parse(req.postData()):{}}catch{}
            let out={};
            if(path.endsWith('/kokmatch-multi-api')){
              const api=u.searchParams.get('api');
              if(api==='state'){const g=u.searchParams.get('groupId')||'grp_a';out=state(g)}
              else if(api==='action')out={data:state(body.groupId||'grp_a').data};
            }else if(path.endsWith('/kokmatch-state-v46')){
              const g=u.searchParams.get('groupId')||'grp_a';out={...state(g),memberCount:state(g).data.members.length};
            }else if(path.endsWith('/kokmatch-auth-v38')){
              if(body.action==='my_memberships')out={memberships:[
                {groupId:'grp_a',groupName:'테스트모임',memberId:'mgr',role:'manager',roleLabel:'모임관리자'},
                {groupId:'grp_b',groupName:'B모임',memberId:'mgrb',role:'manager',roleLabel:'모임관리자'}
              ]};
              else if(body.action==='switch_group')out={success:true,token:'qa-token-'+body.groupId,groupId:body.groupId,groupName:body.groupId==='grp_b'?'B모임':'테스트모임',memberId:body.groupId==='grp_b'?'mgrb':'mgr',role:'manager',roleLabel:'모임관리자'};
            }else if(path.endsWith('/kokmatch-profile-v53')){
              const g=u.searchParams.get('groupId')||body.groupId||'grp_a';
              if(req.method()==='POST'){
                if(body.action==='save_profile'){profilePosts++;const id=g==='grp_b'?'mgrb':'mgr';savedProfiles[g][id]={image:body.image||'',fullImage:body.fullImage||body.image||''};out={success:true,image:body.image||'',fullImage:body.fullImage||body.image||''}}
                else if(body.action==='delete_profile'){const id=g==='grp_b'?'mgrb':'mgr';delete savedProfiles[g][id];out={success:true}}
              }else if(u.searchParams.get('full')==='1'){
                const id=u.searchParams.get('memberId')||'';out={image:savedProfiles[g][id]?.image||'',fullImage:savedProfiles[g][id]?.fullImage||savedProfiles[g][id]?.image||''};
              }else out={profiles:savedProfiles[g]};
            }else if(path.endsWith('/kokmatch-updater'))out={version:0,label:'0.0',autoUpdate:false};
            else out={};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(out)});
          });
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/?qa=v23',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__kokmatchInteractionPatch==='23.1'&&window.__kokmatchRosterCanonical==='22.2');
          await page.waitForFunction(()=>document.querySelectorAll('#members .memberCard').length===10);
          const first=await page.locator('#members .memberCard .memberName45').first().textContent();
          if(first?.trim()!=='배솜다리')throw new Error('logged member not first: '+first);

          await page.locator('#members .memberPager46 button').filter({hasText:'다음'}).click();
          await page.waitForFunction(()=>window.__kokmatchMemberPage46===2);
          const page2=await page.locator('#members .memberCard .memberName45').allTextContents();
          if(page2.length!==8||!page2.includes('회원17'))throw new Error('page2 failed '+JSON.stringify(page2));
          console.log('PASS pager');
          await page.locator('#members .memberPager46 button').filter({hasText:'이전'}).click();
          await page.waitForFunction(()=>window.__kokmatchMemberPage46===1);

          const card=page.locator('#members .memberCard').filter({has:page.locator('.memberName45',{hasText:'회원1'})}).first();
          await card.getByRole('button',{name:'수정'}).click();
          await page.waitForSelector('#modal.on #fmName');
          const editName=await page.locator('#fmName').inputValue();
          if(editName!=='회원1')throw new Error('edit modal opened wrong member '+editName);
          console.log('PASS edit');
          await page.locator('#modal.on').getByRole('button',{name:'취소'}).click();

          await page.locator('#groupBtn').click();
          await page.waitForSelector('#groupChoice23');
          await page.locator('#groupChoice23 button').filter({hasText:'B모임'}).click();
          await page.waitForFunction(()=>window.currentGroupId==='grp_b'&&window.group?.groupId==='grp_b');
          await page.waitForFunction(()=>localStorage.getItem('kokmatch_group_id')==='grp_b'&&document.querySelector('#groupBtn')&&!document.querySelector('#groupBtn').disabled&&document.querySelector('#groupBtn').textContent.includes('B모임'));
          const switchedFirst=await page.locator('#members .memberCard .memberName45').first().textContent();
          if(switchedFirst?.trim()!=='배솜다리')throw new Error('switched roster identity failed '+switchedFirst);
          console.log('PASS group switch');

          await page.evaluate(()=>goView('settings'));
          await page.waitForSelector('#profileCard53 #profileFile53');
          const chooserPromise=page.waitForEvent('filechooser');
          await page.locator('label[for="profileFile53"]').click();
          const chooser=await chooserPromise;
          await chooser.setFiles('qa.png');
          await page.waitForFunction(()=>document.querySelector('#profileStatus21')?.textContent.includes('저장 완료'));
          if(profilePosts!==1)throw new Error('profile save count '+profilePosts);
          console.log('PASS profile');

          if(errors.length)throw new Error('page errors: '+JSON.stringify(errors));
          console.log('PASS V23.1 INTERACTIONS',JSON.stringify({first,page2,editName,switchedFirst,profilePosts}));
          await browser.close();
          EOF
          node qa-v23.mjs
