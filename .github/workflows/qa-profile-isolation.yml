name: QA profile isolation
on:
  push:
    paths:
      - '.github/workflows/qa-profile-isolation.yml'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix18.js'
      - 'app-v5.4-fix19.js'
      - 'app-v5.4-hotfix-loader.js'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: verify profile isolation and gender fallback
        run: |
          cat > qa-profile.mjs <<'EOF'
          import { chromium } from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844}});
          const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          const devPhoto='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=';
          let fullIds=[];
          await p.route(PROFILE+'**',async route=>{const r=route.request(),u=new URL(r.url());if(u.searchParams.get('full')==='1'){const id=u.searchParams.get('memberId')||'';fullIds.push(id);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({image:id==='dev1'?devPhoto:'',fullImage:id==='dev1'?devPhoto:''})})}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{dev1:{image:devPhoto}}})})});
          let ready=false;for(let i=0;i<10&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=profile-isolation&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix19===true&&window.__kokmatchProfileIsolationPatch==='19.0'&&window.__kokmatchVersionLock==='5.4',{timeout:10000});ready=true}catch{}}
          if(!ready)throw new Error('profile isolation patch not ready on production');
          await p.evaluate(()=>{T='qa-token';currentGroupId='grp_iso';currentView='members';S=emptyClientState();S.members=[
            {id:'dev1',name:'개발자',gender:'남',age:'30',cls:'C',type:'member',role:'admin',state:'waiting',joinedAt:1},
            {id:'female1',name:'여성회원',gender:'여',age:'30',cls:'B',type:'member',role:'member',state:'waiting',joinedAt:2},
            {id:'male2',name:'남성회원',gender:'남',age:'40',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:3},
            ...Array.from({length:9},(_,i)=>({id:`m${i+4}`,name:`회원${i+4}`,gender:(i%2?'남':'여'),age:'30',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:i+4}))
          ];S.queue=['dev1','female1','male2'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};group={groupId:'grp_iso',name:'QA'};groups=[];me={memberId:'female1',displayName:'여성회원',role:'member',globalAdmin:false,groupId:'grp_iso'};normalizeClient();renderAll();document.getElementById('login')?.classList.add('hide')});
          await p.waitForFunction(()=>window.__kokmatchProfilesLoaded19==='grp_iso',{timeout:10000});await p.waitForTimeout(350);
          const page1=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity80');return{name:(c.querySelector('.name')?.textContent||'').trim(),id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||'',img:a?.querySelector('img')?.getAttribute('src')||'',svg:!!a?.querySelector('svg'),cls:a?.className||''}}));
          console.log('PAGE1',page1);
          const dev=page1.find(x=>x.id==='dev1'),female=page1.find(x=>x.id==='female1'),male=page1.find(x=>x.id==='male2');
          if(!dev||dev.photo!=='1'||dev.img!==devPhoto||dev.gender!=='남')throw new Error('developer photo mapping failed '+JSON.stringify(dev));
          if(!female||female.photo!=='0'||female.img||!female.svg||female.gender!=='여'||!female.cls.includes('female'))throw new Error('ordinary female inherited photo or wrong gender '+JSON.stringify(female));
          if(!male||male.photo!=='0'||male.img||!male.svg||male.gender!=='남'||!male.cls.includes('male'))throw new Error('ordinary male inherited photo or wrong gender '+JSON.stringify(male));
          if(page1.filter(x=>x.photo==='1').length!==1)throw new Error('developer photo leaked to another member '+JSON.stringify(page1));
          await p.locator('#members .profileIdentity80[data-member-id="female1"]').click();await p.waitForTimeout(120);if(await p.locator('#profilePhotoModal80.on').count())throw new Error('no-photo ordinary member opened photo modal');
          await p.locator('#members .profileIdentity80[data-member-id="dev1"]').click();await p.waitForSelector('#profilePhotoModal80.on',{state:'visible'});await p.locator('#profilePhotoModal80 .profilePhotoClose80').click();if(fullIds.some(id=>id!=='dev1'))throw new Error('wrong member high-res profile requested '+JSON.stringify(fullIds));
          await p.evaluate(()=>memberPageGo46(2));await p.waitForTimeout(350);
          const page2=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity80');return{id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||'',img:!!a?.querySelector('img'),svg:!!a?.querySelector('svg'),cls:a?.className||''}}));
          console.log('PAGE2',page2);
          if(page2.length!==2)throw new Error('page2 count mismatch '+page2.length);
          for(const x of page2){const m=await p.evaluate(id=>S.members.find(v=>String(v.id)===String(id)),x.id);if(!m)throw new Error('page2 unknown member '+x.id);if(x.photo!=='0'||x.img||!x.svg||x.gender!==m.gender||!x.cls.includes(m.gender==='여'?'female':'male'))throw new Error('page2 gender/photo mismatch '+JSON.stringify({x,m}))}
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('PASS profile isolation',{fullIds});await b.close();
          EOF
          node qa-profile.mjs
