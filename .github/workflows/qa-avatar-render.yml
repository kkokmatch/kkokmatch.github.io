name: QA avatar render
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qa-avatar-render.yml'
      - 'app-v5.2.js'
      - 'app-v5.3.js'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve
        run: |
          nohup python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
      - name: Render and assert avatars
        run: |
          cat > qa-avatar.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.route('**/kokmatch-profile-v53**',async route=>{
            const req=route.request();
            if(req.method()==='GET'){
              const px='data:image/svg+xml;base64,'+Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="%23466"/><circle cx="16" cy="12" r="7" fill="white"/></svg>').toString('base64');
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{m1:{image:px}}})});
            }else await route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'});
          });
          await page.goto('http://127.0.0.1:4173/?qa=avatar',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.documentElement.dataset.kokmatchVersion==='5.3',{timeout:20000});
          const seed=async(gid,token='')=>page.evaluate(({gid,token})=>{
            T=token; currentGroupId=gid; currentView='queue';
            S=emptyClientState();
            S.members=[
              {id:'m1',name:'남자회원',year:1990,gender:'남',age:'30',cls:'C',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-600000},
              {id:'m2',name:'여자회원',year:1991,gender:'여',age:'30',cls:'C',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-300000}
            ];
            S.queue=['m1','m2'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};
            me={memberId:'m1',displayName:'남자회원',role:'member',globalAdmin:false,groupId:gid};
            group={groupId:gid,name:'QA'};groups=[];normalizeClient();renderAll();
            document.getElementById('login')?.classList.add('hide');
            document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'));
          },{gid,token});
          await seed('qa-no-photo','');
          await page.waitForTimeout(300);
          let cards=await page.locator('#queue .queueCard').evaluateAll(cs=>cs.map(c=>({
            avatars:c.querySelectorAll('.avatar').length,
            legacyGender:c.querySelectorAll('.genderPerson54').length,
            imgs:c.querySelectorAll('img').length,
            html:c.outerHTML
          })));
          console.log('NO_PHOTO '+JSON.stringify(cards));
          if(cards.length!==2||cards.some(c=>c.avatars!==1||c.legacyGender!==0||c.imgs!==0))throw new Error('no-photo cards do not have exactly one gender marker');
          await page.screenshot({path:'no-photo.png',fullPage:true});

          await seed('qa-with-photo','fake-token');
          await page.waitForFunction(()=>document.querySelectorAll('#queue .queueCard')[0]?.querySelectorAll('img').length===1,{timeout:5000});
          cards=await page.locator('#queue .queueCard').evaluateAll(cs=>cs.map(c=>({
            avatars:c.querySelectorAll('.avatar').length,
            legacyGender:c.querySelectorAll('.genderPerson54').length,
            imgs:c.querySelectorAll('img').length,
            html:c.outerHTML
          })));
          console.log('WITH_PHOTO '+JSON.stringify(cards));
          if(cards.length!==2||cards[0].avatars!==1||cards[0].legacyGender!==0||cards[0].imgs!==1||cards[1].avatars!==1||cards[1].legacyGender!==0||cards[1].imgs!==0)throw new Error('photo/fallback cards do not have exactly one identity marker');
          await page.screenshot({path:'with-photo.png',fullPage:true});
          await browser.close();
          EOF
          node qa-avatar.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: avatar-render-visible
          path: |
            no-photo.png
            with-photo.png
