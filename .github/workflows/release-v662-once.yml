name: Release v6.62 prism developer styling

on:
  push:
    paths:
      - '.github/workflows/release-v662-once.yml'

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v6.62 from current production runtime
        run: |
          python3 scripts/build-v662.py
          # v6.61 retained one disabled pseudo-frame URL in CSS; point every reference at the new prism asset.
          sed -i 's/dev-challenger-frame-v661.webp/dev-prism-frame-v662.webp/g' app-v6.62.css

      - name: Syntax, asset and standalone invariants
        run: |
          node --check app-v6.62.js
          node scripts/validate-standalone-runtime.mjs
          test -s assets/dev-prism-frame-v662.webp
          test "$(stat -c%s assets/dev-prism-frame-v662.webp)" = '39076'
          echo '60fd6b775fc5a70831b65f4b2bce4a58bc132a5ff25513062251dfc9faff251a  assets/dev-prism-frame-v662.webp' | sha256sum -c -
          file assets/dev-prism-frame-v662.webp | grep -F 'Web/P image' >/dev/null
          grep -F "window.__kokmatchVersionLock='6.62'" app-v6.62.js >/dev/null
          grep -F 'dev-prism-frame-v662.webp?v=6.62' app-v6.62.js >/dev/null
          grep -F -- '--km-dev-frame-v662:1' app-v6.62.css >/dev/null
          grep -F -- '--km-dev-badge-v662:1' app-v6.62.css >/dev/null
          grep -F 'dev-prism-frame-v662.webp?v=6.62' app-v6.62.css >/dev/null
          ! grep -F 'dev-challenger-frame-v661.webp' app-v6.62.css
          grep -F 'app-v6.62.js?v=6.62' index.html >/dev/null
          grep -F 'app-v6.62.css?v=6.62' index.html >/dev/null
          ! grep -F 'app-v6.61.js' index.html
          ! grep -F 'app-v6.61.css' index.html
          grep -F '/assets/dev-prism-frame-v662.webp?v=6.62' kokmatch-sw.js >/dev/null

      - name: Install Playwright browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-http.log
          exit 1

      - name: Guard current regression QA from PWA overlays and current member endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/qa-boot-diagnostic.mjs','scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs']
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1');const kill=()=>document.getElementById('pwaPrompt629')?.remove();new MutationObserver(kill).observe(document,{childList:true,subtree:true});addEventListener('DOMContentLoaded',kill)}catch{}});"""
          for f in files:
            p=Path(f);s=p.read_text();m=re.search(r"const page=await browser\.newPage\([^;]+\);",s)
            if m and guard not in s:s=s[:m.end()]+'\n'+guard+s[m.end():]
            p.write_text(s)
          p=Path('scripts/qa-save-layout-current.mjs')
          s=p.read_text()
          s=s.replace("if(url.pathname.endsWith('/kokmatch-v60-api')){if(body.op==='member_save')", "if(url.pathname.endsWith('/kokmatch-v60-api')||url.pathname.endsWith('/kokmatch-member-v646')){if(body.op==='member_save')")
          p.write_text(s)
          PY

      - name: Existing functional regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs

      - name: v6.62 prism and developer badge QA
        run: node scripts/qa-v662-prism.mjs

      - name: Restore temporary regression QA edits
        if: always()
        run: git checkout -- scripts/qa-boot-diagnostic.mjs scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs

      - name: Commit release only after green QA
        run: |
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f scripts/build-v662.py scripts/qa-v662-prism.mjs scripts/prism-v662-part*.b64 .github/workflows/release-v662-once.yml
          git add app-v6.62.js app-v6.62.css assets/dev-prism-frame-v662.webp index.html latest-version.json manifest.webmanifest kokmatch-sw.js sw.js versions/v6.61
          git commit -m 'Release v6.62 prism developer profile styling'
          git push

# retry after restoring missing prism asset chunk 2
