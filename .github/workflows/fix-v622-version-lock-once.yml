name: Fix v6.22 trailing version lock

on:
  push:
    paths:
      - '.github/workflows/fix-v622-version-lock-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize v6.22 version lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-v6.22.js')
          s=p.read_text()
          old="window.__kokmatchStandalone='6.21';\nwindow.__kokmatchVersionLock='6.21';\ndocument.documentElement.dataset.kokmatchVersion='6.21';\ndocument.title='콕매치 v6.0';"
          new="window.__kokmatchStandalone='6.22';\nwindow.__kokmatchVersionLock='6.22';\ndocument.documentElement.dataset.kokmatchVersion='6.22';\ndocument.title='콕매치 v6.22';"
          assert old in s, 'trailing v6.21 version lock not found'
          s=s.replace(old,new,1)
          assert "__kokmatchStandalone='6.21'" not in s
          assert "__kokmatchVersionLock='6.21'" not in s
          p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=x.replace('data-kokmatch-build="v6.21"','data-kokmatch-build="v6.22"')
          x=x.replace('<title>콕매치 v6.21</title>','<title>콕매치 v6.22</title>')
          x=x.replace('manifest.webmanifest?v=6.21','manifest.webmanifest?v=6.22')
          x=x.replace('app-v6.22.css?v=6.21','app-v6.22.css?v=6.22')
          x=x.replace("window.__kokmatchBuild='v6.21'","window.__kokmatchBuild='v6.22'")
          x=x.replace("dataset.kokmatchEntry='single-v621'","dataset.kokmatchEntry='single-v622'")
          x=x.replace('app-v6.22.js?v=6.21','app-v6.22.js?v=6.22')
          i.write_text(x)
          PY
          node --check app-v6.22.js
          node scripts/validate-standalone-runtime.mjs
      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-v622-version-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v6.22 normalize single runtime version lock"
          git push
