name: Audit poll runtime once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-poll-runtime-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and inspect canonical roster path
        run: |
          node scripts/build-v623-poll-cleanup.mjs
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['app-v6.22.js','app-v6.23.js']){
            const s=fs.readFileSync(f,'utf8');
            console.log('\n==== '+f+' ====');
            for(const needle of ['async function stableApi','async function changeAttendance','const pick=t=>']){
              const i=s.lastIndexOf(needle);console.log('\n-- '+needle+' @ '+i+' --');console.log(s.slice(Math.max(0,i-700),i+3200));
            }
          }
          NODE
