name: Audit poll runtime once
on:
  push:
    paths:
      - '.github/workflows/audit-poll-runtime-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print v2.8 mixed block
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('app-v6.22.js','utf8'),name='app-v2.8.js';
          const a=s.indexOf(`/* migrated into v6.0: ${name} */`),b=s.indexOf('/* migrated into v6.0:',a+1);
          if(a<0)throw new Error('missing '+name);
          console.log(s.slice(a,b<0?s.length:b));
          NODE
