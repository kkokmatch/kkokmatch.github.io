name: Audit poll runtime once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-poll-runtime-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect poll migration blocks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('app-v6.22.js','utf8');
          const re=/\/\* migrated into v6\.0: ([^*]+) \*\//g;
          const marks=[];let m;
          while((m=re.exec(src)))marks.push({name:m[1].trim(),start:m.index});
          marks.push({name:'EOF',start:src.length});
          for(let i=0;i<marks.length-1;i++){
            const block=src.slice(marks[i].start,marks[i+1].start);
            const pollHits=(block.match(/poll/gi)||[]).length;
            if(pollHits){
              const ids=[...new Set((block.match(/(?:function\s+|window\.)([A-Za-z0-9_$]*(?:Poll|poll)[A-Za-z0-9_$]*)/g)||[]))].slice(0,30);
              console.log(JSON.stringify({name:marks[i].name,bytes:block.length,pollHits,hasQueue:/renderQueue|queue/i.test(block),hasMembers:/renderMembers|memberCard/i.test(block),hasSettings:/renderSettings/i.test(block),hasStats:/renderStats/i.test(block),ids}));
            }
          }
          console.log('TOTAL_BYTES',src.length);
          NODE
