name: Audit poll runtime once
on:
  push:
    paths:
      - '.github/workflows/audit-poll-runtime-once.yml'
      - 'scripts/debug-roster-v623.mjs'
      - 'scripts/roster-v623-final.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/build-v623-poll-cleanup.mjs
          printf '\n\n' >> app-v6.23.js
          cat scripts/roster-v623-final.js >> app-v6.23.js
          node --check app-v6.23.js
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          exit 1
      - run: node scripts/debug-roster-v623.mjs
