name: QA v5.4
on:
  push:
    paths:
      - 'app-v5.3.js'
      - 'app-v5.4.js'
      - '.github/workflows/qa-v54.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app-v5.3.js && node --check app-v5.4.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          nohup python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
      - name: browser qa
        run: |
          cat > qa-v54.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:390,height:844}});
          let savedImage='';
          await p.route('**/kokmatch-profile-v53**',async route=>{const req=route.request();if(req.method()==='POST'){const body=JSON.parse(req.postData()||'{}');savedImage=body.image||'';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,image:savedImage})})}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:savedImage?{m1:{image:savedImage}}:{}})})});
          await p.goto('http://127.0.0.1:4173/?qa=v54',{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>document.documentElement.dataset.kokmatchVersion==='5.4',{timeout:20000});
          const seed=()=>p.evaluate(()=>{T='';currentGroupId='qa54';currentView='queue';S=emptyClientState();S.members=[{id:'m1',name:'남자회원',gender:'남',age:'30',cls:'C',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-10000},{id:'m2',name:'여자회원',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-5000}];S.queue=['m1','m2'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};me={memberId:'m1',displayName:'남자회원',role:'organizer',groupId:'qa54'};group={groupId:'qa54',name:'QA'};groups=[];normalizeClient();document.getElementById('login')?.classList.add('hide');});
          await seed(); await p.evaluate(()=>{draft.splice(0,draft.length,'m1','m2',null,null);localStorage.setItem('kokmatch_draft_v54_qa54',JSON.stringify(draft));renderAll();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'));});
          let c=await p.locator('.composer54 .slot54.filled').evaluateAll(xs=>xs.map(x=>({gender:x.querySelectorAll('.composerGender54').length,profile:x.querySelectorAll('.profileAvatar53,.genderAvatar39').length,grade:x.querySelectorAll('.gradeBadge50,.tag').length})));
          console.log('COMPOSER',JSON.stringify(c)); if(c.length<2||c.some(x=>x.gender!==1||x.profile!==0||x.grade<1))throw new Error('composer identity/layout mismatch');
          if((await p.locator('#currentVersion52').textContent())!=='v5.4')throw new Error('header version reverted');
          await p.reload({waitUntil:'domcontentloaded'}); await p.waitForFunction(()=>document.documentElement.dataset.kokmatchVersion==='5.4',{timeout:20000}); await seed();
          await p.evaluate(()=>{renderAll();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'));});
          c=await p.locator('.composer54 .slot54.filled').count(); console.log('RESTORED',c); if(c!==2)throw new Error('draft not restored after reload');
          await p.evaluate(()=>{T='fake-token';currentView='settings';renderSettings();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='settings'));});
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR4nGP8z8DAwMDAxMDAwMAAAAwAAf8CBWkAAAAASUVORK5CYII=','base64');
          await p.locator('#profileFile53').setInputFiles({name:'profile.png',mimeType:'image/png',buffer:png});
          await p.waitForFunction(()=>document.querySelector('#profileCard53 img')&&document.querySelector('#queue .queueCard img'),{timeout:5000});
          const oneTap=await p.evaluate(()=>({preview:document.querySelectorAll('#profileCard53 img').length,queueImg:document.querySelectorAll('#queue .queueCard')[0]?.querySelectorAll('img').length||0,genderText:document.querySelectorAll('#queue .queueCard')[0]?.querySelectorAll('.v54genderText').length||0}));
          console.log('PROFILE_ONE_TAP',JSON.stringify(oneTap)); if(oneTap.preview!==1||oneTap.queueImg!==1||oneTap.genderText!==1)throw new Error('profile did not apply in one selection or gender text missing');
          await p.evaluate(()=>{currentView='queue';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'));renderQueue()});
          await p.screenshot({path:'v54.png',fullPage:true}); await b.close();
          EOF
          node qa-v54.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v54-screen
          path: v54.png
