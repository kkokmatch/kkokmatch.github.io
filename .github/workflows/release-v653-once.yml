name: Release v6.53 roster delay hotfix once

on:
  push:
    paths:
      - '.github/workflows/release-v653-once.yml'

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v6.53 and archive v6.52
        run: python3 scripts/build-v653.py

      - name: Syntax and hotfix invariants
        run: |
          node --check app-v6.53.js
          node scripts/validate-standalone-runtime.mjs
          grep -F 'kokmatch-roster-v653' app-v6.53.js >/dev/null
          grep -F 'fullStateFallback653' app-v6.53.js >/dev/null
          grep -F 'restoreRoster653' app-v6.53.js >/dev/null
          grep -F 'setTimeout(()=>ctl.abort(),2800)' app-v6.53.js >/dev/null
          grep -F 'window.__kokmatchMemberCountGroup46=requestedGroup' app-v6.53.js >/dev/null
          ! grep -F '회원명단 응답이 지연되고 있습니다. 다시 시도해주세요.' app-v6.53.js

      - name: Install Playwright browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7
          npx playwright install --with-deps chromium webkit

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-http.log
          exit 1

      - name: Guard current regression QA from PWA overlay and current member endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/qa-boot-diagnostic.mjs','scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs']
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1');const kill=()=>document.getElementById('pwaPrompt629')?.remove();new MutationObserver(kill).observe(document,{childList:true,subtree:true});addEventListener('DOMContentLoaded',kill)}catch{}});"""
          for f in files:
            p=Path(f);s=p.read_text();m=re.search(r"const page=await browser\.newPage\([^;]+\);",s)
            if m and guard not in s:s=s[:m.end()]+'\n'+guard+s[m.end():]
            p.write_text(s)
          p=Path('scripts/qa-save-layout-current.mjs');s=p.read_text();s=s.replace("if(url.pathname.endsWith('/kokmatch-v60-api')){if(body.op==='member_save')", "if(url.pathname.endsWith('/kokmatch-v60-api')||url.pathname.endsWith('/kokmatch-member-v646')){if(body.op==='member_save')");p.write_text(s)
          PY

      - name: Existing functional regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs

      - name: Roster delay fallback QA
        run: node scripts/qa-v653-roster.mjs

      - name: Restore temporary regression QA edits
        if: always()
        run: git checkout -- scripts/qa-boot-diagnostic.mjs scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs

      - name: Commit release only after green QA
        run: |
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm scripts/build-v653.py scripts/qa-v653-roster.mjs .github/workflows/release-v653-once.yml
          git add app-v6.53.js app-v6.53.css index.html latest-version.json manifest.webmanifest kokmatch-sw.js sw.js versions/v6.52
          git commit -m 'Release v6.53 fix delayed roster responses'
          git push

# retry with service-worker-blocked browser-context routing for WebKit fallback QA
