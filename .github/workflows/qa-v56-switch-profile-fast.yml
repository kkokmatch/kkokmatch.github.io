name: QA v5.6 update profile switch
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.6-pre.js'
      - 'app-v5.6.js'
      - 'app-v5.6-fix1.js'
      - 'app-v5.6-fix2.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
      - '.github/workflows/qa-v56-switch-profile-fast.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Verify updater metadata
        run: |
          node - <<'EOF'
          const u='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-updater?api=version';
          const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('updater HTTP '+r.status);
          const x=await r.json(); console.log(x);
          if(Number(x.version)!==56||String(x.semanticVersion||x.label)!=='5.6') throw new Error('updater is not v5.6');
          EOF
      - name: Serve current commit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kkokmatch-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/kkokmatch-http.log
          exit 1
      - name: Prepare iPhone QA script
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const oldA='data:image/jpeg;base64,OLD_A_PROFILE';
          const oldB='data:image/jpeg;base64,OLD_B_PROFILE';
          const svg=Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="#d44"/></svg>');
          const members=[{id:'self',name:'QA사용자',year:'1989',gender:'남',cls:'C',type:'member',role:'member',state:'out',totalGames:0},{id:'f1',name:'여회원',year:'1992',gender:'여',cls:'D',type:'member',role:'member',state:'out',totalGames:0}];
          const profileByGroup={grp_a:{self:{image:oldA}},grp_b:{self:{image:oldB}}};
          const timeout=(name,p,ms=10000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT '+name)),ms))]);
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13'],serviceWorkers:'block'});
          const page=await ctx.newPage(); page.setDefaultTimeout(10000);
          let profileGets=0,profilePosts=0,switchAuths=0,stateGets=0,delayNextA=false;
          const dialogs=[],pageErrors=[];
          page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
          page.on('dialog',async d=>{dialogs.push(d.message());console.log('DIALOG',d.message());await d.dismiss()});
          page.on('pageerror',e=>{pageErrors.push(String(e));console.log('PAGEERROR',String(e))});
          const state=gid=>({data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}],user:{role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:gid}});
          await page.route(AUTH+'**',async route=>{const b=route.request().postDataJSON?.()||{};if(b.action==='switch_group'){switchAuths++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,keepToken:false,token:'token-'+b.groupId,groupId:b.groupId,groupName:b.groupId==='grp_b'?'B모임':'A모임',role:'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member'}]})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
          await page.route(MULTI+'**',async route=>{const u=new URL(route.request().url()),api=u.searchParams.get('api');if(api==='state'){stateGets++;const gid=u.searchParams.get('groupId')||'grp_a';const snap=state(gid);if(gid==='grp_a'&&delayNextA){delayNextA=false;await new Promise(r=>setTimeout(r,1200))}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(snap)})}return route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'})});
          await page.route(PROFILE+'**',async route=>{const req=route.request();if(req.method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});if(req.method()==='POST'){profilePosts++;const b=req.postDataJSON?.()||{},gid=String(b.groupId||'grp_a'),mid=String(b.memberId||'self');profileByGroup[gid]??={};if(b.action==='delete_profile'||b.delete)delete profileByGroup[gid][mid];else if(b.image)profileByGroup[gid][mid]={image:String(b.image)};return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,success:true,image:b.image||''})})}profileGets++;const gid=new URL(req.url()).searchParams.get('groupId')||'grp_a';const snapshot=JSON.parse(JSON.stringify(profileByGroup[gid]||{}));await new Promise(r=>setTimeout(r,350));return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:snapshot})})});
          await page.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members,memberCount:2,adminBadgeVisibility:'all'})}));
          try{
            await timeout('goto',page.goto('http://127.0.0.1:4173/?qa=v56&t='+Date.now(),{waitUntil:'domcontentloaded'}),20000);
            await timeout('latest fixes',page.waitForFunction(()=>window.__kokmatchV56===true&&window.__kokmatchV56Patch==='1.4'&&window.__kokmatchV56Pre===true&&window.__kokmatchV56Fix1Patch==='1.1'&&window.__kokmatchV56Fix1Build==='2026.08.28.3'&&window.__kokmatchV56Fix2Patch==='2.0'&&window.__kokmatchV56Fix2Build==='2026.08.28.4'&&window.__kokmatchVersionLock==='5.6'),25000);
            await page.waitForTimeout(400);
            const update=await page.evaluate(()=>({same:window.forceUpdateApp===window.__kokmatchHardRefresh56,same51:window.refreshApp51===window.__kokmatchHardRefresh56,button:document.getElementById('headerRefresh51')?.textContent||'',version:document.documentElement.dataset.kokmatchVersion,title:document.title,fix1:window.__kokmatchV56Fix1Patch,fix2:window.__kokmatchV56Fix2Patch,build:window.__kokmatchV56Fix2Build}));
            if(!update.same||!update.same51||update.button!=='↻ 최신본 적용'||update.version!=='5.6'||update.title!=='콕매치 v5.6')throw new Error('update binding mismatch '+JSON.stringify(update));
            await page.evaluate(members=>{T='token-grp_a';currentGroupId='grp_a';S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_a',name:'A모임'};groups=[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}];me={role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:'grp_a'};currentView='members';localStorage.setItem('kokmatch_token',T);localStorage.setItem('kokmatch_group_id','grp_a');renderAll();document.getElementById('login')?.classList.add('hide')},members);
            await timeout('profile A initial',page.evaluate(()=>window.__kokmatchLoadProfiles56('grp_a',true)),8000);
            await timeout('old A visible',page.waitForFunction(src=>document.querySelector('#members .memberCard[data-member-id56="self"] > .profileIdentity80 img')?.getAttribute('src')===src,oldA),5000);
            await page.evaluate(()=>goView('settings')); await timeout('profile input',page.waitForSelector('#profileFile53'),5000);
            const staleProfile=page.evaluate(()=>window.__kokmatchLoadProfiles56('grp_a',true));
            await page.waitForTimeout(50);
            await page.setInputFiles('#profileFile53',{name:'qa-profile.svg',mimeType:'image/svg+xml',buffer:svg});
            await timeout('profile saved',page.waitForFunction(old=>window.__kokmatchProfileSaveState==='saved'&&document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')!==old,oldA),12000);
            const savedSrc=await page.evaluate(()=>document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'');
            await staleProfile.catch(()=>{}); await page.waitForTimeout(500);
            const afterStalePhoto=await page.evaluate(()=>document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'');
            if(!savedSrc||savedSrc===oldA||afterStalePhoto!==savedSrc)throw new Error('profile reverted after stale GET');
            if(profilePosts<1)throw new Error('profile POST missing');
            await timeout('profile reconcile',page.evaluate(()=>window.__kokmatchLoadProfiles56('grp_a',true)),8000);
            const reconciled=await page.evaluate(()=>document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'');if(reconciled!==savedSrc)throw new Error('profile reverted after server reload');
            await page.evaluate(()=>goView('members'));await timeout('saved member photo',page.waitForFunction(src=>document.querySelector('#members .memberCard[data-member-id56="self"] > .profileIdentity80 img')?.getAttribute('src')===src,savedSrc),5000);
            delayNextA=true;await page.evaluate(()=>{window.__qaOldStatePromise=window.__kokmatchLoadState56({target:'grp_a'}).catch(()=>false)});await page.waitForTimeout(80);
            const ok=await timeout('switch B',page.evaluate(()=>window.switchOwnGroup38('grp_b')),10000);if(ok!==true)throw new Error('switch B returned '+ok+' dialogs='+dialogs.join('|'));
            await timeout('state B',page.waitForFunction(()=>currentGroupId==='grp_b'&&group?.groupId==='grp_b'),5000);await page.waitForTimeout(1600);
            const afterStale=await page.evaluate(()=>({gid:currentGroupId,stateGid:group?.groupId,token:String(T||'')}));if(afterStale.gid!=='grp_b'||afterStale.stateGid!=='grp_b'||afterStale.token!=='token-grp_b')throw new Error('stale A state overwrote B '+JSON.stringify(afterStale));
            await timeout('B photo',page.waitForFunction(src=>document.querySelector('#members .memberCard[data-member-id56="self"] > .profileIdentity80 img')?.getAttribute('src')===src,oldB),8000);
            const back=await timeout('switch A',page.evaluate(()=>window.switchOwnGroup38('grp_a')),10000);if(back!==true)throw new Error('switch A returned '+back);
            await timeout('state A',page.waitForFunction(()=>currentGroupId==='grp_a'&&group?.groupId==='grp_a'),5000);await timeout('saved A after return',page.waitForFunction(src=>document.querySelector('#members .memberCard[data-member-id56="self"] > .profileIdentity80 img')?.getAttribute('src')===src,savedSrc),8000);
            const result=await page.evaluate(()=>{const b=document.getElementById('groupBtn');return{group:currentGroupId,grp:group?.groupId,busy:window.__kokmatchGroupSwitching12===true,disabled:!!b?.disabled,cls:b?.className||'',fix1:window.__kokmatchV56Fix1Patch,fix2:window.__kokmatchV56Fix2Patch,build:window.__kokmatchV56Fix2Build}});
            const badDialogs=dialogs.filter(x=>x!=='프로필 사진을 변경했어.');
            console.log('RESULT',JSON.stringify({result,profileGets,profilePosts,switchAuths,stateGets,dialogs,pageErrors}));
            if(profileGets>12)throw new Error('profile request storm '+profileGets);if(switchAuths!==2)throw new Error('switch auth count '+switchAuths);if(result.busy||/groupSwitching12|switching52/.test(result.cls))throw new Error('switch UI stuck '+JSON.stringify(result));if(badDialogs.length||pageErrors.length)throw new Error('unexpected errors '+badDialogs.join('|')+' '+pageErrors.join('|'));
            console.log('PASS V5.6 UPDATE PROFILE GROUP SWITCH');
          } finally {await browser.close()}
          EOF
      - name: Run iPhone QA and capture diagnostics
        shell: bash
        run: |
          set +e
          node qa.mjs > qa-v56.log 2>&1
          rc=$?
          cat qa-v56.log
          echo "$rc" > qa-v56.exit
          exit 0
      - name: Upload WebKit QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-v56-webkit-diagnostics
          path: |
            qa-v56.log
            qa-v56.exit
          retention-days: 1
      - name: Enforce QA result
        shell: bash
        run: |
          rc=$(cat qa-v56.exit)
          if [ "$rc" != "0" ]; then
            echo "WebKit QA failed with exit $rc"
            cat qa-v56.log
            exit "$rc"
          fi
