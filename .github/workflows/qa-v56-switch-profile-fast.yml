name: QA v5.6 switch profile fast
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.6-pre.js'
      - 'app-v5.6.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
      - '.github/workflows/qa-v56-switch-profile-fast.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Fail-fast iPhone member switch and profile QA
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const img='data:image/jpeg;base64,QA_PROFILE_IMAGE';
          const members=[{id:'self',name:'QA사용자',year:'1989',gender:'남',cls:'C',type:'member',role:'member',state:'out',totalGames:0},{id:'f1',name:'여회원',year:'1992',gender:'여',cls:'D',type:'member',role:'member',state:'out',totalGames:0}];
          const timeout=(name,p,ms=10000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT '+name)),ms))]);
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13'],serviceWorkers:'block'});
          const p=await ctx.newPage(); p.setDefaultTimeout(10000);
          let profileGets=0,switchAuths=0,stateGets=0; const dialogs=[],pageErrors=[];
          p.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()}); p.on('pageerror',e=>pageErrors.push(String(e)));
          const state=gid=>({data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:[],user:{role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:gid}});
          await p.route(AUTH+'**',async route=>{const b=route.request().postDataJSON?.()||{};if(b.action==='switch_group'){switchAuths++;console.log('AUTH_SWITCH',b.groupId);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,keepToken:false,token:'token-'+b.groupId,groupId:b.groupId,groupName:b.groupId==='grp_b'?'B모임':'A모임',role:'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member'}]})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
          await p.route(MULTI+'**',async route=>{const u=new URL(route.request().url());const api=u.searchParams.get('api');if(api==='state'){stateGets++;const gid=u.searchParams.get('groupId')||'grp_a';console.log('STATE_GET',gid);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(state(gid))})}return route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'})});
          await p.route(PROFILE+'**',async route=>{if(route.request().method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});profileGets++;const gid=new URL(route.request().url()).searchParams.get('groupId');console.log('PROFILE_GET',gid,profileGets);await new Promise(r=>setTimeout(r,500));return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:gid==='grp_b'?{self:{image:img}}:{}})})});
          await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members,memberCount:2,adminBadgeVisibility:'all'})}));
          console.log('STEP goto');
          await timeout('goto',p.goto('https://kkokmatch.github.io/?qa=v56fast&t='+Date.now(),{waitUntil:'domcontentloaded'}),15000);
          console.log('STEP wait core');
          await timeout('core',p.waitForFunction(()=>window.__kokmatchV56===true&&window.__kokmatchV56Patch==='1.3'&&window.__kokmatchV56Pre===true&&window.__kokmatchVersionLock==='5.6'),15000);
          console.log('STEP seed');
          await timeout('seed',p.evaluate(members=>{T='token-grp_a';currentGroupId='grp_a';S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_a',name:'A모임'};groups=[];me={role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:'grp_a'};currentView='members';localStorage.setItem('kokmatch_token',T);localStorage.setItem('kokmatch_group_id','grp_a');renderAll();document.getElementById('login')?.classList.add('hide')},members));
          await p.waitForTimeout(1200);
          console.log('STEP switch B');
          const ok=await timeout('switch B',p.evaluate(()=>window.switchOwnGroup38('grp_b')),10000);
          console.log('SWITCH_B_RESULT',ok);
          if(ok!==true)throw new Error('switch B returned '+ok+' dialogs='+dialogs.join('|'));
          await timeout('state B',p.waitForFunction(()=>currentGroupId==='grp_b'&&group?.groupId==='grp_b'),5000);
          console.log('STEP profile B');
          await timeout('profile B',p.waitForFunction(img=>{const card=[...document.querySelectorAll('#members .memberCard')].find(c=>c.dataset.memberId56==='self'||c.querySelector(':scope>.profileIdentity80')?.dataset.memberId==='self');return card?.querySelector(':scope>.profileIdentity80 img')?.getAttribute('src')===img},img),8000);
          console.log('STEP switch A');
          const back=await timeout('switch A',p.evaluate(()=>window.switchOwnGroup38('grp_a')),10000);
          console.log('SWITCH_A_RESULT',back);
          if(back!==true)throw new Error('switch A returned '+back);
          await timeout('state A',p.waitForFunction(()=>currentGroupId==='grp_a'&&group?.groupId==='grp_a'),5000);
          await p.waitForTimeout(800);
          const result=await timeout('inspect',p.evaluate(()=>{const b=document.getElementById('groupBtn');return{group:currentGroupId,grp:group?.groupId,busy:window.__kokmatchGroupSwitching12===true,disabled:!!b?.disabled,cls:b?.className||'',title:document.title,version:document.documentElement.dataset.kokmatchVersion}}));
          console.log('RESULT',JSON.stringify({result,profileGets,switchAuths,stateGets,dialogs,pageErrors}));
          if(profileGets>5)throw new Error('profile storm '+profileGets);
          if(switchAuths!==2)throw new Error('switch auth count '+switchAuths);
          if(result.busy||/groupSwitching12|switching52/.test(result.cls))throw new Error('switch UI stuck '+JSON.stringify(result));
          if(result.title!=='콕매치 v5.6'||result.version!=='5.6')throw new Error('version mismatch '+JSON.stringify(result));
          if(dialogs.length||pageErrors.length)throw new Error('unexpected errors '+dialogs.join('|')+' '+pageErrors.join('|'));
          console.log('PASS V5.6 MEMBER SWITCH PROFILE');
          await browser.close();
          EOF
          node qa.mjs
