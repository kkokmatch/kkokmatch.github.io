name: QA v5.4 hotfix2
on:
  push:
    paths:
      - '.github/workflows/qa-v54-hotfix2.yml'
      - 'app-v5.4.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: live browser qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844}});
          let committed='',getStarted=false,resolveGet;
          const gate=new Promise(r=>resolveGet=r);
          await p.route('**/kokmatch-profile-v53**',async route=>{
            const req=route.request();
            if(req.method()==='POST'){
              const body=JSON.parse(req.postData()||'{}'); committed=body.image||'';
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,image:committed})});
              resolveGet?.(); return;
            }
            getStarted=true; await gate; await new Promise(r=>setTimeout(r,300));
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{}})});
          });
          await p.goto('https://kkokmatch.github.io/?qa=hotfix2&t='+Date.now(),{waitUntil:'networkidle'});
          await p.waitForFunction(()=>document.documentElement.dataset.kokmatchVersion==='5.4'&&window.__kokmatchV54Hotfix2===true,{timeout:30000});
          await p.evaluate(()=>{
            T='fake-token';currentGroupId='qa-hotfix2';currentView='queue';S=emptyClientState();
            S.members=[
              {id:'m1',name:'남자A',gender:'남',age:'30',cls:'C',type:'member',role:'organizer',totalGames:0,state:'waiting',joinedAt:Date.now()-30000},
              {id:'m2',name:'여자B',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-20000},
              {id:'m3',name:'남자C',gender:'남',age:'40',cls:'D',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-10000}
            ];S.queue=['m1','m2','m3'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};
            me={memberId:'m1',displayName:'남자A',role:'organizer',groupId:'qa-hotfix2'};group={groupId:'qa-hotfix2',name:'QA'};groups=[];normalizeClient();
            localStorage.removeItem('kokmatch_draft_v54_qa-hotfix2');draft.splice(0,draft.length,null,null,null,null);renderAll();
            document.getElementById('login')?.classList.add('hide');document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'));
          });
          await p.locator('#queue .queueCard').nth(0).click(); await p.waitForTimeout(100);
          let filled=await p.locator('.composer54 .slot54.filled').count(); if(filled!==1)throw new Error('first queue click failed '+filled);
          await p.locator('#queue .queueCard').filter({hasText:'여자B'}).click(); await p.waitForTimeout(100);
          filled=await p.locator('.composer54 .slot54.filled').count(); if(filled!==2)throw new Error('second queue click failed '+filled);
          const layout=await p.locator('.composer54 .slot54.filled').evaluateAll(xs=>xs.map(x=>({gender:x.querySelectorAll('.composerGender54').length,profile:x.querySelectorAll('.profileAvatar53,.genderAvatar39,.genderPerson54').length,topRole:x.querySelectorAll('.slotTop53 .roleBadge').length,nameGrade:x.querySelectorAll('.slotName53 .gradeBadge50,.slotName53 .tag').length,nameRole:x.querySelectorAll('.slotName53 .roleBadge').length})));
          console.log('LAYOUT',JSON.stringify(layout));if(layout.some(x=>x.gender!==1||x.profile!==0||x.nameGrade<1||x.nameRole!==0))throw new Error('composer layout mismatch');
          await p.locator('.composer54 .slot54.filled .slotX').first().click(); await p.waitForTimeout(100);
          filled=await p.locator('.composer54 .slot54.filled').count(); if(filled!==1)throw new Error('slot remove click failed '+filled);
          await p.locator('#queue .queueCard').filter({hasText:'남자C'}).click(); await p.waitForTimeout(100);
          filled=await p.locator('.composer54 .slot54.filled').count(); if(filled!==2)throw new Error('click after remove failed '+filled);
          console.log('CLICK_FLOW_OK',filled);
          await p.evaluate(()=>{currentView='settings';goView('settings')});
          await p.waitForFunction(()=>document.querySelector('#profileFile53'));
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR4nGP8z8DAwMDAxMDAwMAAAAwAAf8CBWkAAAAASUVORK5CYII=','base64');
          await p.locator('#profileFile53').setInputFiles({name:'profile.png',mimeType:'image/png',buffer:png});
          await p.waitForFunction(()=>document.querySelector('#profileCard53 img')&&document.querySelector('#queue .queueCard img'),{timeout:10000});
          await p.waitForTimeout(800);
          const photo=await p.evaluate(()=>({preview:document.querySelectorAll('#profileCard53 img').length,queue:document.querySelectorAll('#queue .queueCard')[0]?.querySelectorAll('img').length||0}));
          console.log('PHOTO_AFTER_STALE_GET',JSON.stringify(photo),'POST',!!committed);
          if(photo.preview!==1||photo.queue!==1||!committed)throw new Error('profile single-selection did not persist');
          await p.screenshot({path:'hotfix2.png',fullPage:true});await b.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hotfix2-screen
          path: hotfix2.png
