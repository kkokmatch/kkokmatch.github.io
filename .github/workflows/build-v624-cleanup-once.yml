name: Build v6.24 cleanup once
on:
  push:
    paths:
      - '.github/workflows/build-v624-cleanup-once.yml'
      - 'scripts/build-v624-remove-legacy-poll.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit remaining old poll selectors
        run: |
          grep -n -C 3 -E 'pollCalDay21|pollWrap90|pollCard21|decoratePollCards33|decoratePollNow51|patchPollCounts18' app-v6.23.js || true
      - name: Build cleaned v6.24 runtime
        run: node scripts/build-v624-remove-legacy-poll.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Boot diagnostic
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Current mobile runtime QA
        run: node scripts/qa-current-runtime.mjs
      - name: Partner and poll regression QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Verify single poll path
        run: |
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('app-v6.24.js','utf8');
          const olds=['kokmatch-v18-api','kokmatch-v19-api','kokmatch-v74-api','kokmatch-v76-api','kokmatch-v90-api','pollWrap90','pollCard21','pollCalDay21','decoratePollCards33','decoratePollNow51','patchPollCounts18'];
          for(const x of olds)if(s.includes(x))throw new Error('legacy poll dependency remains: '+x);
          if(!s.includes('kokmatch-v21-api'))throw new Error('v21 canonical poll API missing');
          console.log('PASS single canonical poll path: v21 only for poll operations');
          NODE
      - name: Commit v6.24 only after all QA passes
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git add app-v6.24.js app-v6.24.css index.html latest-version.json
          git commit -m 'v6.24 remove legacy poll dependencies and stabilize runtime'
          git push
