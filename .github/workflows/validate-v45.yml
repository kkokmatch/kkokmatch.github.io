name: Validate Kokmatch v45
on:
  push:
    branches: [main]
    paths:
      - 'app-v45.js'
      - 'app-v45.css'
      - 'index.html'
      - '.github/workflows/validate-v45.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check v45 JavaScript syntax
        run: node --check app-v45.js
      - name: Verify v45 module wiring
        run: |
          grep -q 'data-kokmatch-version="5.4"' index.html
          grep -q 'app-v45.js?v=45' index.html
          grep -q 'app-v45.css?v=45' index.html
          grep -q 'fmInviter45' app-v45.js
          grep -q '게스트' app-v45.js
          grep -q 'memberMainLine45' app-v45.css
          grep -q '총 게임' app-v45.js
          grep -q '초대 ' app-v45.js
          grep -q 'selfStaff' app-v45.js
      - name: Mark validation success
        run: |
          printf 'v45 module syntax, current-shell wiring, member nowrap and guest inviter validation passed\n' > v45-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add v45-validation-ok.txt
          git commit -m "Validate v45 deployment" || exit 0
          git push
