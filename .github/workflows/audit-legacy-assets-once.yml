name: Audit legacy app assets once

on:
  push:
    paths:
      - '.github/workflows/audit-legacy-assets-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current runtime guard
        run: node scripts/validate-standalone-runtime.mjs
      - name: Audit legacy root app assets from live files only
        shell: bash
        run: |
          set -euo pipefail
          current_js='app-v6.23.js'
          current_css='app-v6.23.css'
          mapfile -t assets < <(find . -maxdepth 1 -type f \( -name 'app-v*.js' -o -name 'app-v*.css' \) -printf '%f\n' | sort -V)
          printf 'TOTAL_APP_ASSETS=%s\n' "${#assets[@]}"
          referenced=0
          unreferenced=0
          for f in "${assets[@]}"; do
            [[ "$f" == "$current_js" || "$f" == "$current_css" ]] && continue
            refs=$(find . -type f \
              ! -path './.git/*' ! -path './node_modules/*' \
              ! -name 'app-v*.js' ! -name 'app-v*.css' \
              -print0 | xargs -0 grep -IlF -- "$f" 2>/dev/null || true)
            if [[ -n "$refs" ]]; then
              referenced=$((referenced+1))
              echo "LIVE_REFERENCE $f"
              while IFS= read -r ref; do echo "  <- $ref"; done <<< "$refs"
            else
              unreferenced=$((unreferenced+1))
              echo "DEAD_ASSET $f"
            fi
          done
          echo "REFERENCED_LEGACY=$referenced"
          echo "UNREFERENCED_LEGACY=$unreferenced"
      - name: Audit non-current runtime references
        run: |
          echo '--- references from live non-legacy files ---'
          find . -type f ! -path './.git/*' ! -path './node_modules/*' ! -name 'app-v*.js' ! -name 'app-v*.css' -print0 \
            | xargs -0 grep -nE 'app-v[0-9]+([.][0-9]+)?[.](js|css)|/launch/v|hotfix|fix[0-9]+' || true
      - name: Audit temporary QA/build files
        run: |
          find .github/workflows scripts -maxdepth 2 -type f | sort | grep -E 'audit|once|focused|debug|build-v623|poll-v623|roster-v623' || true
