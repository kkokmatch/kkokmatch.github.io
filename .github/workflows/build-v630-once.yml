name: Build v6.30 once
on:
  push:
    paths:
      - '.github/workflows/build-v630-once.yml'
      - 'scripts/build-v630.py'
      - 'scripts/qa-v630-first-login.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.30 candidate
        run: python3 scripts/build-v630.py
      - name: Remove duplicate legacy forced-login resume fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-v6.30.js')
          s=p.read_text()
          needle="if(resumeOnce54(last?.message||'loadState'))return new Promise(()=>{});"
          count=s.count(needle)
          if count:
              s=s.replace(needle,'')
              p.write_text(s)
          print('removed legacy resume fallbacks:',count)
          PY
      - name: Syntax and standalone checks
        run: |
          node --check app-v6.30.js
          node scripts/validate-standalone-runtime.mjs
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('app-v6.30.js','utf8');
          const css=fs.readFileSync('app-v6.30.css','utf8');
          for(const s of ['window.__kokmatchLoginStable630','__kokmatchFreshLoginUntil630','pwaInstallSteps630','지금 설치','ready630'])if(!js.includes(s))throw new Error('missing v6.30 marker: '+s);
          if(js.includes("if(resumeOnce54(last?.message||'loadState'))return new Promise(()=>{})"))throw new Error('legacy forced login resume remains');
          if(!css.includes('.pwaInstallSteps630')||!css.includes('min-height:min(70vh,620px)'))throw new Error('large install guide CSS missing');
          console.log('PASS v6.30 static install/login checks');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Adapt existing QA for intentional PWA modal
        run: |
          cp scripts/qa-current-runtime.mjs /tmp/qa-current-runtime.mjs.bak
          cp scripts/qa-partner-poll-current.mjs /tmp/qa-partner-poll-current.mjs.bak
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-current-runtime.mjs');s=p.read_text()
          needle='  await page.waitForTimeout(350);'
          repl="  await page.waitForTimeout(350);\n  await page.locator('#pwaSecondary629').click({timeout:1500}).catch(()=>{});"
          if needle not in s: raise SystemExit('roster QA insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          p=Path('scripts/qa-partner-poll-current.mjs');s=p.read_text()
          needle="\n  await page.evaluate(()=>window.openPartner66('mgr'));"
          repl="\n  await page.waitForTimeout(900);\n  await page.locator('#pwaSecondary629').click({timeout:1500}).catch(()=>{});\n  await page.evaluate(()=>window.openPartner66('mgr'));"
          if needle not in s: raise SystemExit('focused QA insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Existing boot QA
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Existing roster QA
        run: node scripts/qa-current-runtime.mjs
      - name: Existing partner and poll QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: First-login persistence QA
        run: node scripts/qa-v630-first-login.mjs
      - name: PWA service worker smoke QA
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});try{const p=await b.newPage();await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const href=await p.locator('link[rel="manifest"]').getAttribute('href');if(!href?.includes('6.30'))throw new Error('v6.30 manifest href missing');const sw=await p.evaluate(async()=>{const r=await navigator.serviceWorker.ready;return r?.active?.scriptURL||''});if(!sw.includes('kokmatch-sw.js'))throw new Error('canonical service worker inactive');console.log('PASS v6.30 PWA service worker smoke');}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit only after all QA passes
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          cp /tmp/qa-current-runtime.mjs.bak scripts/qa-current-runtime.mjs
          cp /tmp/qa-partner-poll-current.mjs.bak scripts/qa-partner-poll-current.mjs
          rm -f .github/workflows/build-v630-once.yml scripts/build-v630.py scripts/qa-v630-first-login.mjs
          git add app-v6.30.js app-v6.30.css index.html latest-version.json kokmatch-sw.js sw.js .github/workflows/build-v630-once.yml scripts/build-v630.py scripts/qa-v630-first-login.mjs
          git commit -m 'v6.30 enlarge PWA guide and stabilize first login'
          git push
