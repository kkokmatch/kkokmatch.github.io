name: QA v5.4 stats usability 15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v54-stats-usability15.yml'
      - 'app-v5.4-fix12.js'
      - 'app-v5.4-fix14.js'
      - 'app-v5.4-fix15.js'
      - 'app-v5.4-hotfix-loader.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify production stats usability
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const STATS='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-stats-v54';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const today='2026-08-27', grades=['A','B','C','D','E'];
          const members=Array.from({length:45},(_,i)=>({id:i===0?'self':`p${i+1}`,name:i===0?'QA사용자':`회원${String(i+1).padStart(2,'0')}`,age:String(20+(i%4)*10),gender:i%2?'여':'남',cls:grades[i%5],type:'member',role:'member',state:i<5?'waiting':'out',totalGames:i<4?1:0}));
          members[0].age='30';members[0].cls='C';members[0].gender='남';
          const games=[{gameId:'g1',businessDay:today,startedAt:Date.parse('2026-08-27T10:00:00+09:00'),endedAt:Date.parse('2026-08-27T10:18:00+09:00'),durationMin:18,players:['self','p2','p3','p4'],playerNames:['QA사용자','회원02','회원03','회원04']}];
          const browser=await webkit.launch({headless:true});const p=await browser.newPage({...devices['iPhone 13']});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.route(STATS+'**',route=>{const u=new URL(route.request().url());return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,groupId:'grp_qa',today,from:u.searchParams.get('from')||today,to:u.searchParams.get('to')||today,month:'2026-08',selfMemberId:'self',members,rangeGames:games,monthGames:games,baselines:[]})})});
          await p.route(PROFILE+'**',route=>route.fulfill({status:200,contentType:'application/json',body:'{"profiles":{}}'}));
          await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members:members.slice(0,5),memberCount:5,adminBadgeVisibility:'all'})}));
          let loaded=false;for(let i=0;i<10&&!loaded;i++){await p.goto('https://kkokmatch.github.io/?qa=stats15stable&t='+Date.now(),{waitUntil:'domcontentloaded'});try{await p.waitForFunction(()=>window.__kokmatchStatsUiPatch==='12.2'&&window.__kokmatchPersonalStatsPatch==='14.0'&&window.__kokmatchStatsUsabilityPatch==='15.0'&&window.__kokmatchStatsUsabilityPerfPatch==='15.1'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});loaded=true}catch{}}
          if(!loaded)throw new Error('latest stats patches not loaded');
          await p.evaluate(({small,today})=>{T='qa-token';currentGroupId='grp_qa';S={dayKey:today,courtCount:4,courtNames:['1','2','3','4'],members:small,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_qa',name:'QA'};groups=[];me={role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:'grp_qa'};normalizeClient();const qaStyle=document.createElement('style');qaStyle.textContent='#login{display:none!important;pointer-events:none!important}';document.head.appendChild(qaStyle);currentView='stats';renderAll();goView('stats')},{small:members.slice(0,5),today});
          await p.waitForSelector('.statsPeriodGrid11',{state:'visible'});
          await p.waitForFunction(()=>{const b=document.querySelector('#statsBody11');return b&&!/불러오는 중/.test(b.textContent||'')},{timeout:20000});
          const notice=(await p.locator('.statsRangeNotice12').textContent())||'';if(!notice.includes('31일'))throw new Error('31-day notice missing: '+notice);
          await p.locator('[data-tab11="personal"]').click();
          await p.waitForSelector('.personalTable11.statsPersonal14',{state:'visible',timeout:15000});await p.waitForTimeout(200);
          if(await p.locator('.personalTable11 tbody tr').count()!==45)throw new Error('expected 45 personal rows');
          if(await p.locator('.personalTable11 tbody tr:visible').count()!==20)throw new Error('expected 20 visible rows');
          const pager=(await p.locator('.statsPager15').textContent())||'';if(!pager.includes('1 / 3')||!pager.includes('총 45명'))throw new Error('pager failed: '+pager);
          const gradeState=await p.evaluate(()=>['A','B','C','D','E'].map(g=>{const b=[...document.querySelectorAll('.personBadgeLink14')].find(x=>(x.textContent||'').trim().toUpperCase().endsWith(g));const s=b?.querySelector('.gradeBadge50');return{g,text:(b?.textContent||'').trim(),cls:s?.className||'',bg:s?getComputedStyle(s).backgroundColor:''}}));
          for(const x of gradeState){if(!x.cls.includes(`grade-${x.g.toLowerCase()}50`))throw new Error('bad grade class '+JSON.stringify(gradeState));}
          if(new Set(gradeState.map(x=>x.bg)).size!==5)throw new Error('grade colors not distinct '+JSON.stringify(gradeState));
          const medals=await p.evaluate(()=>['r1','r2','r3'].map(k=>{const e=document.querySelector('.rank11.'+k),s=getComputedStyle(e);return{bg:s.backgroundImage,border:s.borderColor}}));if(medals.some(x=>x.bg==='none')||new Set(medals.map(x=>x.bg)).size!==3)throw new Error('medals failed '+JSON.stringify(medals));
          await p.locator('[data-page15="next"]').click();await p.waitForTimeout(100);if(!((await p.locator('.statsPager15').textContent())||'').includes('2 / 3'))throw new Error('page 2 failed');
          await p.locator('th[data-sort11="name"]').click();await p.waitForTimeout(180);if(!((await p.locator('.statsPager15').textContent())||'').includes('1 / 3'))throw new Error('sort page reset failed');
          await p.locator('#statsFrom11').evaluate(e=>{e.value='2026-08-01';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForTimeout(250);
          await p.locator('#statsTo11').evaluate(e=>{e.value='2026-08-31';e.dispatchEvent(new Event('change',{bubbles:true}))});
          await p.waitForFunction(()=>{const f=document.getElementById('statsFrom11'),t=document.getElementById('statsTo11'),b=document.querySelector('#statsBody11');return f?.value==='2026-08-01'&&t?.value==='2026-08-31'&&b&&!/불러오는 중/.test(b.textContent||'')},{timeout:20000});
          await p.locator('[data-tab11="personal"]').click();await p.waitForSelector('.personalTable11.statsPersonal14',{state:'visible'});await p.waitForTimeout(150);
          const after=await p.evaluate(()=>[...document.querySelectorAll('.personBadgeLink14 .gradeBadge50')].every(x=>/grade-[a-e]50/.test(x.className)));if(!after)throw new Error('grade colors lost after date reload');
          await p.locator('#statsTo11').evaluate(e=>{e.value='2026-09-15';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForTimeout(100);
          const range=await p.evaluate(()=>[document.getElementById('statsFrom11').value,document.getElementById('statsTo11').value]);const span=(Date.parse(range[1]+'T00:00:00Z')-Date.parse(range[0]+'T00:00:00Z'))/86400000;if(span>30)throw new Error('range cap failed '+JSON.stringify(range));
          const version=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock}));if(version.title!=='콕매치 v5.4'||version.data!=='5.4'||version.lock!=='5.4')throw new Error('version changed '+JSON.stringify(version));
          if(errors.length)throw new Error(errors.join(' | '));console.log('PASS stats usability 15',gradeState,medals,range,version);await browser.close();
          EOF
          node qa.mjs
