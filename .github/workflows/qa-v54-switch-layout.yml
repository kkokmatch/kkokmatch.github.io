name: QA v5.4 switch and iPhone stats
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v54-switch-layout.yml'
      - 'app-v5.4-fix11.js'
      - 'app-v5.4-fix12.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: live production group switching and photo-style stats
        run: |
          cat > qa-switch.mjs <<'EOF'
          import { chromium, webkit, devices } from 'playwright';
          const PROD='https://kkokmatch.github.io/?qa=stats111&t=';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const STATS='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-stats-v54';
          const today='2026-08-27';
          const members=(role='member',type='member',temp=false)=>[
            {id:'self',name:'QA사용자',age:'30',year:'1989',gender:'남',cls:'C',type,role,state:'waiting',joinedAt:Date.now()-600000,totalGames:5,attendanceHistory:{'2026-08':4},attendanceLastDay:today,tempOrganizerDay:temp?today:''},
            {id:'p2',name:'여자회원',age:'20',year:'2001',gender:'여',cls:'B',type:'member',role:'member',state:'waiting',totalGames:3},
            {id:'p3',name:'남자회원',age:'40',year:'1982',gender:'남',cls:'D',type:'member',role:'member',state:'out',totalGames:1},
            {id:'p4',name:'회원제로',age:'50',year:'1975',gender:'여',cls:'A',type:'member',role:'member',state:'out',totalGames:0}
          ];
          const games=[
            {gameId:'g1',businessDay:'2026-08-27',startedAt:Date.parse('2026-08-27T10:00:00+09:00'),endedAt:Date.parse('2026-08-27T10:18:00+09:00'),durationMin:18,players:['self','p2','p3','p4'],playerNames:['QA사용자','여자회원','남자회원','회원제로']},
            {gameId:'g2',businessDay:'2026-08-26',startedAt:Date.parse('2026-08-26T20:45:00+09:00'),endedAt:Date.parse('2026-08-26T21:10:00+09:00'),durationMin:25,players:['self','p2','p3','p4'],playerNames:['QA사용자','여자회원','남자회원','회원제로']}
          ];
          function state(gid,mode){const global=mode==='developer',type=mode==='guest'?'guest':'member',temp=mode==='temp',role=global?'admin':mode==='manager'?'manager':mode==='organizer'?'organizer':'member';return {data:{dayKey:today,courtCount:4,courtNames:['1코트','2코트','3코트','4코트'],members:members(role,type,temp),queue:['self','p2'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:[],user:{role,displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid,tempOrganizer:temp}}}
          function stats(gid){return {success:true,groupId:gid,today,from:'2026-08-26',to:today,month:'2026-08',selfMemberId:'self',members:members(),rangeGames:games,monthGames:games,baselines:[]}}
          async function routes(p,modeRef){
            await p.route(AUTH+'**',async route=>{const r=route.request();if(r.method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});const b=r.postDataJSON?.()||{};if(b.action==='switch_group'){const gid=String(b.groupId||'grp_b'),global=modeRef.mode==='developer';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,keepToken:global,token:global?undefined:'qa-token-'+gid,groupId:gid,groupName:gid==='grp_b'?'B모임':'A모임',role:global?'admin':modeRef.mode==='manager'?'manager':modeRef.mode==='organizer'?'organizer':'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member'}]})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
            await p.route(MULTI+'**',async route=>{const u=new URL(route.request().url());if(u.searchParams.get('api')==='state')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(state(u.searchParams.get('groupId')||'grp_a',modeRef.mode))});return route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'})});
            await p.route(PROFILE+'**',route=>route.fulfill({status:200,contentType:'application/json',body:'{"profiles":{}}'}));
            await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members:members(),memberCount:4,adminBadgeVisibility:'all'})}));
            await p.route(STATS+'**',route=>{const u=new URL(route.request().url());return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(stats(u.searchParams.get('groupId')||'grp_a'))})});
          }
          async function boot(p){for(let i=0;i<8;i++){await p.goto(PROD+Date.now(),{waitUntil:'domcontentloaded'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix12===true&&window.__kokmatchStatsPatch==='11.1'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});return}catch{await p.waitForTimeout(300)}}throw new Error('latest v5.4 stats patch not loaded')}
          async function setMode(p,mode,view='members',gid='grp_a'){await p.evaluate(({mode,view,gid,today})=>{const global=mode==='developer',type=mode==='guest'?'guest':'member',temp=mode==='temp',role=global?'admin':mode==='manager'?'manager':mode==='organizer'?'organizer':'member';T='qa-token-'+gid;currentGroupId=gid;S={dayKey:today,courtCount:4,courtNames:['1코트','2코트','3코트','4코트'],members:[{id:'self',name:'QA사용자',age:'30',year:'1989',gender:'남',cls:'C',type,role,state:'waiting',joinedAt:Date.now()-600000,totalGames:5,tempOrganizerDay:temp?today:''},{id:'p2',name:'여자회원',age:'20',gender:'여',cls:'B',type:'member',role:'member',state:'waiting',totalGames:3},{id:'p3',name:'남자회원',age:'40',gender:'남',cls:'D',type:'member',role:'member',state:'out',totalGames:1},{id:'p4',name:'회원제로',age:'50',gender:'여',cls:'A',type:'member',role:'member',state:'out',totalGames:0}],queue:['self','p2'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:gid,name:gid==='grp_b'?'B모임':'A모임'};groups=global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:[];me={role,displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid,tempOrganizer:temp};normalizeClient();currentView=view;renderAll();goView(view);document.getElementById('login')?.classList.add('hide')},{mode,view,gid,today})}

          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const modeRef={mode:'developer'};await routes(p,modeRef);const dialogs=[];p.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()});const pageErrors=[];p.on('pageerror',e=>pageErrors.push(String(e)));await boot(p);
          for(const mode of ['developer','manager','organizer','member','guest','temp']){modeRef.mode=mode;for(const view of ['members','queue','playing','stats','settings']){dialogs.length=0;await setMode(p,mode,view,'grp_a');await p.evaluate(async mode=>{if(mode==='developer')await window.adminSwitchGroup38('grp_b');else await window.switchOwnGroup38('grp_b')},mode);await p.waitForFunction(()=>String(currentGroupId)==='grp_b'&&String(group?.groupId)==='grp_b',{timeout:7000});const x=await p.evaluate(()=>({view:currentView,switching:window.__kokmatchGroupSwitching12===true}));if(x.view!==view||x.switching||dialogs.length)throw new Error(`switch failed ${mode}/${view}`)}}if(pageErrors.length)throw new Error(pageErrors.join(' | '));await b.close();

          const wb=await webkit.launch({headless:true});const ip=await wb.newPage({...devices['iPhone 13']});const iMode={mode:'member'};await routes(ip,iMode);const errs=[];ip.on('pageerror',e=>errs.push(String(e)));await boot(ip);await setMode(ip,'member','stats','grp_a');await ip.waitForSelector('.statsPeriodGrid11',{state:'visible'});await ip.waitForTimeout(250);
          const layout=await ip.evaluate(()=>{const r=document.querySelector('.statsPeriodGrid11').getBoundingClientRect(),a=document.getElementById('statsFrom11').getBoundingClientRect(),d=document.querySelector('.periodDash11').getBoundingClientRect(),z=document.getElementById('statsTo11').getBoundingClientRect(),el=document.querySelector('.statsPeriodGrid11');return{r:{l:r.left,r:r.right,w:r.width},a:{l:a.left,r:a.right,w:a.width},d:{l:d.left,r:d.right,w:d.width},z:{l:z.left,r:z.right,w:z.width},client:el.clientWidth,scroll:el.scrollWidth,text:document.querySelector('.periodDash11').textContent,tabs:document.querySelectorAll('.statsTab11').length,patch:window.__kokmatchStatsPatch}});console.log('IPHONE_STATS',layout);if(layout.patch!=='11.1'||layout.tabs!==4||layout.text.trim()!=='~'||layout.a.r>layout.d.l+1||layout.d.r>layout.z.l+1||layout.scroll>layout.client+2)throw new Error('iPhone stats layout failed '+JSON.stringify(layout));
          await ip.locator('[data-tab11="mine"]').click();await ip.waitForSelector('.recordTable11 tbody tr');if(await ip.locator('.recordTable11 tbody tr').count()!==2)throw new Error('my records rows mismatch');
          await ip.locator('[data-tab11="personal"]').click();await ip.waitForSelector('.personalTable11 tbody tr');if(await ip.locator('.personalTable11 tbody tr').count()!==4)throw new Error('personal rows mismatch');const zero=await ip.locator('.personalTable11 .zeroStat11').count();if(zero<1)throw new Error('zero red-bold marker missing');
          await ip.locator('.personalTable11 [data-detail11="self"]').first().click();await ip.waitForSelector('.statsDetailOverlay11.on');const title=await ip.locator('#statsDetailTitle11').textContent();if(!String(title).includes('QA사용자님')||!String(title).includes('게임기록'))throw new Error('detail title mismatch');await ip.locator('.statsDetailClose11').click();
          await ip.locator('.personalTable11 th[data-sort11="name"]').click();await ip.waitForTimeout(80);if(errs.length)throw new Error(errs.join(' | '));console.log('PASS group switch + photo-style stats');await wb.close();
          EOF
          node qa-switch.mjs
