name: QA v5.4 switch and iPhone stats
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v54-switch-layout.yml'
      - 'app-v5.4-fix12.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: live production group switching and iPhone layout
        run: |
          cat > qa-switch.mjs <<'EOF'
          import { chromium, webkit, devices } from 'playwright';
          const PROD='https://kkokmatch.github.io/?qa=switch12&t=';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const STATS='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-stats-v54';
          const today='2026-08-27';
          function members(role='member',type='member',temp=false){return [
            {id:'self',name:'QA사용자',age:'37',year:'1989',gender:'남',cls:'C',type,role,state:'waiting',joinedAt:Date.now()-600000,totalGames:5,attendanceMonth:'2026-08',attendanceCount:2,attendanceHistory:{'2026-08':2},waitDay:today,waitTotalMs:600000,tempOrganizerDay:temp?today:''},
            {id:'p2',name:'회원2',age:'35',year:'1991',gender:'여',cls:'B',type:'member',role:'member',state:'waiting',joinedAt:Date.now()-300000,totalGames:3},
            {id:'p3',name:'회원3',age:'40',year:'1986',gender:'남',cls:'D',type:'member',role:'member',state:'out',joinedAt:null,totalGames:1},
            {id:'p4',name:'회원4',age:'31',year:'1995',gender:'여',cls:'C',type:'member',role:'member',state:'out',joinedAt:null,totalGames:0}
          ]}
          function state(gid,mode){const global=mode==='developer',type=mode==='guest'?'guest':'member',temp=mode==='temp',role=global?'admin':mode==='manager'?'manager':mode==='organizer'?'organizer':'member';const ms=members(role,type,temp);return {data:{dayKey:today,courtCount:4,courtNames:['1코트','2코트','3코트','4코트'],members:ms,queue:['self','p2'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:undefined,user:{role,roleLabel:global?'총관리자':role==='manager'?'모임장':role==='organizer'?'운영진':type==='guest'?'게스트':'일반회원',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid,groupName:gid==='grp_b'?'B모임':'A모임',tempOrganizer:temp}}}
          function stats(gid){return {success:true,groupId:gid,today,from:today,to:today,month:'2026-08',selfMemberId:'self',members:members(),rangeGames:[],monthGames:[],baselines:[]}}
          async function routes(p,modeRef){
            await p.route(AUTH+'**',async route=>{const r=route.request();if(r.method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});const b=r.postDataJSON?.()||{};if(b.action==='switch_group'){const gid=String(b.groupId||'grp_b'),global=modeRef.mode==='developer';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,keepToken:global,token:global?undefined:'qa-token-'+gid,groupId:gid,groupName:gid==='grp_b'?'B모임':'A모임',role:global?'admin':modeRef.mode==='manager'?'manager':modeRef.mode==='organizer'?'organizer':'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member',roleLabel:'일반회원'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member',roleLabel:'일반회원'}],currentPinDefault:false})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
            await p.route(MULTI+'**',async route=>{const u=new URL(route.request().url()),api=u.searchParams.get('api');if(api==='state'){const gid=u.searchParams.get('groupId')||'grp_a';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(state(gid,modeRef.mode))})}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true})})});
            await p.route(PROFILE+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{}})}));
            await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members:members(),memberCount:4,adminBadgeVisibility:'all'})}));
            await p.route(STATS+'**',route=>{const u=new URL(route.request().url());return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(stats(u.searchParams.get('groupId')||'grp_a'))})});
          }
          async function boot(p){let ok=false;for(let i=0;i<8&&!ok;i++){await p.goto(PROD+Date.now(),{waitUntil:'domcontentloaded'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix12===true&&window.__kokmatchGroupSwitchPatch==='12.0'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});ok=true}catch{await p.waitForTimeout(400)}}if(!ok)throw new Error('fix12 not loaded on production')}
          async function setMode(p,mode,view='members',gid='grp_a'){await p.evaluate(({mode,view,gid,today})=>{const global=mode==='developer',type=mode==='guest'?'guest':'member',temp=mode==='temp',role=global?'admin':mode==='manager'?'manager':mode==='organizer'?'organizer':'member';T='qa-token-'+gid;localStorage.setItem('kokmatch_token',T);currentGroupId=gid;localStorage.setItem('kokmatch_group_id',gid);S={dayKey:today,courtCount:4,courtNames:['1코트','2코트','3코트','4코트'],members:[{id:'self',name:'QA사용자',age:'37',year:'1989',gender:'남',cls:'C',type,role,state:'waiting',joinedAt:Date.now()-600000,totalGames:5,attendanceMonth:'2026-08',attendanceCount:2,attendanceHistory:{'2026-08':2},waitDay:today,waitTotalMs:600000,tempOrganizerDay:temp?today:''},{id:'p2',name:'회원2',age:'35',year:'1991',gender:'여',cls:'B',type:'member',role:'member',state:'waiting',joinedAt:Date.now()-300000,totalGames:3},{id:'p3',name:'회원3',age:'40',year:'1986',gender:'남',cls:'D',type:'member',role:'member',state:'out',joinedAt:null,totalGames:1},{id:'p4',name:'회원4',age:'31',year:'1995',gender:'여',cls:'C',type:'member',role:'member',state:'out',joinedAt:null,totalGames:0}],queue:['self','p2'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:gid,name:gid==='grp_b'?'B모임':'A모임'};groups=global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:[];me={role,roleLabel:global?'총관리자':role==='manager'?'모임장':role==='organizer'?'운영진':type==='guest'?'게스트':'일반회원',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid,groupName:group.name,tempOrganizer:temp};normalizeClient();currentView=view;renderAll();goView(view);document.getElementById('login')?.classList.add('hide')},{mode,view,gid,today})}

          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const modeRef={mode:'developer'};await routes(p,modeRef);const dialogs=[];p.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()});const pageErrors=[];p.on('pageerror',e=>pageErrors.push(String(e)));
          await boot(p);
          const modes=['developer','manager','organizer','member','guest','temp'];const views=['members','queue','playing','stats','settings'];
          for(const mode of modes){modeRef.mode=mode;for(const view of views){dialogs.length=0;await setMode(p,mode,view,'grp_a');await p.waitForTimeout(80);await p.evaluate(async({mode})=>{if(mode==='developer')await window.adminSwitchGroup38('grp_b');else await window.switchOwnGroup38('grp_b')},{mode});await p.waitForFunction(()=>String(currentGroupId)==='grp_b'&&String(group?.groupId)==='grp_b',{timeout:7000});const result=await p.evaluate(()=>({gid:currentGroupId,view:currentView,switching:window.__kokmatchGroupSwitching12===true,title:document.title,version:document.documentElement.dataset.kokmatchVersion}));if(result.view!==view)throw new Error(`view changed ${mode}/${view} -> ${result.view}`);if(result.switching)throw new Error(`switch flag stuck ${mode}/${view}`);if(dialogs.length)throw new Error(`dialog ${mode}/${view}: ${dialogs.join(' | ')}`);if(result.title!=='콕매치 v5.4'||result.version!=='5.4')throw new Error('version lock changed');await p.waitForTimeout(60)}}
          if(pageErrors.length)throw new Error('page errors: '+pageErrors.join(' | '));await b.close();

          const wb=await webkit.launch({headless:true});const ip=await wb.newPage({...devices['iPhone 13']});const iMode={mode:'member'};await routes(ip,iMode);const iErrors=[];ip.on('pageerror',e=>iErrors.push(String(e)));await boot(ip);await setMode(ip,'member','stats','grp_a');await ip.waitForSelector('#statsFrom11',{state:'visible',timeout:8000});await ip.waitForSelector('#statsTo11',{state:'visible'});await ip.waitForTimeout(180);const layout=await ip.evaluate(()=>{const r=document.querySelector('.statsRange11')?.getBoundingClientRect(),a=document.getElementById('statsFrom11')?.getBoundingClientRect(),d=document.querySelector('.statsRange11 .dash11')?.getBoundingClientRect(),z=document.getElementById('statsTo11')?.getBoundingClientRect(),el=document.querySelector('.statsRange11');return{vw:innerWidth,r:r&&{l:r.left,r:r.right,w:r.width},a:a&&{l:a.left,r:a.right,w:a.width},d:d&&{l:d.left,r:d.right,w:d.width},z:z&&{l:z.left,r:z.right,w:z.width},client:el?.clientWidth||0,scroll:el?.scrollWidth||0,text:document.querySelector('.dash11')?.textContent||''}});console.log('IPHONE_LAYOUT',layout);if(!layout.r||!layout.a||!layout.d||!layout.z)throw new Error('iPhone range elements missing');if(layout.a.l<layout.r.l-1||layout.z.r>layout.r.r+1)throw new Error('date inputs overflow range');if(layout.d.w<8||layout.text.trim()!=='~')throw new Error('tilde clipped');if(layout.a.r>layout.d.l+1||layout.d.r>layout.z.l+1)throw new Error('range columns overlap');if(layout.scroll>layout.client+2)throw new Error(`range horizontal overflow ${layout.scroll}/${layout.client}`);if(iErrors.length)throw new Error('webkit page errors: '+iErrors.join(' | '));await wb.close();console.log('PASS switch roles/views + iPhone stats layout');
          EOF
          node qa-switch.mjs
