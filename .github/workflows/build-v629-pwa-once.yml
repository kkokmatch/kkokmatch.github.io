name: Build v6.29 PWA once
on:
  push:
    paths:
      - '.github/workflows/build-v629-pwa-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.29 PWA candidate
        run: python3 scripts/build-v629-pwa.py
      - name: Runtime syntax and standalone checks
        run: |
          node --check app-v6.29.js
          node scripts/validate-standalone-runtime.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Existing boot QA
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Existing roster QA with PWA prompt dismissed
        run: |
          cp scripts/qa-current-runtime.mjs /tmp/qa-current-runtime.mjs.bak
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-current-runtime.mjs')
          s=p.read_text()
          needle='  await page.waitForTimeout(350);'
          repl="  await page.waitForTimeout(350);\n  await page.locator('#pwaSecondary629').click({timeout:1500}).catch(()=>{});"
          if needle not in s:
              raise SystemExit('QA insertion point not found')
          p.write_text(s.replace(needle,repl,1))
          PY
          node scripts/qa-current-runtime.mjs
          cp /tmp/qa-current-runtime.mjs.bak scripts/qa-current-runtime.mjs
      - name: Existing partner and polling QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: PWA browser smoke QA
        run: node scripts/qa-v629-pwa.mjs
      - name: Commit only after green QA
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git restore scripts/qa-current-runtime.mjs || true
          rm -f .github/workflows/build-v629-pwa-once.yml scripts/build-v629-pwa.py scripts/qa-v629-pwa.mjs
          git add app-v6.29.js app-v6.29.css index.html latest-version.json manifest.webmanifest kokmatch-sw.js sw.js icons .github/workflows/build-v629-pwa-once.yml scripts/build-v629-pwa.py scripts/qa-v629-pwa.mjs
          git commit -m 'v6.29 add installable PWA and notification guidance'
          git push
