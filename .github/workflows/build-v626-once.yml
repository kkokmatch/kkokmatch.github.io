name: Build v6.26 compact save once
on:
  push:
    paths:
      - '.github/workflows/build-v626-once.yml'
      - 'scripts/build-v626-compact-save.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit member save definitions and interceptors
        run: |
          echo '=== save definitions ==='
          grep -n -C 6 "async function saveMemberEditorV618" app-v6.25.js || true
          echo '=== member_save calls ==='
          grep -n -C 5 "member_save" app-v6.25.js || true
          echo '=== v618 form submit ==='
          grep -n -C 6 "memberEditorFormV618" app-v6.25.js || true
          echo '=== native save flags ==='
          grep -n -C 5 "NativeMemberSave\|memberSave\|submit.*capture" app-v6.25.js || true
      - name: Build v6.26 candidate
        run: node scripts/build-v626-compact-save.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Boot QA
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Roster QA
        run: node scripts/qa-current-runtime.mjs
      - name: Partner poll QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Compact save layout QA
        run: node scripts/qa-save-layout-current.mjs
      - name: Commit only after green QA
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git add app-v6.26.js app-v6.26.css index.html latest-version.json
          git commit -m 'v6.26 activate compact member save path'
          git push