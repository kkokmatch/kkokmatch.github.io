name: Release v6.42 once

on:
  push:
    paths:
      - 'scripts/build-v642.py'
      - 'scripts/qa-ui-v642.mjs'
      - '.github/workflows/release-v642-once.yml'

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v6.42 and archive v6.41
        run: python3 scripts/build-v642.py

      - name: Syntax and targeted validation
        run: |
          node --check app-v6.42.js
          node scripts/qa-ui-v642.mjs
          node scripts/validate-standalone-runtime.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          echo $! >/tmp/kokmatch-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-http.log
          exit 1

      - name: Guard QA from PWA permission overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs']
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1')}catch{};document.addEventListener('DOMContentLoaded',()=>{const drop=()=>document.getElementById('pwaPrompt629')?.remove();drop();new MutationObserver(drop).observe(document.body,{childList:true,subtree:true})},{once:true})});\n"""
          for name in files:
              p=Path(name);s=p.read_text(encoding='utf-8')
              s2,n=re.subn(r'(const page=await browser\.newPage\([^\n]+\);\n)',r'\1'+guard,s,count=1)
              if n!=1: raise SystemExit(f'QA page insertion point missing: {name}')
              p.write_text(s2,encoding='utf-8')
          PY

      - name: Existing runtime regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs

      - name: Commit release only after green QA
        run: |
          git checkout -- scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v6.42.js app-v6.42.css index.html latest-version.json manifest.webmanifest kokmatch-sw.js sw.js versions/v6.41/index.html
          git rm scripts/build-v642.py scripts/qa-ui-v642.mjs .github/workflows/release-v642-once.yml
          git commit -m 'Release v6.42 white roster and queue grade stripes'
          git push origin main
