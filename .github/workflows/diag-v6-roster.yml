name: Diagnose v6 roster integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-v6-roster.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect member roster, groups and partner hooks
        run: |
          echo '=== FILE SIZE ==='
          wc -l app-v6.0.js app-v6.0.css
          echo '=== renderMembers definitions ==='
          grep -n -E '(^|[^A-Za-z])renderMembers[[:space:]]*(=|\()' app-v6.0.js | tail -80 || true
          echo '=== group switch definitions ==='
          grep -n -E 'openGroupSwitch|switchGroup|groupBtn' app-v6.0.js | tail -100 || true
          echo '=== partner/pair hooks ==='
          grep -ni -E 'partner|파트너|openPairs|pairBtn|pairCount|preferred' app-v6.0.js | tail -160 || true
          echo '=== attendance/month hooks ==='
          grep -ni -E 'attendance|출석|month|monthly|8월|visit' app-v6.0.js | tail -160 || true
          echo '=== member card/role badge hooks ==='
          grep -n -E 'memberCard|memberBtns|roleBadge|roleLabel|ageTag|gamecnt' app-v6.0.js | tail -160 || true
          echo '=== related CSS ==='
          grep -n -E 'memberCard|memberBtns|roleBadge|pairBtn|attendance|partner|classBadge|grade' app-v6.0.css | tail -200 || true
