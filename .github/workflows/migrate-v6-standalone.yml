name: Build Kokmatch v6 standalone
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v6-baseline.mjs'
      - '.github/workflows/migrate-v6-standalone.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone v6 runtime
        run: node scripts/build-v6-baseline.mjs
      - name: Validate single-version runtime
        run: |
          node --check app-v6.0.js
          test "$(grep -o 'app-v6.0.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'app-v6.0.css' index.html | wc -l)" -eq 1
          ! grep -Eq 'app-v(35|36|37|38|39|4[0-9]|5[0-9]|6[1-9]|7[0-9]|8[0-9]|9[0-9]|1\.|2\.|3\.|4\.|5\.)' index.html
          ! grep -F ".src='/app-v" app-v6.0.js
          ! grep -F '.src="/app-v' app-v6.0.js
          grep -q 'standalone runtime' app-v6.0.js
          grep -q 'standalone stylesheet' app-v6.0.css
      - name: Commit v6 standalone baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v6.0.js app-v6.0.css index.html latest-version.json v6-baseline-manifest.json
          git commit -m "Build standalone v6.0 runtime [skip ci]" || exit 0
          git push
