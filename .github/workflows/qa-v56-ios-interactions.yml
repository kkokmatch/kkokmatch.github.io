name: QA v5.6 iPhone interactions
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.6-fix3.js'
      - 'app-v5.6-fix4.js'
      - 'app-v5.6-fix5.js'
      - '.github/workflows/qa-v56-ios-interactions.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Run isolated iPhone interaction QA
        run: |
          cat > qa-ios.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const browser=await webkit.launch({headless:true});
          const page=await browser.newPage({...devices['iPhone 13']});
          page.setDefaultTimeout(15000);
          const fixture=`<!doctype html><html><head></head><body>
            <div id="login" class="login hide"><div id="loginBox"></div></div>
            <div class="app"><header class="top"><div class="toprow"><div><div class="groupLine"><button id="groupBtn" class="groupBtn" disabled>모임</button></div></div></div></header>
            <main><section id="members"><div class="profileIdentity80" data-member-id56="self"><img src="data:image/jpeg;base64,THUMB"></div></section><section id="queue"></section><section id="playing"></section></main></div>
            <div id="modal" class="modal"><div id="modalSheet"></div></div>
          </body></html>`;
          await page.route('http://fixture.local/**',route=>route.fulfill({status:200,contentType:'text/html',body:fixture}));
          await page.goto('http://fixture.local/');
          await page.evaluate(()=>{
            window.T='token-grp_a';window.currentGroupId='grp_a';window.currentView='members';
            window.S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members:[{id:'self',name:'김동일',age:'30',cls:'C',state:'waiting',role:'member',type:'member'}],queue:['self'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};
            window.group={groupId:'grp_a',name:'A모임'};window.groups=[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}];window.me={role:'member',displayName:'김동일',memberId:'self',globalAdmin:false,groupId:'grp_a'};
            localStorage.setItem('kokmatch_token',window.T);localStorage.setItem('kokmatch_group_id','grp_a');
            window.normalizeClient=()=>{};window.memberPageGo46=()=>{};window.goView=()=>{};
            window.openModal=html=>{document.getElementById('modalSheet').innerHTML=html;document.getElementById('modal').classList.add('on')};
            window.closeModal=()=>{document.getElementById('modal').classList.remove('on');document.getElementById('modalSheet').innerHTML=''};
            window.renderHeader=()=>{const b=document.getElementById('groupBtn');if(b){b.textContent=(window.group?.name||'모임')+(window.me?.globalAdmin?' ▾':'');b.disabled=!window.me?.globalAdmin}};
            window.renderAll=()=>{window.renderHeader();if(!document.querySelector('#members .profileIdentity80'))document.getElementById('members').innerHTML='<div class="profileIdentity80" data-member-id56="self"><img src="data:image/jpeg;base64,THUMB"></div>'};
            window.fetch=async(url,opt={})=>{
              const u=new URL(String(url),location.href),path=u.pathname;let body={};try{body=opt.body?JSON.parse(opt.body):{}}catch{}
              let data={};
              if(path.endsWith('/kokmatch-auth-v38')){
                if(body.action==='my_memberships')data={memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member',roleLabel:'일반회원'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member',roleLabel:'일반회원'}]};
                else if(body.action==='switch_group')data={success:true,token:'token-'+body.groupId,groupId:body.groupId,groupName:body.groupId==='grp_b'?'B모임':'A모임',role:'member',memberId:'self'};
              } else if(path.endsWith('/kokmatch-multi-api')){
                const g=u.searchParams.get('groupId')||'grp_a';data={data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members:[{id:'self',name:'김동일',age:'30',cls:'C',state:'waiting',role:'member',type:'member'}],queue:['self'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:g,name:g==='grp_b'?'B모임':'A모임'},groups:[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}],user:{role:'member',displayName:'김동일',memberId:'self',globalAdmin:false,groupId:g}};
              } else if(path.endsWith('/kokmatch-profile-v53')){
                data={image:'data:image/jpeg;base64,THUMB',fullImage:'data:image/jpeg;base64,FULL_IMAGE'};
              } else if(path.endsWith('/kokmatch-login-v55')){
                if(body.action==='probe')data={candidates:[
                  {candidateId:'member:grp_a:self',name:'김동일',memberId:'self',age:'30대',grade:'C',groupId:'grp_a',groupName:'A모임'},
                  {candidateId:'member:grp_a:same2',name:'김동일',memberId:'same2',age:'40대',grade:'B',groupId:'grp_a',groupName:'A모임'},
                  {candidateId:'member:grp_b:selfb',name:'김동일',memberId:'selfb',age:'30대',grade:'C',groupId:'grp_b',groupName:'B모임'}]};
                else if(body.action==='login'){window.__qaCandidate=body.candidateId;data={token:'login-token',displayName:'김동일',memberId:body.candidateId.includes('same2')?'same2':'self',globalAdmin:false,groupId:'grp_a',groupName:'A모임',role:'member'}}
              }
              return new Response(JSON.stringify(data),{status:200,headers:{'content-type':'application/json'}})
            };
          });
          await page.addScriptTag({path:'app-v5.6-fix3.js'});
          await page.addScriptTag({path:'app-v5.6-fix4.js'});
          await page.addScriptTag({path:'app-v5.6-fix5.js'});
          await page.waitForFunction(()=>window.__kokmatchV56Fix3Patch==='1.1'&&window.__kokmatchV56Fix4Patch==='1.0'&&window.__kokmatchV56Fix5Patch==='1.1');

          await page.evaluate(()=>window.renderHeader());
          await page.waitForFunction(()=>document.getElementById('groupBtn')&&!document.getElementById('groupBtn').disabled);
          await page.locator('#groupBtn').click();
          await page.waitForSelector('#groupChoice56 button');
          if(await page.locator('#groupChoice56 button').count()!==2)throw new Error('membership choices mismatch');
          await page.locator('#groupChoice56 button').filter({hasText:'B모임'}).click();
          await page.waitForFunction(()=>window.currentGroupId==='grp_b'&&window.group?.groupId==='grp_b'&&!document.getElementById('groupBtn')?.disabled);

          await page.locator('#members .profileIdentity80 img').click();
          await page.waitForSelector('#profileViewer56:not(.hide)');
          await page.waitForFunction(()=>document.querySelector('#profileViewer56 img')?.getAttribute('src')==='data:image/jpeg;base64,FULL_IMAGE');
          const prevented=await page.evaluate(()=>{const img=document.querySelector('#members .profileIdentity80 img');const ev=new MouseEvent('contextmenu',{bubbles:true,cancelable:true});return !img.dispatchEvent(ev)});
          if(!prevented)throw new Error('profile context menu was not prevented');
          await page.locator('.profileViewerClose56').click();

          await page.evaluate(()=>{window.T='';window.me=null;window.group=null;window.currentGroupId='';localStorage.removeItem('kokmatch_token');localStorage.removeItem('kokmatch_group_id');window.renderLoginName()});
          await page.locator('#loginName').fill('김동일');
          await page.locator('#loginNext56').click();
          await page.waitForSelector('#loginCandidate56 button');
          if(await page.locator('#loginCandidate56 button').count()!==3)throw new Error('same-name candidates collapsed');
          const labels=await page.locator('#loginCandidate56 button').allTextContents();
          if(!labels.some(x=>x.includes('40대')&&x.includes('A모임')&&x.includes('B급')))throw new Error('candidate details missing '+labels.join('|'));
          await page.locator('#loginCandidate56 button').nth(1).click();
          await page.locator('#loginPin56').fill('123456');
          await page.locator('#loginSubmit56').click();
          await page.waitForFunction(()=>document.getElementById('login')?.classList.contains('hide')&&String(window.T||'')==='login-token');
          const picked=await page.evaluate(()=>window.__qaCandidate);
          if(picked!=='member:grp_a:same2')throw new Error('wrong candidate logged in '+picked);
          console.log('PASS V5.6 IPHONE INTERACTIONS',JSON.stringify({labels,picked,group:await page.evaluate(()=>window.currentGroupId)}));
          await browser.close();
          EOF
          node qa-ios.mjs
