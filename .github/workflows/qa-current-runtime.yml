name: QA current single runtime

on:
  push:
    paths:
      - 'index.html'
      - 'latest-version.json'
      - 'app-v*.js'
      - 'app-v*.css'
      - 'edge-functions/kokmatch-auto-v656/**'
      - 'edge-functions/kokmatch-atomic-api/**'
      - 'scripts/qa-boot-diagnostic.mjs'
      - 'scripts/qa-current-runtime.mjs'
      - 'scripts/qa-partner-poll-current.mjs'
      - 'scripts/qa-save-layout-current.mjs'
      - 'scripts/qa-role-layout-current.mjs'
      - 'scripts/qa-auto-priority-v673.mjs'
      - 'scripts/qa-auto-ui-v673.mjs'
      - 'scripts/qa-developer-visibility-v674.mjs'
      - 'scripts/qa-v675-ui.mjs'
      - 'scripts/qa-v676-auto-toggle.mjs'
      - 'scripts/qa-v678-ui.mjs'
      - '.github/workflows/qa-current-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate standalone runtime
        run: node scripts/validate-standalone-runtime.mjs
      - name: Automatic matching priority and compute QA
        run: |
          node scripts/qa-auto-priority-v673.mjs
          node --input-type=module <<'NODE'
          import {bestFour,businessDay} from './edge-functions/kokmatch-auto-v656/scoring.mjs';
          const now=Date.now(),day=businessDay(now);
          const members=Array.from({length:24},(_,i)=>({id:'m'+i,name:'회원'+i,state:'waiting',joinedAt:now-(20+i)*60000,waitDay:day,waitTotalMs:(i%6)*60000,cls:['A','B','C','D','E'][i%5],gender:i%2?'여':'남'}));
          const history=Array.from({length:12},(_,i)=>({id:'g'+i,endedAt:now-(i+1)*300000,players:['m'+(i%24),'m'+((i+3)%24),'m'+((i+7)%24),'m'+((i+11)%24)]}));
          const s={members,queue:members.map(x=>x.id),history,pendingGames:[],games:[],pairCounts:{},courtCount:5};
          const t=Date.now();for(let i=0;i<20;i++){const r=bestFour(s,now+i);if(!r||r.players.length!==4)throw new Error('bestFour failed')};const ms=Date.now()-t;
          if(ms>1500)throw new Error('24-player scoring too slow: '+ms+'ms');
          console.log('PASS 24-player scoring 20x in '+ms+'ms');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          echo $! >/tmp/kokmatch-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Prepare deterministic UI test guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1');const kill=()=>document.getElementById('pwaPrompt629')?.remove();new MutationObserver(kill).observe(document,{childList:true,subtree:true});addEventListener('DOMContentLoaded',kill)}catch{}});"""
          files=['scripts/qa-boot-diagnostic.mjs','scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs']
          for f in files:
              p=Path(f); s=p.read_text(encoding='utf-8')
              m=re.search(r"const page=await browser\.newPage\([^;]+\);",s)
              if m and guard not in s:
                  s=s[:m.end()]+'\n'+guard+s[m.end():]
              p.write_text(s,encoding='utf-8')
          p=Path('scripts/qa-save-layout-current.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("if(url.pathname.endsWith('/kokmatch-v60-api')){if(body.op==='member_save')", "if(url.pathname.endsWith('/kokmatch-v60-api')||url.pathname.endsWith('/kokmatch-member-v646')){if(body.op==='member_save')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Automatic and manual conflict UI QA
        run: node scripts/qa-auto-ui-v673.mjs
      - name: Developer visibility and persistent queue badge QA
        run: node scripts/qa-developer-visibility-v674.mjs
      - name: Auto settings and stats live QA
        run: node scripts/qa-v675-ui.mjs
      - name: v6.76 resilient auto toggle QA
        run: node scripts/qa-v676-auto-toggle.mjs
      - name: v6.78 live badge stats mobile and popup QA
        run: node scripts/qa-v678-ui.mjs
      - name: Current runtime boot diagnostic
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Mobile roster smoke QA
        run: node scripts/qa-current-runtime.mjs
      - name: Partner and exercise poll QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Save speed and stats layout QA
        run: node scripts/qa-save-layout-current.mjs
      - name: Role and responsive layout QA
        run: node scripts/qa-role-layout-current.mjs
