name: Wire v5.1 temp
on:
  push:
    branches: [release/v5.1-final-qa-20260825]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wire-v51]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and wire v5.1
        run: |
          node --check app-v5.1.js
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>콕매치 v5.0</title>','<title>콕매치 v5.1</title>')
          s=s.replace("kokmatch_auto_update_target_v39','5.0'","kokmatch_auto_update_target_v39','5.1'")
          s=s.replace("kokmatch_auto_update_target_v40','5.0'","kokmatch_auto_update_target_v40','5.1'")
          if '/app-v5.1.js?v=5.1' not in s:
              s=s.replace('</body>','<script src="/app-v5.1.js?v=5.1"></script></body>')
          p.write_text(s,encoding='utf-8')
          q=Path('latest-version.json')
          x=json.loads(q.read_text(encoding='utf-8'))
          x.update({'label':'5.1','semanticVersion':'5.1','updatedAt':'2026-08-25T03:45:00+09:00','note':'final isolated real-use QA stabilization: concurrency/permission fixes, poll/guest limit validation, QA cleanup and legacy test endpoint lockdown'})
          q.write_text(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          grep -q '<title>콕매치 v5.1</title>' index.html
          grep -q '/app-v5.1.js?v=5.1' index.html
          grep -q '"semanticVersion":"5.1"' latest-version.json
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html latest-version.json
          git diff --cached --quiet || git commit -m '[wire-v51] Wire v5.1 release'
          git push
