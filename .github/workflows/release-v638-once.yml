name: Release v6.38 once

on:
  push:
    paths:
      - '.github/workflows/release-v638-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.38
        run: python3 scripts/build-v638.py
      - name: Syntax and standalone validation
        run: |
          node --check app-v6.38.js
          node scripts/validate-standalone-runtime.mjs
          grep -q '__kokmatchNoFlashResume638' app-v6.38.js
          grep -q 'app-v6.38.js?v=6.38' index.html
          grep -q 'kokmatch-sw.js?v=6.38' sw.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v638-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v638-http.log
          exit 1
      - name: Guard QA from PWA permission overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs','scripts/qa-resume-v638.mjs']
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1')}catch{};document.addEventListener('DOMContentLoaded',()=>{const drop=()=>document.getElementById('pwaPrompt629')?.remove();drop();new MutationObserver(drop).observe(document.body,{childList:true,subtree:true})},{once:true})});\n"""
          for name in files:
              p=Path(name);s=p.read_text(encoding='utf-8')
              s2,n=re.subn(r'(const page=await browser\.newPage\([^\n]+\);\n)',r'\1'+guard,s,count=1)
              if n!=1: raise SystemExit(f'QA page insertion point missing: {name}')
              p.write_text(s2,encoding='utf-8')
          PY
      - name: Existing runtime regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs
      - name: Resume no-flash regression QA
        run: node scripts/qa-resume-v638.mjs
      - name: Commit release only after green QA
        run: |
          git checkout -- scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v6.38.js app-v6.38.css index.html manifest.webmanifest kokmatch-sw.js sw.js latest-version.json
          git rm -f --ignore-unmatch scripts/build-v638.py scripts/qa-resume-v638.mjs .github/workflows/release-v638-once.yml
          git rm -f --ignore-unmatch scripts/build-v637.py scripts/qa-member-pagination-v637.mjs .github/workflows/release-v637-once.yml .github/workflows/diag-v637-member-pagination-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Release v6.38 no-flash member resume'
          git push origin HEAD:main
