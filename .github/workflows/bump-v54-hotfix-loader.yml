name: Bump v5.4 hotfix loader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v54-hotfix-loader.yml'
      - 'app-v5.4-hotfix-loader.js'
      - 'app-v5.4-fix11.js'
      - 'app-v5.4-fix12.js'
      - 'app-v5.4-fix16.js'
      - 'app-v5.6-pre.js'
      - 'app-v5.6.js'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh hotfix loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          n=re.sub(r'/app-v5\.4-hotfix-loader\.js\?v=[^"<]+', '/app-v5.4-hotfix-loader.js?v=15.0', s)
          if n != s:
              p.write_text(n,encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet -- index.html; then
            echo "hotfix loader cache key already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh v5.6 hotfix loader cache"
          git push
