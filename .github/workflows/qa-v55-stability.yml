name: QA v5.5 stability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v55-stability.yml'
      - 'app-v5.5-fix1.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify v5.5 on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const FEEDBACK='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-feedback-v54';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const b=await webkit.launch({headless:true});
          try{
            const p=await b.newPage({...devices['iPhone 13']});const requests=[];const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.route(FEEDBACK+'**',async r=>{requests.push({kind:'feedback',body:r.request().postDataJSON()});await r.fulfill({status:200,contentType:'application/json',body:'{"success":true,"items":[]}'})});
            await p.route(PROFILE+'**',async r=>{if(r.request().method()==='POST'){requests.push({kind:'profile',body:r.request().postDataJSON()});await r.fulfill({status:200,contentType:'application/json',body:'{"success":true,"memberId":"self","fullSaved":true}'})}else await r.fulfill({status:200,contentType:'application/json',body:'{"profiles":{}}'})});
            let ready=false;for(let i=0;i<4&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=v55&t='+Date.now(),{waitUntil:'domcontentloaded'});try{await p.waitForFunction(()=>window.__kokmatchV55Patch==='1.0'&&window.__kokmatchVersionLock==='5.5',{timeout:10000});ready=true}catch{await p.waitForTimeout(800)}}if(!ready)throw new Error('v5.5 patch not loaded');
            const ver=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock}));if(ver.title!=='콕매치 v5.5'||ver.data!=='5.5'||ver.lock!=='5.5')throw new Error('version mismatch '+JSON.stringify(ver));
            await p.evaluate(()=>{T='';me=null;document.getElementById('login')?.classList.remove('hide');window.renderLoginName?.()});await p.waitForSelector('#loginName',{state:'visible'});const input=p.locator('#loginName');await input.focus();await input.type('박');await input.evaluate(el=>el.dataset.qaNode='same');await p.evaluate(()=>window.renderLoginName?.());await p.waitForTimeout(250);const stable=await p.evaluate(()=>({active:document.activeElement?.id,value:document.getElementById('loginName')?.value,node:document.getElementById('loginName')?.dataset.qaNode}));if(stable.active!=='loginName'||stable.value!=='박'||stable.node!=='same')throw new Error('login input rerendered '+JSON.stringify(stable));
            async function roleButtons(role,global=false){await p.evaluate(({role,global})=>{T='qa-token';currentGroupId='grp_qa';S=emptyClientState();S.members=[{id:'self',name:'QA',gender:'남',age:'30',cls:'C',type:'member',role:role==='admin'?'admin':role,state:'waiting',totalGames:0}];me={role,globalAdmin:global,memberId:'self',displayName:'QA',groupId:'grp_qa'};group={groupId:'grp_qa',name:'QA'};normalizeClient();renderAll();document.getElementById('login')?.classList.add('hide')},{role,global});await p.waitForTimeout(100);return await p.evaluate(()=>({send:document.querySelectorAll('.feedbackSend55').length,inbox:document.querySelectorAll('.feedbackInbox55').length}))}
            for(const [r,g,want] of [['member',false,0],['organizer',false,1],['manager',false,1],['admin',true,1]]){const x=await roleButtons(r,g);if(x.send!==1||x.inbox!==want)throw new Error('feedback buttons '+r+' '+JSON.stringify(x))}
            await p.evaluate(()=>{currentView='settings';if(typeof goView==='function')goView('settings');let c=document.getElementById('profileCard53');if(!c){c=document.createElement('div');c.id='profileCard53';document.body.appendChild(c)}if(!document.getElementById('profileFile53'))c.innerHTML='<div class="profilePreview53"></div><label for="profileFile53">사진 변경</label><input id="profileFile53" type="file" accept="image/*" style="display:none">';const f=document.getElementById('profileFile53');f.onchange=()=>window.changeProfile53(f)});const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR42mNk+M9Qz0AEYBxVSFUAAN0ABf8l3P8AAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'qa.png',mimeType:'image/png',buffer:png});await p.waitForFunction(()=>document.querySelector('#profileCard53 .profilePreview53 img')&&document.querySelector('.profileStatus55')?.textContent?.includes('저장 완료'),{timeout:12000});const pr=requests.find(x=>x.kind==='profile');if(!pr||pr.body?.action!=='save_profile'||!String(pr.body?.image||'').startsWith('data:image/jpeg;base64,')||!String(pr.body?.fullImage||'').startsWith('data:image/jpeg;base64,'))throw new Error('profile payload failed '+JSON.stringify(pr));
            if(errors.length)throw new Error(errors.join(' | '));console.log('PASS v5.5',ver,stable,requests.map(x=>x.kind));
          }finally{await b.close()}
          EOF
          node qa.mjs
