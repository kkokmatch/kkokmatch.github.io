name: QA v5.5 stability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v55-stability.yml'
      - 'app-v5.5-fix2.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify feedback profile and login on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const FEEDBACK='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-feedback-v54';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          let b,code=0;
          try{
            b=await webkit.launch({headless:true});const p=await b.newPage({...devices['iPhone 13']});p.setDefaultTimeout(9000);p.setDefaultNavigationTimeout(15000);
            const reqs=[];let savedImage='';const pageErrors=[];p.on('pageerror',e=>pageErrors.push(String(e)));
            await p.route(FEEDBACK+'**',async r=>{let body={};try{body=r.request().postDataJSON()}catch{}reqs.push({kind:'feedback',body});await r.fulfill({status:200,contentType:'application/json',body:'{"success":true,"items":[]}'})});
            await p.route(PROFILE+'**',async r=>{if(r.request().method()==='POST'){const body=r.request().postDataJSON();reqs.push({kind:'profile',body});savedImage=String(body.image||'');await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,memberId:'self',image:savedImage,fullSaved:!!body.fullImage})})}else{await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:savedImage?{self:{image:savedImage}}:{}})})}});
            await p.goto('https://kkokmatch.github.io/?qa=v552&t='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__kokmatchV55Patch==='2.0');
            const ver=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,fix1:!!window.__kokmatchV55Fix1,fix2:!!window.__kokmatchV55Fix2}));if(ver.title!=='콕매치 v5.5'||ver.data!=='5.5'||ver.lock!=='5.5'||!ver.fix2||ver.fix1)throw new Error('version/loader '+JSON.stringify(ver));console.log('PASS loader',ver);
            await p.evaluate(()=>{T='';me=null;document.getElementById('login')?.classList.remove('hide');window.renderLoginName?.()});const input=p.locator('#loginName');await input.waitFor({state:'visible'});await input.focus();await input.type('박');await input.evaluate(el=>el.dataset.same='1');await p.evaluate(()=>window.renderLoginName?.());await p.waitForTimeout(100);const login=await p.evaluate(()=>({active:document.activeElement?.id,value:document.getElementById('loginName')?.value,same:document.getElementById('loginName')?.dataset.same}));if(login.active!=='loginName'||login.value!=='박'||login.same!=='1')throw new Error('login regression '+JSON.stringify(login));console.log('PASS login');
            async function buttons(role,global=false){return await p.evaluate(({role,global})=>{T='qa-token';currentGroupId='grp_qa';me=role?{role,globalAdmin:global,memberId:global?'':'self',displayName:'QA',groupId:global?'__global__':'grp_qa'}:null;window.__kokmatchReconcileFeedback552();return{send:document.querySelectorAll('.feedbackSend552').length,inbox:document.querySelectorAll('.feedbackInbox552').length}},{role,global})}
            let x=await buttons('member');if(x.send!==1||x.inbox!==0)throw new Error('member buttons '+JSON.stringify(x));x=await buttons('organizer');if(x.inbox!==1)throw new Error('organizer inbox '+JSON.stringify(x));x=await buttons(null);if(x.inbox!==1)throw new Error('privilege transient lost '+JSON.stringify(x));x=await buttons('manager');if(x.inbox!==1)throw new Error('manager inbox '+JSON.stringify(x));x=await buttons('admin',true);if(x.inbox!==1)throw new Error('developer inbox '+JSON.stringify(x));console.log('PASS feedback roles');
            await p.evaluate(()=>window.openFeedbackInbox552());await p.waitForFunction(()=>document.body.textContent.includes('받은 건의사항'));if(!reqs.some(r=>r.kind==='feedback'&&r.body?.action==='list'))throw new Error('inbox request not sent');console.log('PASS inbox open');
            await p.evaluate(()=>{T='qa-token';currentGroupId='grp_qa';me={role:'admin',globalAdmin:true,memberId:'',displayName:'QA',groupId:'__global__'};currentView='members';let c=document.getElementById('profileCard53');if(!c){c=document.createElement('div');c.id='profileCard53';document.body.appendChild(c)}c.innerHTML='<div class="profilePreview53"></div><label for="profileFile53">사진 변경</label><input id="profileFile53" type="file" accept="image/*">'});
            const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR42mNk+M9Qz0AEYBxVSFUAAN0ABf8l3P8AAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'qa.png',mimeType:'image/png',buffer:png});await p.waitForFunction(()=>document.querySelector('.profileStatus552')?.textContent?.includes('저장 완료'),{timeout:15000});
            const pr=reqs.find(r=>r.kind==='profile');if(!pr||pr.body?.action!=='save_profile'||pr.body?.groupId!=='grp_qa'||!String(pr.body?.image||'').startsWith('data:image/jpeg;base64,'))throw new Error('profile request '+JSON.stringify(pr));const photo=await p.evaluate(()=>({status:document.querySelector('.profileStatus552')?.textContent,src:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||''}));if(!photo.src.startsWith('data:image/jpeg;base64,'))throw new Error('profile preview '+JSON.stringify(photo));console.log('PASS profile without frontend memberId');
            if(pageErrors.length)throw new Error('page errors '+pageErrors.join(' | '));console.log('PASS v5.5 fix2');
          }catch(e){code=1;console.error('QA_FAIL',e?.stack||e)}finally{if(b)await Promise.race([b.close().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);process.exit(code)}
          EOF
          node qa.mjs
