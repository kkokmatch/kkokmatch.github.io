name: QA v5.5 stability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v55-stability.yml'
      - 'app-v5.5-fix2.js'
      - 'app-v5.5-fix3.js'
      - 'app-v5.5-fix4.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify member selector and profile isolation on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const LOGIN='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-login-v55';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          let b,code=0;
          try{
            b=await webkit.launch({headless:true});const p=await b.newPage({...devices['iPhone 13']});p.setDefaultTimeout(10000);p.setDefaultNavigationTimeout(15000);const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.route(LOGIN+'**',async r=>{const body=r.request().postDataJSON();if(body.action==='probe')return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({candidates:[{candidateId:'member:%EB%B0%95%ED%83%9C%EC%98%81%7C1989%7CC%7C%EB%82%A8',name:'박태영',year:'1989',grade:'C',gender:'남',isDeveloper:false,memberships:[{groupId:'grp_a',groupName:'A모임',role:'member',roleLabel:'일반회원'},{groupId:'grp_b',groupName:'B모임',role:'member',roleLabel:'일반회원'}]}]})});return r.fulfill({status:401,contentType:'application/json',body:'{"error":"QA login stop"}'})});
            await p.route(PROFILE+'**',async r=>{const u=new URL(r.request().url()),g=u.searchParams.get('groupId');if(r.request().method()==='GET'){const profiles=g==='grp_a'?{sameid:{image:'data:image/jpeg;base64,AAA'}}:{};return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles})})}return r.fulfill({status:200,contentType:'application/json',body:'{"success":true,"memberId":"sameid","image":"data:image/jpeg;base64,BBB"}'})});
            await p.goto('https://kkokmatch.github.io/?qa=v554&t='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__kokmatchV55Patch==='4.0');
            const ver=await p.evaluate(()=>({title:document.title,fix4:!!window.__kokmatchV55Fix4,lock:window.__kokmatchVersionLock}));if(ver.title!=='콕매치 v5.5'||!ver.fix4||ver.lock!=='5.5')throw new Error('loader '+JSON.stringify(ver));console.log('PASS loader');
            await p.evaluate(()=>{T='';me=null;document.getElementById('login')?.classList.remove('hide');window.renderLoginName()});const input=p.locator('#loginName');await input.fill('박태영');await p.waitForSelector('.loginCandidate554');const card=await p.locator('.loginCandidate554').innerText();if(!card.includes('1989년생')||!card.includes('C급')||!card.includes('A모임')||!card.includes('B모임'))throw new Error('candidate card '+card);await p.locator('.loginCandidate554').click();await p.waitForSelector('#loginPin');if(!(await p.locator('#loginBox').innerText()).includes('가입 모임'))throw new Error('pin screen missing member context');console.log('PASS member select -> PIN');
            await p.evaluate(()=>{T='qa-token';me={role:'member',globalAdmin:false,memberId:'sameid',displayName:'다른회원'};currentGroupId='grp_a'});await p.waitForTimeout(900);let a=await p.evaluate(()=>window.avatar({id:'sameid',name:'다른회원',gender:'남'}));if(!a.includes('<img'))throw new Error('group A profile did not load '+a);
            await p.evaluate(()=>{currentGroupId='grp_b'});await p.waitForTimeout(900);let c=await p.evaluate(()=>window.avatar({id:'sameid',name:'다른회원',gender:'남'}));if(c.includes('<img'))throw new Error('stale profile leaked across groups '+c);console.log('PASS profile group isolation');
            if(errors.length)throw new Error('page errors '+errors.join(' | '));console.log('PASS v5.5 fix4');
          }catch(e){code=1;console.error('QA_FAIL',e?.stack||e)}finally{if(b)await Promise.race([b.close().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);process.exit(code)}
          EOF
          node qa.mjs
