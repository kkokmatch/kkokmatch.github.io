name: Apply v6.22 partner picker and poll QA

on:
  push:
    paths:
      - '.github/workflows/apply-v622-partner-poll-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v6.22
        run: python3 scripts/apply-v622.py
      - name: Validate JS and standalone runtime
        run: |
          node --check app-v6.22.js
          node scripts/validate-standalone-runtime.mjs
          grep -q "app-v6.22.js" index.html
          grep -q "app-v6.22.css" index.html
          if grep -q "app-v6.21.js" index.html; then exit 1; fi
      - name: Commit v6.22
        run: |
          rm -f scripts/apply-v622.py .github/workflows/apply-v622-partner-poll-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v6.22 stabilize partner selection and poll QA"
          git push
