name: Build v6.21 single runtime

on:
  push:
    paths:
      - 'scripts/build-v621-single.mjs'
      - '.github/workflows/build-v621-single.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build single runtime
        run: node scripts/build-v621-single.mjs
      - name: Syntax check
        run: node --check app-v6.21.js
      - name: Standalone runtime check
        run: node scripts/validate-standalone-runtime.mjs
      - name: Diagnose legacy launch refs
        shell: bash
        run: grep -n -C 2 "location.pathname.startsWith('/launch/v" app-v6.21.js || true
      - name: Verify canonical cleanup
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('app-v6.21.js','utf8');
          const checks={
            oneCurrentJs:(html.match(/\/app-v6\.21\.js/g)||[]).length===1,
            oneCurrentCss:(html.match(/\/app-v6\.21\.css/g)||[]).length===1,
            noLegacyV99FastPath:!js.includes('Member attendance fast path: preserve scroll'),
            noLegacyLaunchRoute:!js.includes("location.pathname.startsWith('/launch/v"),
            threeButtonCanonical:js.includes('function controlsHtml(m)')&&js.includes('kmRosterAction621'),
            memberApiCanonical:js.includes('__kokmatchMemberApiHotfixV621'),
            noCrossVersionAssets:![...js.matchAll(/[\"'](\/app-v[^\"'?]+\.(?:js|css))/g)].some(m=>!['/app-v6.21.js','/app-v6.21.css'].includes(m[1]))
          };
          for(const [name,ok] of Object.entries(checks))console.log(`${ok?'PASS':'FAIL'} ${name}`);
          if(Object.values(checks).some(v=>!v))process.exit(1);
          NODE
      - name: Commit consolidated runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v6.21.js app-v6.21.css index.html latest-version.json scripts/v621-consolidation-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Consolidate KokMatch v6.21 into single runtime'
          git push

# one-time migration workflow; remove after successful consolidation
