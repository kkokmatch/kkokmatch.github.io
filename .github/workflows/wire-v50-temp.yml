name: Wire and validate v50 temp
on:
  push:
    branches: [feature/v5.0-settings-calendar-20260825]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wire-v50]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v5.0 JavaScript
        run: |
          node --check app-v5.0.js
          grep -q "GUIDE_KEY50" app-v5.0.js
          grep -q "pointermove" app-v5.0.js
          grep -q "홈 화면에 추가" app-v5.0.js
          grep -q "past22" app-v5.0.js
      - name: Wire v5.0 loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>콕매치 v4.9</title>','<title>콕매치 v5.0</title>')
          s=s.replace("kokmatch_auto_update_target_v39','4.9'","kokmatch_auto_update_target_v39','5.0'")
          s=s.replace("kokmatch_auto_update_target_v40','4.9'","kokmatch_auto_update_target_v40','5.0'")
          if '/app-v5.0.js?v=5.0' not in s:
              s=s.replace('</body>','<script src="/app-v5.0.js?v=5.0"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '<title>콕매치 v5.0</title>' index.html
          grep -q '/app-v5.0.js?v=5.0' index.html
          grep -q '"semanticVersion":"5.0"' latest-version.json
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '[wire-v50] Wire v5.0 loader'
          git push
