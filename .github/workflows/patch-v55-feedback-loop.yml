name: Patch v5.5 feedback observer
on:
  push:
    paths:
      - '.github/workflows/patch-v55-feedback-loop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove feedback observer self-loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v5.5-fix1.js')
          s=p.read_text()
          old="if(canInbox55()){if(!inbox){inbox=document.createElement('button');actions.appendChild(inbox)}inbox.className='feedbackInbox55';inbox.type='button';inbox.textContent='받은 건의사항';inbox.onclick=()=>window.openFeedbackInbox55()}else inbox?.remove()"
          new="if(canInbox55()){if(!inbox){inbox=document.createElement('button');actions.appendChild(inbox)}if(inbox.className!=='feedbackInbox55')inbox.className='feedbackInbox55';if(inbox.type!=='button')inbox.type='button';if(inbox.textContent!=='받은 건의사항')inbox.textContent='받은 건의사항';inbox.onclick=()=>window.openFeedbackInbox55()}else inbox?.remove()"
          if old not in s: raise SystemExit('inbox pattern not found')
          s=s.replace(old,new,1)
          old2="const mo55=new MutationObserver(()=>{enforceVersion55();ensureFeedback55();installLoginGuard55()});mo55.observe(document.documentElement,{childList:true,subtree:true,characterData:true});"
          new2="let moBusy55=false;const mo55=new MutationObserver(()=>{if(moBusy55)return;moBusy55=true;queueMicrotask(()=>{try{enforceVersion55();ensureFeedback55();installLoginGuard55()}finally{moBusy55=false}})});mo55.observe(document.documentElement,{childList:true,subtree:true});"
          if old2 not in s: raise SystemExit('observer pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name 'kkokmatch'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v5.5-fix1.js
          git commit -m 'Fix v5.5 feedback observer loop'
          git push
