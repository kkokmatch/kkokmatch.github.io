name: QA v5.6 fix4 iPhone
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v5.6-fix4.js'
      - 'app-v5.6-fix3.js'
      - 'app-v5.4-hotfix-loader.js'
      - '.github/workflows/qa-v56-fix4-ios.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kok.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .2; done
          cat /tmp/kok.log; exit 1
      - name: Test Kakao-style iPhone interactions
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=';
          const full='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAQAAABFaP0WAAAADElEQVR42mNk+M8AAAICAQB7CYw9AAAAAElFTkSuQmCC';
          const members=[{id:'self',name:'김동일',year:'1989',age:'37',gender:'남',cls:'C',type:'member',role:'member',state:'waiting',totalGames:0},{id:'same2',name:'김동일',year:'1990',age:'36',gender:'남',cls:'B',type:'member',role:'member',state:'out',totalGames:0}];
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13'],userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 26.7.0',serviceWorkers:'block'});
          const p=await ctx.newPage();p.setDefaultTimeout(30000);
          p.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')console.log('BROWSER',m.type(),m.text())});
          let switchCalls=0,loginCandidate='';
          const state=gid=>({data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:['self'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}],user:{role:'member',displayName:'김동일',memberId:'self',globalAdmin:false,groupId:gid}});
          await p.route('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/**',async route=>{
            const req=route.request(),u=new URL(req.url()),path=u.pathname,b=()=>{try{return req.postDataJSON?.()||{}}catch{return{}}};
            const send=x=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(x)});
            if(path.endsWith('/kokmatch-auth-v38')){const x=b();if(x.action==='my_memberships')return send({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member',roleLabel:'일반회원'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member',roleLabel:'일반회원'}]});if(x.action==='switch_group'){switchCalls++;return send({success:true,token:'token-'+x.groupId,groupId:x.groupId,groupName:x.groupId==='grp_b'?'B모임':'A모임',role:'member',memberId:'self'})}return send({});}
            if(path.endsWith('/kokmatch-multi-api')){if(u.searchParams.get('api')==='state')return send(state(u.searchParams.get('groupId')||'grp_a'));return send({success:true});}
            if(path.endsWith('/kokmatch-profile-v53')){if(u.searchParams.get('full')==='1')return send({image:png,fullImage:full});return send({profiles:{self:{image:png}}});}
            if(path.endsWith('/kokmatch-login-v55')){const x=b();if(x.action==='probe')return send({candidates:[{candidateId:'member:grp_a:self',name:'김동일',memberId:'self',year:'1989',age:'37',grade:'C',groupId:'grp_a',groupName:'A모임'},{candidateId:'member:grp_a:same2',name:'김동일',memberId:'same2',year:'1990',age:'36',grade:'B',groupId:'grp_a',groupName:'A모임'},{candidateId:'member:grp_b:selfb',name:'김동일',memberId:'selfb',year:'1989',age:'37',grade:'C',groupId:'grp_b',groupName:'B모임'}]});if(x.action==='login'){loginCandidate=x.candidateId;return send({token:'login-token',displayName:'김동일',memberId:x.candidateId.includes('same2')?'same2':'self',globalAdmin:false,groupId:'grp_a',groupName:'A모임',role:'member'})}return send({});}
            if(path.endsWith('/kokmatch-updater'))return send({version:56,label:'5.6',semanticVersion:'5.6'});
            return send({});
          });
          await p.goto('http://127.0.0.1:4173/?qa=fix4&t='+Date.now(),{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>window.__kokmatchV56Fix4Patch==='1.0'&&window.__kokmatchV56Fix3Patch==='1.1',undefined,{timeout:12000});
          console.log('PRELOAD',await p.evaluate(()=>({fix3:window.__kokmatchV56Fix3Patch,fix4:window.__kokmatchV56Fix4Patch,loader:window.__kokmatchV56LoaderCount||0})));
          await p.evaluate(({members})=>{T='token-grp_a';currentGroupId='grp_a';S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:['self'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_a',name:'A모임'};groups=[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}];me={role:'member',displayName:'김동일',memberId:'self',globalAdmin:false,groupId:'grp_a'};localStorage.setItem('kokmatch_token',T);localStorage.setItem('kokmatch_group_id','grp_a');renderAll();goView('members');document.getElementById('login')?.classList.add('hide')},{members});
          await p.waitForTimeout(350);
          if(!await p.locator('#groupBtn').isEnabled())throw new Error('group button disabled');
          await p.locator('#groupBtn').click();await p.waitForSelector('#groupChoice56 button');
          const texts=await p.locator('#groupChoice56 button').allTextContents();if(!texts.some(x=>x.includes('B모임')))throw new Error('membership B missing '+texts.join('|'));
          await p.locator('#groupChoice56 button').filter({hasText:'B모임'}).click();await p.waitForFunction(()=>currentGroupId==='grp_b'&&group?.groupId==='grp_b');
          if(switchCalls!==1)throw new Error('switch_group calls '+switchCalls);
          await p.waitForFunction(()=>!document.getElementById('groupBtn')?.disabled);
          await p.evaluate(()=>goView('members'));await p.waitForTimeout(150);
          const profileFound=await p.evaluate(()=>!!document.querySelector('#members .profileIdentity80[data-member-id56="self"],#members .profileIdentity80[data-member-id="self"]'));if(!profileFound)throw new Error('member profile identity missing');
          await p.evaluate(()=>window.openProfilePhoto80(document.querySelector('#members .profileIdentity80[data-member-id56="self"],#members .profileIdentity80[data-member-id="self"]')));
          await p.waitForSelector('#profileViewer56:not(.hide)');await p.waitForFunction(full=>document.querySelector('#profileViewer56 img')?.getAttribute('src')===full,full);
          await p.locator('.profileViewerClose56').click();
          await p.evaluate(()=>{T='';me=null;group=null;currentGroupId='';localStorage.removeItem('kokmatch_token');localStorage.removeItem('kokmatch_group_id');window.renderLoginName()});
          await p.locator('#loginName').fill('김동일');await p.locator('#loginNext56').click();await p.waitForSelector('#loginCandidate56 button');
          if(await p.locator('#loginCandidate56 button').count()!==3)throw new Error('same-name candidates collapsed');
          const labels=await p.locator('#loginCandidate56 button').allTextContents();if(!labels.some(x=>x.includes('36세')&&x.includes('A모임')&&x.includes('B급')))throw new Error('candidate details missing '+labels.join('|'));
          await p.locator('#loginCandidate56 button').nth(1).click();await p.locator('#loginPin56').fill('123456');await p.locator('#loginSubmit56').click();
          await p.waitForFunction(()=>document.getElementById('login')?.classList.contains('hide')&&String(T||'')==='login-token');
          if(!loginCandidate.includes('same2'))throw new Error('wrong selected candidate '+loginCandidate);
          console.log('PASS FIX4 IPHONE',JSON.stringify({switchCalls,loginCandidate,labels}));
          await browser.close();
          EOF
          node qa.mjs
