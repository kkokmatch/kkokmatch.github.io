name: Release v6.34 session render once

on:
  push:
    paths:
      - '.github/workflows/release-v634-session-render-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build release
        run: python3 scripts/release-v634-once.py
      - name: Syntax and standalone QA
        run: |
          node --check app-v6.34.js
          node scripts/validate-standalone-runtime.mjs
          python3 scripts/qa-v634-static.py
      - name: Install WebKit QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Role and session browser QA
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v634-http.log 2>&1 &
          node scripts/qa-v634-browser.mjs
      - name: Commit v6.34
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git add app-v6.34.js app-v6.34.css index.html latest-version.json manifest.webmanifest kokmatch-sw.js sw.js
          git add -u
          git rm .github/workflows/release-v634-session-render-once.yml scripts/release-v634-once.py scripts/qa-v634-static.py scripts/qa-v634-browser.mjs
          git commit -m 'v6.34 unify version and session rendering'
          git push
