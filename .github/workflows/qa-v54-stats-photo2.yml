name: QA v5.4 photo stats final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v54-stats-photo2.yml'
      - 'app-v5.4-fix11.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: final iPhone stats QA
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit,devices } from 'playwright';
          const STATS='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-stats-v54';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const today='2026-08-27';
          const ms=[{id:'self',name:'QA사용자',age:'30',gender:'남',cls:'C',type:'member',role:'member',state:'waiting'},{id:'p2',name:'여자회원',age:'20',gender:'여',cls:'B',type:'member',role:'member',state:'waiting'},{id:'p3',name:'남자회원',age:'40',gender:'남',cls:'D',type:'member',role:'member',state:'out'},{id:'p4',name:'회원제로',age:'50',gender:'여',cls:'A',type:'member',role:'member',state:'out'}];
          const games=[{gameId:'g1',businessDay:today,startedAt:Date.parse('2026-08-27T10:00:00+09:00'),endedAt:Date.parse('2026-08-27T10:18:00+09:00'),durationMin:18,players:['self','p2','p3','x'],playerNames:['QA사용자','여자회원','남자회원','파트너']},{gameId:'g2',businessDay:'2026-08-26',startedAt:Date.parse('2026-08-26T20:45:00+09:00'),endedAt:Date.parse('2026-08-26T21:10:00+09:00'),durationMin:25,players:['self','p2','p3','x'],playerNames:['QA사용자','여자회원','남자회원','파트너']}];
          const browser=await webkit.launch({headless:true});const p=await browser.newPage({...devices['iPhone 13']});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.route(STATS+'**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,groupId:'qa',today,from:'2026-08-26',to:today,month:'2026-08',selfMemberId:'self',members:ms,rangeGames:games,monthGames:games,baselines:[]})}));
          await p.route(PROFILE+'**',r=>r.fulfill({status:200,contentType:'application/json',body:'{"profiles":{}}'}));
          await p.route(ROSTER+'**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members:ms,memberCount:4,adminBadgeVisibility:'all'})}));
          await p.goto('https://kkokmatch.github.io/?qa=stats-final&t='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__kokmatchStatsPatch==='11.1'&&window.__kokmatchVersionLock==='5.4',{timeout:15000});
          await p.addStyleTag({content:'#login{display:none!important;pointer-events:none!important}'});
          await p.evaluate(({ms,today})=>{T='qa';currentGroupId='qa';S={dayKey:today,courtCount:4,courtNames:['1','2','3','4'],members:ms,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'qa',name:'QA'};groups=[];me={role:'member',displayName:'QA사용자',memberId:'self',globalAdmin:false,groupId:'qa'};normalizeClient();currentView='stats';renderAll();goView('stats')},{ms,today});
          await p.waitForSelector('.statsPeriodGrid11');await p.waitForTimeout(200);
          const L=await p.evaluate(()=>{const e=document.querySelector('.statsPeriodGrid11'),a=document.getElementById('statsFrom11').getBoundingClientRect(),d=document.querySelector('.periodDash11').getBoundingClientRect(),z=document.getElementById('statsTo11').getBoundingClientRect();return{client:e.clientWidth,scroll:e.scrollWidth,aR:a.right,dL:d.left,dR:d.right,zL:z.left,tabs:document.querySelectorAll('.statsTab11').length,tilde:document.querySelector('.periodDash11').textContent}});if(L.tabs!==4||L.tilde.trim()!=='~'||L.scroll>L.client+2||L.aR>L.dL+1||L.dR>L.zL+1)throw Error('layout '+JSON.stringify(L));
          await p.locator('[data-tab11="mine"]').click();await p.waitForSelector('.recordTable11 tbody tr');if(await p.locator('.recordTable11 tbody tr').count()!==2)throw Error('mine');
          await p.locator('[data-tab11="personal"]').click();await p.waitForSelector('.personalTable11 tbody tr');if(await p.locator('.personalTable11 tbody tr').count()!==4||await p.locator('.zeroStat11').count()<1)throw Error('personal/zero');
          await p.locator('[data-detail11="self"]').first().click();await p.waitForSelector('.statsDetailOverlay11.on');if(await p.locator('#statsDetailBody11 .recordTable11 tbody tr').count()!==2)throw Error('detail');await p.locator('.statsDetailClose11').click();
          await p.locator('th[data-sort11="name"]').click();await p.locator('[data-tab11="games"]').click();if(await p.locator('.gameTable11 tbody tr').count()!==2)throw Error('games');await p.locator('[data-tab11="days"]').click();if(await p.locator('.gameTable11 tbody tr').count()!==2)throw Error('days');if(errors.length)throw Error(errors.join('|'));console.log('PASS photo stats final');await browser.close();
          EOF
          node qa.mjs
