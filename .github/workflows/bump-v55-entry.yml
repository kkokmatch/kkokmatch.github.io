name: Bump v5.5 entry
on:
  push:
    paths:
      - '.github/workflows/bump-v55-entry.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch entry version and loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data-kokmatch-version="5.4"','data-kokmatch-version="5.5"')
          s=s.replace('<title>콕매치 v5.4</title>','<title>콕매치 v5.5</title>')
          s=s.replace("window.__kokmatchVersionLock='5.4'","window.__kokmatchVersionLock='5.5'")
          s=s.replace("dataset.kokmatchVersion='5.4'","dataset.kokmatchVersion='5.5'")
          s=s.replace("document.title='콕매치 v5.4'","document.title='콕매치 v5.5'")
          s=s.replace('/app-v5.4-hotfix-loader.js?v=12.0','/app-v5.4-hotfix-loader.js?v=13.0')
          p.write_text(s)
          PY
          git config user.name 'kkokmatch'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Bump app entry to v5.5'
            git push
          fi
