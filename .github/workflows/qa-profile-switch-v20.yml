name: QA profile switch v20
on:
  push:
    paths:
      - '.github/workflows/qa-profile-switch-v20.yml'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix20.js'
      - 'app-v5.4-hotfix-loader.js'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: verify user switch and canonical gender
        run: |
          cat > qa-v20.mjs <<'EOF'
          import { chromium } from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const photo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.route(PROFILE+'**',async r=>{const u=new URL(r.request().url());if(u.searchParams.get('full')==='1'){const id=u.searchParams.get('memberId');return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({image:id==='dev1'?photo:'',fullImage:id==='dev1'?photo:''})})}return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{dev1:{image:photo}}})})});
          let ready=false;for(let i=0;i<10&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=v20&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix20===true&&window.__kokmatchProfileCanonical==='20.0',{timeout:10000});ready=true}catch{}}if(!ready)throw new Error('fix20 not live');
          await p.evaluate(()=>{T='qa-token';currentGroupId='grp_iso';S=emptyClientState();S.members=[{id:'dev1',name:'개발자',gender:'남',age:'30',cls:'C',type:'member',role:'admin',state:'waiting',joinedAt:1},{id:'female1',name:'여성회원',gender:'여',age:'30',cls:'B',type:'member',role:'member',state:'waiting',joinedAt:2},{id:'male1',name:'남성회원',gender:'남',age:'40',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:3},...Array.from({length:9},(_,i)=>({id:`m${i+4}`,name:`회원${i+4}`,gender:i%2?'남':'여',age:'30',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:i+4}))];S.queue=[];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};group={groupId:'grp_iso',name:'QA'};groups=[];me={memberId:'dev1',displayName:'개발자',role:'admin',globalAdmin:true,groupId:'grp_iso'};normalizeClient();currentView='settings';renderAll();document.getElementById('login')?.classList.add('hide')});
          await p.waitForFunction(()=>window.__kokmatchProfilesLoaded20==='grp_iso',{timeout:10000});await p.waitForTimeout(400);
          let dev=await p.evaluate(()=>({img:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'',txt:document.querySelector('#profileCard53 .profilePreview53')?.textContent?.trim()||''}));if(dev.img!==photo)throw new Error('developer preview missing '+JSON.stringify(dev));
          await p.evaluate(()=>{me={memberId:'female1',displayName:'여성회원',role:'member',globalAdmin:false,groupId:'grp_iso'};currentView='settings';renderAll()});await p.waitForTimeout(500);
          let normal=await p.evaluate(()=>({img:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'',txt:document.querySelector('#profileCard53 .profilePreview53')?.textContent?.trim()||'',cls:document.querySelector('#profileCard53 .profilePreviewFallback20')?.className||''}));console.log('SWITCH',normal);if(normal.img)throw new Error('developer photo leaked after normal login '+JSON.stringify(normal));if(!normal.txt.includes('여')||!normal.cls.includes('female'))throw new Error('female settings fallback wrong '+JSON.stringify(normal));
          await p.evaluate(()=>{currentView='members';renderAll()});await p.waitForTimeout(500);
          const rows=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity80');const on=c.querySelector('.pairBtn')?.getAttribute('onclick')||'';return{on,id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||'',img:a?.querySelector('img')?.getAttribute('src')||''}}));console.log('ROWS',rows);for(const r of rows){const id=(r.on.match(/openPairs\(['\"]([^'\"]+)['\"]\)/)||[])[1];const m=await p.evaluate(id=>S.members.find(x=>x.id===id),id);if(!m)throw new Error('unknown card '+JSON.stringify(r));if(r.id!==id||r.gender!==m.gender)throw new Error('card id/gender mismatch '+JSON.stringify({r,m}));if(id==='dev1'){if(r.photo!=='1'||r.img!==photo)throw new Error('dev photo wrong')}else if(r.photo!=='0'||r.img)throw new Error('photo leaked '+JSON.stringify({r,m}))}
          await p.evaluate(()=>memberPageGo46(2));await p.waitForTimeout(450);const page2=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity80'),on=c.querySelector('.pairBtn')?.getAttribute('onclick')||'';return{on,id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||''}}));for(const r of page2){const id=(r.on.match(/openPairs\(['\"]([^'\"]+)['\"]\)/)||[])[1],m=await p.evaluate(id=>S.members.find(x=>x.id===id),id);if(!m||r.id!==id||r.gender!==m.gender||r.photo!=='0')throw new Error('page2 mismatch '+JSON.stringify({r,m}))}if(errors.length)throw new Error(errors.join(' | '));console.log('PASS v20 profile switch');await b.close();
          EOF
          node qa-v20.mjs
