name: QA v5.6 syntax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v56-syntax.yml'
      - 'app-v5.6.js'
      - 'app-v5.6-fix1.js'
      - 'app-v5.6-fix2.js'
      - 'app-v5.6-fix3.js'
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check v5.6 JavaScript syntax and core markers
        run: |
          node --check app-v5.6.js
          node --check app-v5.6-fix1.js
          node --check app-v5.6-fix2.js
          node --check app-v5.6-fix3.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app-v5.6.js','utf8');
          const f1=fs.readFileSync('app-v5.6-fix1.js','utf8');
          const f2=fs.readFileSync('app-v5.6-fix2.js','utf8');
          const f3=fs.readFileSync('app-v5.6-fix3.js','utf8');
          for(const x of ["window.__kokmatchV56Patch='1.4'","window.__kokmatchV56Build='2026.08.28.1'",'window.__kokmatchLoadProfiles56=loadProfiles56']) if(!s.includes(x)) throw new Error('missing v5.6 marker: '+x);
          for(const x of ["window.__kokmatchV56Fix1Patch='1.1'","window.__kokmatchV56Fix1Build='2026.08.28.3'",'saveProfileFix1','forceUpdate','if(!window.__kokmatchV56Fix3)installSwitch()']) if(!f1.includes(x)) throw new Error('missing fix1 marker: '+x);
          for(const x of ["window.__kokmatchV56Fix2Patch='2.0'","window.__kokmatchV56Fix2Build='2026.08.28.4'",'setInterval(enforce,100)']) if(!f2.includes(x)) throw new Error('missing fix2 marker: '+x);
          for(const x of ["window.__kokmatchV56Fix3Patch='1.0'","window.__kokmatchV56Fix3Build='2026.08.28.5'",'refreshProfilesLater','globalAdmin()','window.__kokmatchFastSwitch56=fastSwitch']) if(!f3.includes(x)) throw new Error('missing fix3 marker: '+x);
          if(f1.includes('kokmatch-updater')) throw new Error('legacy updater endpoint must not be used');
          console.log('PASS V5.6 FIX1/FIX2/FIX3 SYNTAX');
          NODE
