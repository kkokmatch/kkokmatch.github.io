name: Wire v49 temp
on:
  push:
    branches: [feature/v4.9-push-settings-ui-20260825]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wire-v49]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire v4.9 loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>콕매치 v4.8</title>','<title>콕매치 v4.9</title>')
          s=s.replace("kokmatch_auto_update_target_v39','4.8'","kokmatch_auto_update_target_v39','4.9'")
          s=s.replace("kokmatch_auto_update_target_v40','4.8'","kokmatch_auto_update_target_v40','4.9'")
          if '/app-v4.9.js?v=4.9' not in s:
              s=s.replace('</body>','<script src="/app-v4.9.js?v=4.9"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '[wire-v49] Wire v4.9 loader'
          git push
