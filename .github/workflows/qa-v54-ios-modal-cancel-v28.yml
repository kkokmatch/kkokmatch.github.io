name: QA v5.4 iOS modal cancel v28
on:
  push:
    paths:
      - 'app-v5.4-fix28.js'
      - '.github/tests/qa-v28-modal-cancel.mjs'
      - '.github/workflows/qa-v54-ios-modal-cancel-v28.yml'
      - 'ios-diagnostic.html'
  workflow_dispatch:
jobs:
  webkit-modal-cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Touch cancel in iPhone Kakao WebKit
        run: node .github/tests/qa-v28-modal-cancel.mjs