name: Release v6.76 resilient auto once

on:
  push:
    paths:
      - '.github/workflows/release-v676-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v6.76 from current production runtime
        run: python3 scripts/build-v676.py

      - name: Syntax and standalone invariants
        run: |
          node --check app-v6.76.js
          node scripts/validate-standalone-runtime.mjs
          grep -F 'app-v6.76.js?v=6.76' index.html >/dev/null
          grep -F 'app-v6.76.css?v=6.76' index.html >/dev/null
          grep -F "window.__kokmatchVersionLock='6.76'" app-v6.76.js >/dev/null
          grep -F "window.__kokmatchAutoToggle676='6.76'" app-v6.76.js >/dev/null

      - name: Automatic matching priority and compute QA
        run: |
          node scripts/qa-auto-priority-v673.mjs
          node --input-type=module <<'NODE'
          import {bestFour,businessDay} from './edge-functions/kokmatch-auto-v656/scoring.mjs';
          const now=Date.now(), day=businessDay(now);
          const members=Array.from({length:24},(_,i)=>({id:'m'+i,name:'회원'+i,state:'waiting',joinedAt:now-(20+i)*60000,waitDay:day,waitTotalMs:(i%6)*60000,cls:['A','B','C','D','E'][i%5],gender:i%2?'여':'남'}));
          const history=Array.from({length:12},(_,i)=>({id:'g'+i,endedAt:now-(i+1)*300000,players:['m'+(i%24),'m'+((i+3)%24),'m'+((i+7)%24),'m'+((i+11)%24)]}));
          const s={members,queue:members.map(x=>x.id),history,pendingGames:[],games:[],pairCounts:{},courtCount:5};
          const t=Date.now();for(let i=0;i<20;i++){const r=bestFour(s,now+i);if(!r||r.players.length!==4)throw new Error('bestFour failed')};const ms=Date.now()-t;
          if(ms>1500)throw new Error('24-player scoring too slow: '+ms+'ms');
          console.log('PASS 24-player scoring 20x in '+ms+'ms');
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v676-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v676-http.log
          exit 1

      - name: Prepare deterministic legacy QA fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          guard="""await page.addInitScript(()=>{try{localStorage.setItem('kokmatch_push_denied_notice629',String(Date.now()));localStorage.setItem('kokmatch_install_guide631_seen','1');sessionStorage.setItem('kokmatch_install_later630','1');const kill=()=>document.getElementById('pwaPrompt629')?.remove();new MutationObserver(kill).observe(document,{childList:true,subtree:true});addEventListener('DOMContentLoaded',kill)}catch{}});"""
          files=['scripts/qa-boot-diagnostic.mjs','scripts/qa-current-runtime.mjs','scripts/qa-partner-poll-current.mjs','scripts/qa-save-layout-current.mjs']
          for f in files:
              p=Path(f); s=p.read_text(encoding='utf-8')
              m=re.search(r"const page=await browser\.newPage\([^;]+\);",s)
              if m and guard not in s:
                  s=s[:m.end()]+'\n'+guard+s[m.end():]
              p.write_text(s,encoding='utf-8')
          p=Path('scripts/qa-save-layout-current.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("if(url.pathname.endsWith('/kokmatch-v60-api')){if(body.op==='member_save')", "if(url.pathname.endsWith('/kokmatch-v60-api')||url.pathname.endsWith('/kokmatch-member-v646')){if(body.op==='member_save')")
          p.write_text(s,encoding='utf-8')
          PY

      - name: v6.76 resilient auto toggle QA
        run: node scripts/qa-v676-auto-toggle.mjs

      - name: v6.75 stats and live regression QA
        run: node scripts/qa-v675-ui.mjs

      - name: Existing automatic manual conflict QA
        run: node scripts/qa-auto-ui-v673.mjs

      - name: Role and responsive layout QA
        run: node scripts/qa-role-layout-current.mjs

      - name: Current production core regression QA
        run: |
          node scripts/qa-boot-diagnostic.mjs
          node scripts/qa-current-runtime.mjs
          node scripts/qa-partner-poll-current.mjs
          node scripts/qa-save-layout-current.mjs
          node scripts/qa-developer-visibility-v674.mjs

      - name: Restore temporary legacy QA edits
        if: always()
        run: git checkout -- scripts/qa-boot-diagnostic.mjs scripts/qa-current-runtime.mjs scripts/qa-partner-poll-current.mjs scripts/qa-save-layout-current.mjs

      - name: Commit application release after green QA
        run: |
          git config user.name 'kkokmatch-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-v6.76.js app-v6.76.css index.html manifest.webmanifest kokmatch-sw.js sw.js latest-version.json scripts/qa-v676-auto-toggle.mjs edge-functions/kokmatch-auto-v656/index.ts edge-functions/kokmatch-auto-v656/scoring.mjs
          git rm -f --ignore-unmatch scripts/build-v676.py
          git diff --cached --quiet && exit 0
          git commit -m 'Release v6.76 fix automatic game resource limit'
          git push origin HEAD:main
