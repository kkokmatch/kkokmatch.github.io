name: QA v5.4 iOS touch v25
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix25.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'ios-diagnostic.html'
      - '.github/tests/qa-v25-touch.mjs'
      - '.github/workflows/qa-v54-ios-touch-v25.yml'
jobs:
  webkit-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Tap real coordinates in iPhone Kakao WebKit
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          node .github/tests/qa-v25-touch.mjs
