name: Validate v48
on:
  push:
    branches: [main, feature/v4.8-ios-push-fix-20260824]
    paths:
      - 'app-v4.8.js'
      - 'kokmatch-sw.js'
      - 'index.html'
      - 'latest-version.json'
      - '.github/workflows/validate-v48.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-v4.8.js'
      - 'kokmatch-sw.js'
      - 'index.html'
      - 'latest-version.json'
      - '.github/workflows/validate-v48.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app-v4.8.js
          node --check kokmatch-sw.js
      - name: Version wiring
        run: |
          grep -q '<title>콕매치 v4.8</title>' index.html
          grep -q '/app-v4.8.js?v=4.8' index.html
          grep -q '"semanticVersion":"4.8"' latest-version.json
      - name: iOS push guards
        run: |
          grep -q 'window.pushManager' app-v4.8.js
          grep -q "updateViaCache:'none'" app-v4.8.js
          grep -q 'payload.notification' kokmatch-sw.js
