name: QA v5.4 group switch and stats12
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix12.js'
      - '.github/workflows/qa-v54-group-stats12.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify mobile stats and group switching
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const STATS='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-stats-v54';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const b=await webkit.launch({headless:true});
          const p=await b.newPage({...devices['iPhone 13']});
          const errors=[];const statRanges=[];p.on('pageerror',e=>errors.push(String(e)));
          const daySpan=(a,z)=>Math.round((Date.parse(z+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)+1;
          await p.route(STATS+'**',route=>{const u=new URL(route.request().url());const f=u.searchParams.get('from'),t=u.searchParams.get('to');if(f&&t)statRanges.push([f,t,daySpan(f,t)]);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,today:'2026-08-27',selfMemberId:'m1',members:[{id:'m1',name:'QA회원',age:'30',gender:'남',cls:'C',type:'member',state:'waiting'}],rangeGames:[],monthGames:[],baselines:[]})})});
          await p.route(AUTH+'**',async route=>{let body={};try{body=route.request().postDataJSON()||{}}catch{};if(body.action==='switch_group')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({token:'qa-token-'+body.groupId,groupId:body.groupId})});if(body.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'g1',groupName:'모임1',role:'member'},{groupId:'g2',groupName:'모임2',role:'member'},{groupId:'g3',groupName:'모임3',role:'member'},{groupId:'g4',groupName:'모임4',role:'member'}],currentPinDefault:false})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
          await p.route(PROFILE+'**',route=>route.fulfill({status:200,contentType:'application/json',body:'{"profiles":{}}'}));
          await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members:[{id:'m1',name:'QA회원',age:'30',gender:'남',cls:'C',type:'member',state:'waiting'}],memberCount:1,adminBadgeVisibility:'all'})}));
          let ready=false;for(let i=0;i<8&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=stats12&t='+Date.now(),{waitUntil:'domcontentloaded'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix12===true&&window.__kokmatchGroupSwitchPatch==='12.1'&&window.__kokmatchStatsUiPatch==='12.1'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});ready=true}catch{}}
          if(!ready)throw new Error('fix12.1 not loaded on production');
          await p.evaluate(()=>{T='qa-token';currentGroupId='g1';group={groupId:'g1',name:'모임1'};me={memberId:'m1',displayName:'QA회원',role:'member',globalAdmin:false,groupId:'g1'};S=emptyClientState();S.members=[{id:'m1',name:'QA회원',age:'30',gender:'남',cls:'C',type:'member',role:'member',state:'waiting'}];normalizeClient();document.getElementById('login')?.classList.add('hide');currentView='stats';renderStats()});
          await p.waitForSelector('.statsSectionTitle12',{state:'visible'});await p.waitForTimeout(250);
          if((await p.locator('.statsSectionTitle12').textContent())?.trim()!=='경기기록')throw new Error('경기기록 제목 없음');
          const tabs=await p.locator('.statsTab11').allTextContents();if(tabs.length!==2||!tabs.some(x=>x.includes('내기록'))||!tabs.some(x=>x.includes('개인별')))throw new Error('탭 2개 구성 실패 '+JSON.stringify(tabs));
          await p.locator('#statsFrom11').evaluate((e)=>{e.value='2026-08-01';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForTimeout(250);
          await p.locator('#statsTo11').evaluate((e)=>{e.value='2026-08-20';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForTimeout(350);
          const range=await p.evaluate(()=>({f:document.getElementById('statsFrom11')?.value,t:document.getElementById('statsTo11')?.value,fmin:document.getElementById('statsFrom11')?.min,tmax:document.getElementById('statsTo11')?.max}));
          if(daySpan(range.f,range.t)>8)throw new Error('UI range exceeds 8 days '+JSON.stringify(range));
          if(statRanges.some(x=>x[2]>8))throw new Error('network stats request exceeds 8 days '+JSON.stringify(statRanges));
          await p.evaluate(()=>{window.loadState=loadState=async()=>{group={groupId:String(currentGroupId),name:'QA '+currentGroupId};S=emptyClientState();S.members=[{id:'m1',name:'QA회원',age:'30',gender:'남',cls:'C',type:'member',role:'member',state:'waiting'}];normalizeClient();return S};window.goView=goView=(id)=>{currentView=String(id);return id};currentView='queue'});
          await p.evaluate(()=>window.switchOwnGroup38('g2'));await p.waitForTimeout(250);let sw=await p.evaluate(()=>({gid:currentGroupId,group:group?.groupId,view:currentView,busy:!!window.__kokmatchGroupSwitching12}));if(sw.gid!=='g2'||sw.group!=='g2'||sw.view!=='queue'||sw.busy)throw new Error('queue switch failed '+JSON.stringify(sw));
          await p.evaluate(()=>{currentView='settings'});await p.evaluate(()=>window.switchOwnGroup38('g3'));await p.waitForTimeout(250);sw=await p.evaluate(()=>({gid:currentGroupId,group:group?.groupId,view:currentView}));if(sw.gid!=='g3'||sw.group!=='g3'||sw.view!=='settings')throw new Error('settings switch failed '+JSON.stringify(sw));
          await p.evaluate(()=>{me.globalAdmin=true;currentView='stats'});await p.evaluate(()=>window.adminSwitchGroup38('g4','stats'));await p.waitForTimeout(250);sw=await p.evaluate(()=>({gid:currentGroupId,group:group?.groupId,view:currentView}));if(sw.gid!=='g4'||sw.group!=='g4'||sw.view!=='stats')throw new Error('admin stats switch failed '+JSON.stringify(sw));
          const version=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock}));if(version.title!=='콕매치 v5.4'||version.data!=='5.4'||version.lock!=='5.4')throw new Error('version changed '+JSON.stringify(version));
          if(errors.length)throw new Error(errors.join(' | '));console.log('PASS stats12',range,statRanges,sw,version);await b.close();
          EOF
          node qa.mjs
