name: QA v5.6 switch profile core
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.6.js'
      - 'app-v5.6-fix1.js'
      - 'app-v5.6-fix3.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
      - '.github/workflows/qa-v56-switch-profile-bridge.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Serve current commit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kkokmatch-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/kkokmatch-http.log; exit 1
      - name: Verify fast switching and background profiles on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const img='data:image/jpeg;base64,QA_PROFILE_IMAGE';
          const members=[{id:'self',name:'QA사용자',year:'1989',gender:'남',cls:'C',type:'member',role:'member',state:'out',totalGames:0},{id:'f1',name:'여회원',year:'1992',gender:'여',cls:'D',type:'member',role:'member',state:'out',totalGames:0}];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await webkit.launch({headless:true});
          async function run(mode){
            const global=mode==='developer';let switchAuths=0;
            const p=await browser.newPage({...devices['iPhone 13'],serviceWorkers:'block'});p.setDefaultTimeout(60000);
            const state=gid=>({data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}],user:{role:global?'admin':'member',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid}});
            await p.route(AUTH+'**',async route=>{const b=route.request().postDataJSON?.()||{};if(b.action==='switch_group'){switchAuths++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,token:'token-'+b.groupId,groupId:b.groupId,role:global?'admin':'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member'}]})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
            await p.route(MULTI+'**',async route=>{const u=new URL(route.request().url());if(u.searchParams.get('api')==='state'){const gid=u.searchParams.get('groupId')||'grp_a';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(state(gid))})}return route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'})});
            await p.route(PROFILE+'**',async route=>{if(route.request().method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});const gid=new URL(route.request().url()).searchParams.get('groupId');await sleep(2500);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:gid==='grp_b'?{self:{image:img}}:{}})})});
            await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members,memberCount:2,adminBadgeVisibility:'all'})}));
            await p.goto('http://127.0.0.1:4173/?qa=v56fast&mode='+mode+'&t='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__kokmatchV56===true&&window.__kokmatchV56Patch==='1.4'&&window.__kokmatchV56Fix3Patch==='1.1'&&window.__kokmatchV56Fix2Patch==='2.0'&&window.__kokmatchVersionLock==='5.6');
            await p.evaluate(({global,members})=>{T=global?'dev-token':'token-grp_a';currentGroupId='grp_a';S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_a',name:'A모임'};groups=[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}];me={role:global?'admin':'member',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:'grp_a'};currentView='members';localStorage.setItem('kokmatch_token',T);localStorage.setItem('kokmatch_group_id','grp_a');renderAll();document.getElementById('login')?.classList.add('hide')},{global,members});
            const started=Date.now();
            const ok=await p.evaluate(global=>global?window.adminSwitchGroup38('grp_b','members'):window.switchOwnGroup38('grp_b'),global);
            const elapsed=Date.now()-started;
            if(ok!==true)throw new Error(mode+' switch returned '+ok);
            if(elapsed>=2000)throw new Error(mode+' switch waited for profile: '+elapsed+'ms');
            await p.waitForTimeout(100);
            const core=await p.evaluate(()=>({gid:currentGroupId,stateGid:group?.groupId,busy:window.__kokmatchGroupSwitching12===true,disabled:!!document.getElementById('groupBtn')?.disabled,token:String(T||''),version:document.documentElement.dataset.kokmatchVersion,title:document.title}));
            if(core.gid!=='grp_b'||core.stateGid!=='grp_b'||core.busy||core.disabled)throw new Error(mode+' core switch bad '+JSON.stringify(core));
            if(global&&core.token!=='dev-token')throw new Error('developer token changed '+core.token);
            if(global&&switchAuths!==0)throw new Error('developer called switch auth '+switchAuths);
            if(!global&&switchAuths!==1)throw new Error('member switch auth count '+switchAuths);
            await p.waitForFunction(img=>document.querySelector('#members .memberCard[data-member-id56="self"] > .profileIdentity80 img')?.getAttribute('src')===img,img);
            if(core.version!=='5.6'||core.title!=='콕매치 v5.6')throw new Error(mode+' version mismatch '+JSON.stringify(core));
            console.log('PASS',mode,JSON.stringify({elapsed,switchAuths,core}));
            await p.close();
          }
          await run('member');
          await run('developer');
          await browser.close();
          EOF
          node qa.mjs
