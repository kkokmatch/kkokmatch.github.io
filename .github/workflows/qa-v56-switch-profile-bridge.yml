name: QA v5.6 switch profile core
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.6.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
      - '.github/workflows/qa-v56-switch-profile-bridge.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Verify v5.6 switching and single-flight profiles on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const AUTH='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38';
          const MULTI='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const ROSTER='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-roster-v47';
          const img='data:image/jpeg;base64,QA_PROFILE_IMAGE';
          const members=[{id:'self',name:'QA사용자',year:'1989',gender:'남',cls:'C',type:'member',role:'member',state:'out',totalGames:0},{id:'f1',name:'여회원',year:'1992',gender:'여',cls:'D',type:'member',role:'member',state:'out',totalGames:0}];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await webkit.launch({headless:true});
          async function run(mode){
            const p=await browser.newPage({...devices['iPhone 13']});p.setDefaultTimeout(25000);
            const global=mode==='developer';let profileGets=0,switchAuths=0;
            const dialogs=[],errors=[],consoleErrors=[];
            p.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()});
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const state=gid=>({data:{dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},group:{groupId:gid,name:gid==='grp_b'?'B모임':'A모임'},groups:global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:[],user:{role:global?'admin':'member',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:gid}});
            await p.route(AUTH+'**',async route=>{const b=route.request().postDataJSON?.()||{};if(b.action==='switch_group'){switchAuths++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,keepToken:global,token:global?undefined:'token-'+b.groupId,groupId:b.groupId,groupName:b.groupId==='grp_b'?'B모임':'A모임',role:global?'admin':'member',memberId:'self'})})}if(b.action==='my_memberships')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({memberships:[{groupId:'grp_a',groupName:'A모임',memberId:'self',role:'member'},{groupId:'grp_b',groupName:'B모임',memberId:'self',role:'member'}]})});return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
            await p.route(MULTI+'**',async route=>{const u=new URL(route.request().url());if(u.searchParams.get('api')==='state'){const gid=u.searchParams.get('groupId')||'grp_a';return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(state(gid))})}return route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'})});
            await p.route(PROFILE+'**',async route=>{if(route.request().method()==='OPTIONS')return route.fulfill({status:200,body:'ok'});profileGets++;const u=new URL(route.request().url()),gid=u.searchParams.get('groupId');await sleep(900);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:gid==='grp_b'?{self:{image:img}}:{}})})});
            await p.route(ROSTER+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({members,memberCount:2,adminBadgeVisibility:'all'})}));
            await p.goto('https://kkokmatch.github.io/?qa=v56core&mode='+mode+'&t='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__kokmatchV56===true&&window.__kokmatchV56Patch==='1.3'&&window.__kokmatchVersionLock==='5.6');
            await p.evaluate(({global,members})=>{T=global?'dev-token':'token-grp_a';currentGroupId='grp_a';S={dayKey:'2026-08-28',courtCount:2,courtNames:['1코트','2코트'],members,queue:[],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]};group={groupId:'grp_a',name:'A모임'};groups=global?[{groupId:'grp_a',name:'A모임'},{groupId:'grp_b',name:'B모임'}]:[];me={role:global?'admin':'member',displayName:'QA사용자',memberId:'self',globalAdmin:global,groupId:'grp_a'};currentView='members';localStorage.setItem('kokmatch_token',T);localStorage.setItem('kokmatch_group_id','grp_a');renderAll();document.getElementById('login')?.classList.add('hide')},{global,members});
            await p.waitForTimeout(1250);
            const ok=await p.evaluate(global=>global?window.adminSwitchGroup38('grp_b','members'):window.switchOwnGroup38('grp_b'),global);
            if(ok!==true)throw new Error(mode+' switch returned '+ok+' dialogs='+dialogs.join('|'));
            await p.waitForFunction(()=>currentGroupId==='grp_b'&&group?.groupId==='grp_b');
            await p.waitForFunction(img=>{const card=[...document.querySelectorAll('#members .memberCard')].find(c=>c.dataset.memberId56==='self'||c.querySelector(':scope>.profileIdentity80')?.dataset.memberId==='self');return card?.querySelector(':scope>.profileIdentity80 img')?.getAttribute('src')===img},img);
            const x=await p.evaluate(()=>{const card=[...document.querySelectorAll('#members .memberCard')].find(c=>c.dataset.memberId56==='self'||c.querySelector(':scope>.profileIdentity80')?.dataset.memberId==='self');const ident=card?.querySelector(':scope>.profileIdentity80');const btn=document.getElementById('groupBtn');return{src:ident?.querySelector('img')?.getAttribute('src')||'',photo:ident?.dataset.photo||'',busy:window.__kokmatchGroupSwitching12===true,disabled:!!btn?.disabled,cls:btn?.className||'',group:currentGroupId,grp:group?.groupId,title:document.title,version:document.documentElement.dataset.kokmatchVersion}});
            if(x.src!==img||x.photo!=='1')throw new Error(mode+' profile not restored '+JSON.stringify(x));
            if(x.busy||/groupSwitching12|switching52/.test(x.cls))throw new Error(mode+' switch UI stuck '+JSON.stringify(x));
            if(x.title!=='콕매치 v5.6'||x.version!=='5.6')throw new Error(mode+' version changed '+JSON.stringify(x));
            const back=await p.evaluate(global=>global?window.adminSwitchGroup38('grp_a','members'):window.switchOwnGroup38('grp_a'),global);
            if(back!==true)throw new Error(mode+' second switch returned '+back);
            await p.waitForFunction(()=>currentGroupId==='grp_a'&&group?.groupId==='grp_a');
            await p.waitForTimeout(1250);
            if(profileGets>6)throw new Error(mode+' profile request storm count='+profileGets);
            if(global&&switchAuths!==0)throw new Error('developer unexpectedly rotated auth token '+switchAuths);
            if(!global&&switchAuths!==2)throw new Error('member switch auth count '+switchAuths);
            if(dialogs.length)throw new Error(mode+' unexpected dialogs '+dialogs.join(' | '));
            if(errors.length)throw new Error(mode+' page errors '+errors.join(' | '));
            console.log('PASS',mode,{profileGets,switchAuths,state:x,consoleErrors:consoleErrors.slice(0,3)});
            await p.close();
          }
          await run('member');
          await run('developer');
          await browser.close();
          EOF
          node qa.mjs
