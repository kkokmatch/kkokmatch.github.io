name: QA canonical roster iPhone WebKit
on:
  push:
    paths:
      - '.github/workflows/qa-profile-v21-webkit.yml'
      - 'app-v46.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix21.js'
      - 'app-v5.4-fix22.js'
      - 'app-v5.4-hotfix-loader.js'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify logged user first and exact member data across pages
        run: |
          cat > qa-webkit.mjs <<'EOF'
          import { webkit } from 'playwright';
          const PARK='m8f6ef715bdb8';
          const FEMALE_MANAGER='m7fb3d830300b';
          const photo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=';
          const roster=[
            [PARK,'박태영','남',1989,'C','admin'],['m6c3cac48f37e','김철수','남',2007,'C','organizer'],['ma935c28f1c1d','김수진','여',2006,'E','member'],['mf82f2791c13f','송민지','여',2002,'D','organizer'],['m664f1494eb85','박나라','여',1996,'C','organizer'],['m87f23c3ac3de','박수철','남',1969,'B','member'],['mfe57ff99c65c','방시혁','남',1979,'E','member'],['m24cc7f36d7da','박찬열','남',1988,'C','member'],['m742aafdafab3','카리나','여',1999,'A','member'],['m5393aa1242c9','장원영','여',2000,'A','member'],['mac74576c9478','최설윤','여',2001,'B','member'],[FEMALE_MANAGER,'배솜다리','여',1994,'C','manager'],['m3b1c46b1df48','최희진','여',2004,'E','member'],['mfd02a9e95e5a','김연수','여',1990,'D','organizer'],['m298ec69a2e10','홍길동','남',1989,'C','member'],['mff05bd9ef505','윤동건','남',1989,'E','manager'],['m6c163d30a5be','김은영','여',1990,'D','organizer'],['mdc2fb2b93693','배솜다리','남',1999,'C','member']
          ].map(([id,name,gender,year,cls,role],i)=>({id,name,gender,year,cls,role,type:'member',state:'waiting',age:'30',joinedAt:i+1,totalGames:i}));
          const byId=new Map(roster.map(m=>[m.id,m]));
          const roleText={admin:'개발자',manager:'모임장',organizer:'운영진',member:'일반'};
          const b=await webkit.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK'});
          const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.route('**/functions/v1/kokmatch-profile-v53**',async r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{[PARK]:{image:photo}}})}));
          let ready=false;for(let i=0;i<8&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=canonical-roster-222&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix21===true&&window.__kokmatchProfileCanonical==='21.2'&&window.__kokmatchV54Fix22===true&&window.__kokmatchRosterCanonical==='22.2'&&window.__kokmatchLegacyProfileRemappersDisabled===true,{timeout:12000});ready=true}catch{}}if(!ready)throw new Error('fix21.2/fix22.2 not live');
          await p.evaluate(({roster,FEMALE_MANAGER})=>{T='qa-token';currentGroupId='grp_4545db22c88d';S=emptyClientState();S.members=roster;S.queue=[];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};S.adminBadgeVisibility='all';group={groupId:'grp_4545db22c88d',name:'테스트모임'};groups=[];me={memberId:FEMALE_MANAGER,displayName:'배솜다리',role:'manager',globalAdmin:false,groupId:'grp_4545db22c88d'};normalizeClient();currentView='members';renderAll();document.getElementById('login')?.classList.add('hide')},{roster,FEMALE_MANAGER});
          await p.waitForTimeout(1200);
          const readRows=()=>p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity21'),on=c.querySelector('.pairBtn')?.getAttribute('onclick')||'';return{name:(c.querySelector('.memberName45')?.textContent||'').trim(),actionId:(on.match(/openPairs\(['\"]([^'\"]+)['\"]\)/)||[])[1]||'',stamp:c.dataset.memberId46||'',final:c.dataset.memberId22||'',dataGender:c.dataset.gender22||'',dataGrade:c.dataset.grade22||'',dataRole:c.dataset.role22||'',id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||'',img:a?.querySelector('img')?.getAttribute('src')||'',text:(a?.textContent||'').trim(),hasPerson:!!a?.querySelector('svg.genderPersonIcon21'),aria:a?.getAttribute('aria-label')||'',grade:(c.querySelector('.gradeBadge50')?.textContent||'').trim(),role:(c.querySelector('.roleBadge')?.textContent||'').trim(),games:(c.querySelector('.gamecnt')?.textContent||'').trim(),meta:(c.querySelector('.memberInfo48 > .meta')?.textContent||c.querySelector('.memberCard .meta')?.textContent||'').trim()}}));
          const verify=(label,rows)=>{console.log(label,rows);for(const r of rows){const m=byId.get(r.actionId);if(!m)throw new Error(label+' unknown action '+JSON.stringify(r));if(r.stamp!==m.id||r.final!==m.id||r.id!==m.id||r.name!==m.name||r.gender!==m.gender||r.dataGender!==m.gender||r.dataGrade!==m.cls||r.dataRole!==m.role)throw new Error(label+' canonical mismatch '+JSON.stringify({r,m}));if(r.grade!==`30${m.cls}`)throw new Error(label+' grade mismatch '+JSON.stringify({r,m}));if(r.role!==roleText[m.role])throw new Error(label+' role mismatch '+JSON.stringify({r,m}));if(r.games!==`총 게임 ${m.totalGames}회`)throw new Error(label+' games mismatch '+JSON.stringify({r,m}));if(!r.meta.includes(String(m.year))||!r.meta.includes(m.gender))throw new Error(label+' meta mismatch '+JSON.stringify({r,m}));if(m.id!==PARK){if(r.img)throw new Error(label+' Park photo leaked '+JSON.stringify({r,m}));if(r.photo!=='0'||!r.hasPerson||r.text!=='')throw new Error(label+' no-photo icon wrong '+JSON.stringify({r,m}));if(r.aria!==(m.gender==='여'?'여성':'남성'))throw new Error(label+' gender icon mismatch '+JSON.stringify({r,m}))}}};
          const page1=await readRows();if(page1.length!==10)throw new Error('PAGE1 count '+page1.length);if(page1[0]?.id!==FEMALE_MANAGER||page1[0]?.name!=='배솜다리')throw new Error('logged manager is not first '+JSON.stringify(page1[0]));verify('PAGE1',page1);
          await p.evaluate(()=>memberPageGo46(2));await p.waitForTimeout(700);
          const page2=await readRows();if(page2.length!==8)throw new Error('PAGE2 count '+page2.length);verify('PAGE2',page2);
          const all=[...page1,...page2];const ids=all.map(r=>r.id);if(new Set(ids).size!==18)throw new Error('pagination duplicate/missing '+JSON.stringify(ids));if(page2.some(r=>r.id===FEMALE_MANAGER))throw new Error('logged manager duplicated on page2');
          const park=all.find(r=>r.id===PARK);if(!park||!park.img||park.photo!=='1')throw new Error('Park own photo missing '+JSON.stringify(park));if(all.filter(r=>!!r.img).length!==1)throw new Error('photo leakage count '+JSON.stringify(all.filter(r=>({id:r.id,name:r.name,img:!!r.img}))));
          const same=all.filter(r=>r.name==='배솜다리');if(same.length!==2||new Set(same.map(x=>x.id)).size!==2||!same.some(x=>x.gender==='여'&&x.role==='모임장')||!same.some(x=>x.gender==='남'&&x.role==='일반'))throw new Error('same-name members collapsed/misbadged '+JSON.stringify(same));
          await p.evaluate(()=>{currentView='settings';renderAll()});await p.waitForTimeout(400);
          const st=await p.evaluate(()=>({img:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'',text:document.querySelector('#profileCard53 .profilePreview53')?.textContent?.trim()||'',person:!!document.querySelector('#profileCard53 .profileFallback21 svg.genderPersonIcon21'),cls:document.querySelector('#profileCard53 .profileFallback21')?.className||'',aria:document.querySelector('#profileCard53 .profileFallback21')?.getAttribute('aria-label')||''}));if(st.img||st.text||!st.person||!st.cls.includes('female')||st.aria!=='여성')throw new Error('manager settings inherited Park photo / gender wrong '+JSON.stringify(st));
          if(errors.length)throw new Error(errors.join(' | '));console.log('PASS logged manager first / 18 unique IDs / exact grade gender role / human icons / one exact photo');await b.close();
          EOF
          node qa-webkit.mjs
