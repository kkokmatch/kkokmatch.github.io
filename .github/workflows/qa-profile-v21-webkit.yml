name: QA profile v21 iPhone WebKit
on:
  push:
    paths:
      - '.github/workflows/qa-profile-v21-webkit.yml'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix21.js'
      - 'app-v5.4-hotfix-loader.js'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify iPhone WebKit profile isolation
        run: |
          cat > qa-webkit.mjs <<'EOF'
          import { webkit } from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const photo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=';
          const b=await webkit.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK'});
          const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.route(PROFILE+'**',async r=>{const u=new URL(r.request().url());if(u.searchParams.get('full')==='1'){const id=u.searchParams.get('memberId');return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({image:id==='dev1'?photo:'',fullImage:id==='dev1'?photo:''})})}return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{dev1:{image:photo}}})})});
          let ready=false;for(let i=0;i<8&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=v21-webkit&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix21===true&&window.__kokmatchProfileCanonical==='21.0',{timeout:12000});ready=true}catch{}}if(!ready)throw new Error('fix21 not live in WebKit');
          await p.evaluate(()=>{T='qa-token';currentGroupId='grp_iso';S=emptyClientState();S.members=[{id:'dev1',name:'개발자',gender:'남',age:'30',cls:'C',type:'member',role:'admin',state:'waiting',joinedAt:1},{id:'female1',name:'여성회원',gender:'여',age:'30',cls:'B',type:'member',role:'member',state:'waiting',joinedAt:2},{id:'male1',name:'남성회원',gender:'남',age:'40',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:3},...Array.from({length:9},(_,i)=>({id:`m${i+4}`,name:`회원${i+4}`,gender:i%2?'남':'여',age:'30',cls:'C',type:'member',role:'member',state:'waiting',joinedAt:i+4}))];S.queue=[];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};group={groupId:'grp_iso',name:'QA'};groups=[];me={memberId:'dev1',displayName:'개발자',role:'admin',globalAdmin:true,groupId:'grp_iso'};normalizeClient();currentView='settings';renderAll();document.getElementById('login')?.classList.add('hide')});
          await p.waitForFunction(()=>window.__kokmatchProfilesLoaded21==='grp_iso',{timeout:10000});await p.waitForTimeout(500);
          let dev=await p.evaluate(()=>({img:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||''}));if(dev.img!==photo)throw new Error('developer preview missing');
          await p.evaluate(()=>{me={memberId:'female1',displayName:'여성회원',role:'member',globalAdmin:false,groupId:'grp_iso'};currentView='settings';renderAll()});await p.waitForTimeout(600);
          const normal=await p.evaluate(()=>({img:document.querySelector('#profileCard53 .profilePreview53 img')?.getAttribute('src')||'',txt:document.querySelector('#profileCard53 .profilePreview53')?.textContent?.trim()||'',cls:document.querySelector('#profileCard53 .profileFallback21')?.className||''}));console.log('NORMAL',normal);if(normal.img||normal.txt!=='여'||!normal.cls.includes('female'))throw new Error('normal user inherited developer photo/gender '+JSON.stringify(normal));
          await p.evaluate(()=>{currentView='members';renderAll()});await p.waitForTimeout(800);
          const check=async(label)=>{const rows=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity21'),on=c.querySelector('.pairBtn')?.getAttribute('onclick')||'';return{name:(c.querySelector('.memberName45')?.textContent||'').trim(),on,id:a?.dataset.memberId||'',gender:a?.dataset.gender||'',photo:a?.dataset.photo||'',img:a?.querySelector('img')?.getAttribute('src')||'',txt:(a?.textContent||'').trim(),aria:a?.getAttribute('aria-label')||''}}));console.log(label,rows);for(const r of rows){const id=(r.on.match(/openPairs\(['\"]([^'\"]+)['\"]\)/)||[])[1];const m=await p.evaluate(id=>S.members.find(x=>x.id===id),id);if(!m||r.id!==id||r.name!==m.name||r.gender!==m.gender)throw new Error(label+' identity mismatch '+JSON.stringify({r,m}));if(id==='dev1'){if(r.photo!=='1'||r.img!==photo)throw new Error(label+' dev photo wrong')}else{if(r.photo!=='0'||r.img||r.txt!==m.gender||r.aria!==(m.gender==='여'?'여성':'남성'))throw new Error(label+' photo/gender leak '+JSON.stringify({r,m}))}}return rows};
          await check('PAGE1');await p.evaluate(()=>memberPageGo46(2));await p.waitForTimeout(800);const page2=await check('PAGE2');if(page2.length!==2||page2[0].id!=='m11'||page2[0].gender!=='남'||page2[1].id!=='m12'||page2[1].gender!=='여')throw new Error('page2 final mismatch '+JSON.stringify(page2));
          const nav=[];p.on('framenavigated',f=>{if(f===p.mainFrame())nav.push(f.url())});await p.waitForTimeout(2500);if(nav.length>1)throw new Error('unexpected navigation loop '+JSON.stringify(nav));if(errors.length)throw new Error(errors.join(' | '));console.log('PASS iPhone WebKit v21');await b.close();
          EOF
          node qa-webkit.mjs
