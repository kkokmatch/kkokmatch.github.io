name: QA v5.4 interactions v24
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix24.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-hotfix-loader.js'
      - '.github/tests/qa-v24.mjs'
      - '.github/workflows/qa-v54-interactions-v24.yml'
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Click canonical roster interactions on iPhone Kakao WebKit
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9ZkAAAAASUVORK5CYII=' | base64 -d > qa.png
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          node .github/tests/qa-v24.mjs
