name: Release KokMatch v6.81

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-v681.mjs'
      - '.github/workflows/release-v681.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate v6.81 standalone runtime
        run: |
          node scripts/release-v681.mjs
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app-v6.81.js')
          s=p.read_text(encoding='utf-8')

          def replace_one(src, old, new, label):
              count=src.count(old)
              if count != 1:
                  raise SystemExit(f'{label} target count={count}')
              return src.replace(old,new,1)

          s=replace_one(s,"if(pager)return falseif(btn.closest?.('#members .title')","if(pager)return false;if(btn.closest?.('#members .title')",'pager router syntax')
          s=replace_one(s,"if(pager)return false;","if(pager){const t=String(btn.textContent||'');const cur=Math.max(1,Number(window.__kokmatchMemberPage46)||1);const go=window.memberPageGo46;if(typeof go!=='function')return false;if(t.includes('다음'))callV6(go,cur+1);else if(t.includes('이전'))callV6(go,Math.max(1,cur-1));else return false;return true}",'pager dynamic route')
          s=replace_one(s,"if(has&&memberIsMoving46())","if(!force&&has&&memberIsMoving46())",'forced roster render')
          s=replace_one(s,"window.memberPageGo46=function(p){memberPage46=Math.max(1,Number(p)||1);renderMembers();window.scrollTo(0,0)};","window.memberPageGo46=function(p){memberPage46=Math.max(1,Number(p)||1);window.__kokmatchMemberPageRequested46=memberPage46;renderMembers();window.scrollTo(0,0)};",'pager request marker')
          s=replace_one(s,"window.__kokmatchMemberPage46=memberPage46;","window.__kokmatchMemberPage46=memberPage46;window.__kokmatchMemberPageRequested46=memberPage46;",'rendered pager marker sync')
          s=replace_one(s,"typeof memberQuery46==='undefined'?'':String(memberQuery46||''),typeof memberPage46==='undefined'?1:Number(memberPage46)||1,members]);","'',Number(window.__kokmatchMemberPageRequested46||window.__kokmatchMemberPage46||1),members]);",'v677 roster structure signature')
          s=replace_one(s,"function memberSig46(){try{return JSON.stringify([currentGroupId,me?.role,me?.globalAdmin,","function memberSig46(){try{return JSON.stringify([currentGroupId,Number(window.__kokmatchMemberPageRequested46||window.__kokmatchMemberPage46||1),me?.role,me?.globalAdmin,",'member render signature')

          # The app has many historical settings/renderAll wrappers. Add one final guard
          # so a focused court-count draft is never replaced by a background rerender.
          tail=(
              "\n\n/* v6.81 final court-count focus/draft guard. */\n"
              "(()=>{\n"
              "'use strict';\n"
              "if(window.__kokmatchCourtInputGuard681)return;window.__kokmatchCourtInputGuard681='6.81';\n"
              "function protect681(){return currentView==='settings'&&document.activeElement?.id==='courtCountInput'}\n"
              "function restore681(value,start,end,y){const next=document.getElementById('courtCountInput');if(!next)return;if(String(next.value)!==String(value))next.value=String(value);try{next.focus({preventScroll:true})}catch{try{next.focus()}catch{}}try{if(start!==null&&start!==undefined)next.setSelectionRange(start,end??start)}catch{}try{window.scrollTo(0,Math.max(0,Number(y)||0))}catch{}}\n"
              "try{const baseSettings681=renderSettings;renderSettings=function(...args){if(protect681())return;return baseSettings681.apply(this,args)};window.renderSettings=renderSettings}catch(e){console.warn('v6.81 settings focus guard',e)}\n"
              "try{const baseAll681=renderAll;renderAll=function(...args){const active=document.activeElement,keep=currentView==='settings'&&active?.id==='courtCountInput';if(!keep)return baseAll681.apply(this,args);const value=active.value,start=active.selectionStart,end=active.selectionEnd,y=window.scrollY;const r=baseAll681.apply(this,args);restore681(value,start,end,y);queueMicrotask(()=>{if(document.activeElement?.id!=='courtCountInput')restore681(value,start,end,y)});return r};window.renderAll=renderAll}catch(e){console.warn('v6.81 court renderAll guard',e)}\n"
              "})();\n"
          )
          s+=tail
          p.write_text(s,encoding='utf-8')

          # Keep mocked server identity aligned with the role being verified. Drain any
          # request started by the previous identity, then assert the role UI synchronously
          # so an old queued mock response cannot invalidate the authorization test.
          q=Path('scripts/qa-v681-settings.mjs')
          qs=q.read_text(encoding='utf-8')
          qs=replace_one(qs,"const settingsCalls=[];","const settingsCalls=[];\nlet qaIdentity681={memberId:'mgr',displayName:'모임장',role:'manager',globalAdmin:false,tempOrganizer:false,groupId:'qa'};",'QA identity state')
          qs=replace_one(qs,"user:{memberId:'mgr',displayName:'모임장',role:'manager',globalAdmin:false,tempOrganizer:false,groupId:'qa'}","user:{...qaIdentity681,groupId:'qa'}",'QA state identity')
          qs=replace_one(qs,"user:{memberId:'mgr',displayName:'모임장',role:'manager',globalAdmin:false},groups:[]","user:{...qaIdentity681,groupId:'qa'},groups:[]",'QA fallback identity')
          old_loop="]){await page.evaluate(identity=>{me=identity;renderSettings()},identity);await page.waitForTimeout(30);assert.equal(await page.locator('#roleFrameSetting681').count(),1,identity.displayName+' setting missing')}"
          new_loop="]){qaIdentity681={...identity,tempOrganizer:false,groupId:'qa'};await page.waitForTimeout(80);const roleCheck=await page.evaluate(identity=>{me=identity;renderSettings();return{count:document.querySelectorAll('#roleFrameSetting681').length,role:String(me?.role||''),globalAdmin:!!me?.globalAdmin}},identity);assert.equal(roleCheck.count,1,identity.displayName+' setting missing')}"
          qs=replace_one(qs,old_loop,new_loop,'QA role identity switch')
          old_general="await page.evaluate(()=>{me={memberId:'m0',displayName:'회원01',role:'member',globalAdmin:false};renderSettings()});await page.waitForTimeout(30);\nassert.equal(await page.locator('#roleFrameSetting681').count(),0,'general member must not see role-frame setting');"
          new_general="qaIdentity681={memberId:'m0',displayName:'회원01',role:'member',globalAdmin:false,tempOrganizer:false,groupId:'qa'};await page.waitForTimeout(80);const generalRoleCheck=await page.evaluate(()=>{me={memberId:'m0',displayName:'회원01',role:'member',globalAdmin:false};renderSettings();return document.querySelectorAll('#roleFrameSetting681').length});\nassert.equal(generalRoleCheck,0,'general member must not see role-frame setting');"
          qs=replace_one(qs,old_general,new_general,'QA general identity switch')
          q.write_text(qs,encoding='utf-8')
          PY
          git checkout -- .github/workflows/qa-current-runtime.yml
      - name: JavaScript syntax check
        run: node --check app-v6.81.js
      - name: Validate standalone runtime
        run: node scripts/validate-standalone-runtime.mjs
      - name: Validate requested fixes are present
        run: |
          grep -F "const go=window.memberPageGo46" app-v6.81.js
          grep -F "__kokmatchMemberPageRequested46" app-v6.81.js
          grep -F "if(!force&&has&&memberIsMoving46())" app-v6.81.js
          grep -F "document.activeElement?.id!=='courtCountInput'" app-v6.81.js
          grep -F "__kokmatchCourtInputGuard681" app-v6.81.js
          grep -F "roleFrameSetting681" app-v6.81.js
          grep -F "kokmatchRoleFramesHidden681" app-v6.81.css
          grep -F "qaIdentity681" scripts/qa-v681-settings.mjs
          test -f versions/v6.80/app-v6.80.js
          test -f versions/v6.80/app-v6.80.css
      - name: Install Chromium for v6.81 UI QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v681-http.log 2>&1 &
          echo $! >/tmp/kokmatch-v681-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v681-http.log
          exit 1
      - name: Roster pagination court input and role frame QA
        run: |
          set -o pipefail
          node scripts/qa-v681-settings.mjs 2>&1 | tee v681-ui-qa.txt
      - name: Upload v6.81 UI QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v681-ui-qa-diagnostics
          path: |
            v681-ui-qa.txt
            /tmp/kokmatch-v681-http.log
      - name: Commit generated release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: KokMatch v6.81 roster court input and role frames"
          git push --force origin HEAD:release/v6.81-generated
