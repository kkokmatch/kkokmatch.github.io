name: Release KokMatch v6.81

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-v681.mjs'
      - '.github/workflows/release-v681.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate v6.81 standalone runtime
        run: |
          node scripts/release-v681.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-v6.81.js')
          s=p.read_text(encoding='utf-8')
          bad="if(pager)return falseif(btn.closest?.('#members .title')"
          good="if(pager)return false;if(btn.closest?.('#members .title')"
          if bad not in s:
              raise SystemExit('pager router syntax target missing')
          s=s.replace(bad,good,1)
          stale="if(pager)return false;"
          current="if(pager){const t=String(btn.textContent||'');const cur=Math.max(1,Number(window.__kokmatchMemberPage46)||1);const go=window.memberPageGo46;if(typeof go!=='function')return false;if(t.includes('다음'))callV6(go,cur+1);else if(t.includes('이전'))callV6(go,Math.max(1,cur-1));else return false;return true}"
          if s.count(stale)!=1:
              raise SystemExit(f'pager dynamic-route target count={s.count(stale)}')
          s=s.replace(stale,current,1)
          moving="if(has&&memberIsMoving46())"
          immediate="if(!force&&has&&memberIsMoving46())"
          if s.count(moving)!=1:
              raise SystemExit(f'forced roster render target count={s.count(moving)}')
          p.write_text(s.replace(moving,immediate,1),encoding='utf-8')
          q=Path('scripts/qa-v681-settings.mjs')
          qs=q.read_text(encoding='utf-8')
          marker="await pager.getByRole('button',{name:'다음'}).click();"
          diag=("console.log('pager-before',JSON.stringify(await page.evaluate(()=>({page:window.__kokmatchMemberPage46,fn:typeof window.memberPageGo46}))));\n"
                "await page.evaluate(()=>window.memberPageGo46(2));\n"
                "await page.waitForTimeout(80);\n"
                "console.log('pager-direct-2',JSON.stringify({text:(await page.locator('#members .memberPager46').innerText()).replace(/\\s+/g,' '),page:await page.evaluate(()=>window.__kokmatchMemberPage46)}));\n"
                "await page.evaluate(()=>window.memberPageGo46(1));\n"
                "await page.waitForTimeout(80);\n"
                "console.log('pager-direct-1',JSON.stringify({text:(await page.locator('#members .memberPager46').innerText()).replace(/\\s+/g,' '),page:await page.evaluate(()=>window.__kokmatchMemberPage46)}));\n")
          if qs.count(marker)!=1:
              raise SystemExit(f'pager QA marker count={qs.count(marker)}')
          q.write_text(qs.replace(marker,diag+marker,1),encoding='utf-8')
          PY
          git checkout -- .github/workflows/qa-current-runtime.yml
      - name: JavaScript syntax check
        run: node --check app-v6.81.js
      - name: Validate standalone runtime
        run: node scripts/validate-standalone-runtime.mjs
      - name: Validate requested fixes are present
        run: |
          grep -F "const go=window.memberPageGo46" app-v6.81.js
          grep -F "if(!force&&has&&memberIsMoving46())" app-v6.81.js
          grep -F "document.activeElement?.id!=='courtCountInput'" app-v6.81.js
          grep -F "roleFrameSetting681" app-v6.81.js
          grep -F "kokmatchRoleFramesHidden681" app-v6.81.css
          test -f versions/v6.80/app-v6.80.js
          test -f versions/v6.80/app-v6.80.css
      - name: Install Chromium for v6.81 UI QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v681-http.log 2>&1 &
          echo $! >/tmp/kokmatch-v681-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v681-http.log
          exit 1
      - name: Roster pagination, court input focus and role frame QA
        run: |
          set -o pipefail
          node scripts/qa-v681-settings.mjs 2>&1 | tee v681-ui-qa.txt
      - name: Upload v6.81 UI QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v681-ui-qa-diagnostics
          path: |
            v681-ui-qa.txt
            /tmp/kokmatch-v681-http.log
      - name: Commit generated release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: KokMatch v6.81 roster court input and role frames"
          git push --force origin HEAD:release/v6.81-generated
