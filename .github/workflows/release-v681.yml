name: Release KokMatch v6.81

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-v681.mjs'
      - '.github/workflows/release-v681.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate v6.81 standalone runtime
        run: |
          node scripts/release-v681.mjs
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app-v6.81.js')
          s=p.read_text(encoding='utf-8')

          def replace_one(src, old, new, label):
              count=src.count(old)
              if count != 1:
                  raise SystemExit(f'{label} target count={count}')
              return src.replace(old,new,1)

          # Repair the pager capture router produced by the v6.81 generator.
          s=replace_one(
              s,
              "if(pager)return falseif(btn.closest?.('#members .title')",
              "if(pager)return false;if(btn.closest?.('#members .title')",
              'pager router syntax'
          )
          s=replace_one(
              s,
              "if(pager)return false;",
              "if(pager){const t=String(btn.textContent||'');const cur=Math.max(1,Number(window.__kokmatchMemberPage46)||1);const go=window.memberPageGo46;if(typeof go!=='function')return false;if(t.includes('다음'))callV6(go,cur+1);else if(t.includes('이전'))callV6(go,Math.max(1,cur-1));else return false;return true}",
              'pager dynamic route'
          )

          # A forced pager/search render must bypass the motion-only no-flash deferral.
          s=replace_one(
              s,
              "if(has&&memberIsMoving46())",
              "if(!force&&has&&memberIsMoving46())",
              'forced roster render'
          )

          # Expose the requested page/query before renderMembers() enters later v6.80
          # stability wrappers. Those wrappers live outside the v46 closure and therefore
          # cannot read memberPage46/memberQuery46 directly.
          s=replace_one(
              s,
              "window.memberPageGo46=function(p){memberPage46=Math.max(1,Number(p)||1);renderMembers();window.scrollTo(0,0)};",
              "window.memberPageGo46=function(p){memberPage46=Math.max(1,Number(p)||1);window.__kokmatchMemberPageRequested46=memberPage46;renderMembers();window.scrollTo(0,0)};",
              'pager request marker'
          )
          s=replace_one(
              s,
              "window.searchMembers46=function(v){memberQuery46=String(v||'');memberPage46=1;renderMembers();const i=$('memberSearchInput46');if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch{}}};",
              "window.searchMembers46=function(v){memberQuery46=String(v||'');memberPage46=1;window.__kokmatchMemberQueryRequested46=memberQuery46;window.__kokmatchMemberPageRequested46=1;renderMembers();const i=$('memberSearchInput46');if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch{}}};",
              'search request marker'
          )
          s=replace_one(
              s,
              "window.resetMemberList46=function(){memberQuery46='';memberPage46=1;renderMembers()};",
              "window.resetMemberList46=function(){memberQuery46='';memberPage46=1;window.__kokmatchMemberQueryRequested46='';window.__kokmatchMemberPageRequested46=1;renderMembers()};",
              'search reset marker'
          )
          s=replace_one(
              s,
              "window.__kokmatchMemberPage46=memberPage46;",
              "window.__kokmatchMemberPage46=memberPage46;window.__kokmatchMemberPageRequested46=memberPage46;window.__kokmatchMemberQueryRequested46=memberQuery46;",
              'rendered pager marker sync'
          )

          # The v6.80 no-flash structure gate was using lexical v46 variables that are
          # out of scope, so it always saw query='' and page=1 and swallowed page/search
          # rerenders. Make its signature consume the public requested markers instead.
          s=replace_one(
              s,
              "typeof memberQuery46==='undefined'?'':String(memberQuery46||''),typeof memberPage46==='undefined'?1:Number(memberPage46)||1,members]);",
              "String(window.__kokmatchMemberQueryRequested46||''),Number(window.__kokmatchMemberPageRequested46||window.__kokmatchMemberPage46||1),members]);",
              'v677 roster structure signature'
          )

          # Keep the later member signature page-aware as a second line of defense.
          s=replace_one(
              s,
              "function memberSig46(){try{return JSON.stringify([currentGroupId,me?.role,me?.globalAdmin,",
              "function memberSig46(){try{return JSON.stringify([currentGroupId,Number(window.__kokmatchMemberPageRequested46||window.__kokmatchMemberPage46||1),me?.role,me?.globalAdmin,",
              'member render signature'
          )
          p.write_text(s,encoding='utf-8')

          # Extend the generated QA so the same scope bug cannot silently break search.
          q=Path('scripts/qa-v681-settings.mjs')
          qs=q.read_text(encoding='utf-8')
          marker="await page.evaluate(()=>{currentView='settings';renderAll();goView('settings')});"
          search_qa=(
              "await page.locator('#memberSearchInput46').fill('회원21');\n"
              "await page.waitForTimeout(120);\n"
              "assert.equal(await page.locator('#members .memberCard').count(),1,'member roster search did not rerender to one result');\n"
              "assert.match(await page.locator('#members .memberCard').first().innerText(),/회원21/,'member roster search showed the wrong member');\n"
              "await page.evaluate(()=>window.resetMemberList46());\n"
              "await page.waitForTimeout(120);\n"
              "pager=page.locator('#members .memberPager46');\n"
              "assert.match((await pager.innerText()).replace(/\\s+/g,' '),/1\\s*\\/\\s*3/,'member roster reset did not return to page 1');\n\n"
          )
          if qs.count(marker) != 1:
              raise SystemExit(f'search QA insertion target count={qs.count(marker)}')
          q.write_text(qs.replace(marker,search_qa+marker,1),encoding='utf-8')
          PY
          git checkout -- .github/workflows/qa-current-runtime.yml
      - name: JavaScript syntax check
        run: node --check app-v6.81.js
      - name: Validate standalone runtime
        run: node scripts/validate-standalone-runtime.mjs
      - name: Validate requested fixes are present
        run: |
          grep -F "const go=window.memberPageGo46" app-v6.81.js
          grep -F "__kokmatchMemberPageRequested46" app-v6.81.js
          grep -F "__kokmatchMemberQueryRequested46" app-v6.81.js
          grep -F "if(!force&&has&&memberIsMoving46())" app-v6.81.js
          grep -F "document.activeElement?.id!=='courtCountInput'" app-v6.81.js
          grep -F "roleFrameSetting681" app-v6.81.js
          grep -F "kokmatchRoleFramesHidden681" app-v6.81.css
          test -f versions/v6.80/app-v6.80.js
          test -f versions/v6.80/app-v6.80.css
      - name: Install Chromium for v6.81 UI QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-v681-http.log 2>&1 &
          echo $! >/tmp/kokmatch-v681-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/kokmatch-v681-http.log
          exit 1
      - name: Roster pagination search court input and role frame QA
        run: |
          set -o pipefail
          node scripts/qa-v681-settings.mjs 2>&1 | tee v681-ui-qa.txt
      - name: Upload v6.81 UI QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v681-ui-qa-diagnostics
          path: |
            v681-ui-qa.txt
            /tmp/kokmatch-v681-http.log
      - name: Commit generated release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: KokMatch v6.81 roster court input and role frames"
          git push --force origin HEAD:release/v6.81-generated
