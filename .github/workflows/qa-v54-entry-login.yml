name: QA v5.4 entry login
on:
  push:
    paths:
      - 'app-v5.4-fix9.js'
      - 'app-v5.4-fix10.js'
      - 'app-v5.4-hotfix-loader.js'
      - '.github/workflows/qa-v54-entry-login.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: verify entry and login environments
        run: |
          cat > qa-entry.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          const APP='https://kkokmatch.github.io/';
          const API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-multi-api';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const IOS='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';
          const IOS_KAKAO='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 26.7.0';
          const ANDROID_KAKAO='Mozilla/5.0 (Linux; Android 15; SM-S938N Build/AP3A.240905.015.A2; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/140.0.0.0 Mobile Safari/537.36 KAKAOTALK 26.7.0';
          const envs=[
            {name:'safari-pwa',engine:'webkit',ua:IOS,standalone:true,path:'?entry=pwa'},
            {name:'kakao-ios',engine:'webkit',ua:IOS_KAKAO,standalone:false,path:'?entry=kakao-ios'},
            {name:'qr-safari',engine:'webkit',ua:IOS,standalone:false,path:'?entry=qr'},
            {name:'kakao-android',engine:'chromium',ua:ANDROID_KAKAO,standalone:false,path:'?entry=kakao-android'}
          ];
          const launched={webkit:null,chromium:null};
          async function browser(engine){if(!launched[engine])launched[engine]=await (engine==='webkit'?webkit:chromium).launch({headless:true});return launched[engine]}
          function cleanContent(v){return String(v||'').replace(/^['"]|['"]$/g,'')}
          async function runEnv(env){
            const b=await browser(env.engine);const ctx=await b.newContext({viewport:{width:390,height:844},userAgent:env.ua,isMobile:true,hasTouch:true});
            await ctx.addInitScript(({standalone})=>{try{localStorage.clear();sessionStorage.clear();localStorage.setItem('kokmatch_v1_6_reset_once','done')}catch{};try{Object.defineProperty(navigator,'standalone',{configurable:true,get:()=>standalone})}catch{}},{standalone:env.standalone});
            const p=await ctx.newPage();let probe=0,login=0,state=0,legacyDuringLogin=0,phase='boot';const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            p.on('request',r=>{if(phase==='login'&&(/kokmatch-login-v33|kokmatch-auth-v38/.test(r.url())))legacyDuringLogin++});
            await p.route(API+'**',async route=>{const req=route.request(),u=new URL(req.url()),api=u.searchParams.get('api');if(api==='login_probe'){probe++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({roleLabel:'일반회원'})})}if(api==='login'){login++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({token:'qa-token-'+env.name,groupId:'grp_qa_entry'})})}if(api==='state'){state++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({data:{courtCount:4,courtNames:[],members:[{id:'male1',name:'남회원',gender:'남',age:'30',cls:'C',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-60000},{id:'female1',name:'여회원',gender:'여',age:'30',cls:'C',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-30000}],queue:['male1','female1'],pendingGames:[],games:[],history:[],pairCounts:{},attendancePolls:[]},user:{memberId:'male1',displayName:'남회원',role:'manager',globalAdmin:false,groupId:'grp_qa_entry'},group:{groupId:'grp_qa_entry',name:'QA 로그인'},groups:[]})})}return route.fulfill({status:200,contentType:'application/json',body:'{}'})});
            await p.route(PROFILE+'**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:{}})}));
            await p.route('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-login-v33**',route=>route.fulfill({status:200,contentType:'application/json',body:'{}'}));
            await p.route('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-auth-v38**',route=>route.fulfill({status:200,contentType:'application/json',body:'{}'}));
            await p.goto(APP+env.path+'&t='+Date.now(),{waitUntil:'networkidle'});
            await p.waitForFunction(()=>window.__kokmatchV54Fix10===true&&window.__kokmatchProfileUiPatch==='10.0'&&window.__kokmatchCanonicalLogin10===true,{timeout:20000});
            await p.waitForSelector('#loginName',{state:'visible',timeout:10000});
            await p.locator('#loginName').fill('남회원');await p.locator('#loginNext10').click();await p.waitForSelector('#loginPin',{state:'visible',timeout:10000});await p.locator('#loginPin').fill('123456');phase='login';await p.locator('#loginSubmit10').click();
            await p.waitForFunction(()=>document.getElementById('login')?.classList.contains('hide')&&window.__kokmatchV54Fix10===true&&typeof me!=='undefined'&&me?.displayName==='남회원',{timeout:12000});phase='done';
            const auth=await p.evaluate(()=>({token:!!localStorage.getItem('kokmatch_token'),group:localStorage.getItem('kokmatch_group_id'),hidden:document.getElementById('login')?.classList.contains('hide'),name:me?.displayName||'',gid:group?.groupId||''}));
            if(!auth.hidden||auth.name!=='남회원'||auth.gid!=='grp_qa_entry')throw new Error(env.name+' login state not applied: '+JSON.stringify(auth));if(probe!==1||login!==1||state<1)throw new Error(env.name+` duplicate/missing canonical auth probe=${probe} login=${login} state=${state}`);if(legacyDuringLogin!==0)throw new Error(env.name+' legacy login endpoint fired during canonical submit: '+legacyDuringLogin);
            await p.evaluate(()=>goView('members'));await p.waitForSelector('#members .profileIdentity80[data-member-id="male1"] svg',{state:'visible'});await p.waitForSelector('#members .profileIdentity80[data-member-id="female1"] svg',{state:'visible'});await p.waitForTimeout(160);
            const icons=await p.evaluate(()=>{const m=document.querySelector('#members .profileIdentity80[data-member-id="male1"]'),f=document.querySelector('#members .profileIdentity80[data-member-id="female1"]');return {male:{g:m?.dataset.gender,b:getComputedStyle(m,'::after').content,c:getComputedStyle(m).color,cls:m?.className||''},female:{g:f?.dataset.gender,b:getComputedStyle(f,'::after').content,c:getComputedStyle(f).color,cls:f?.className||''}}});icons.male.b=cleanContent(icons.male.b);icons.female.b=cleanContent(icons.female.b);
            if(icons.male.g!=='남'||icons.male.b!=='남'||!icons.male.cls.includes('genderVisual10')||icons.female.g!=='여'||icons.female.b!=='여'||!icons.female.cls.includes('genderVisual10'))throw new Error(env.name+' legacy gender badge layout failed '+JSON.stringify(icons));
            await p.evaluate(()=>goView('queue'));await p.waitForSelector('#queue .profileIdentity80[data-member-id="male1"]',{state:'visible'});await p.waitForFunction(()=>{const e=document.querySelector('#queue .profileIdentity80[data-member-id="male1"]');return e&&getComputedStyle(e,'::after').content.includes('남')});const before=await p.evaluate(()=>JSON.stringify(draft));await p.locator('#queue .profileIdentity80[data-member-id="male1"]').click();await p.waitForTimeout(120);if(await p.evaluate(()=>JSON.stringify(draft))!==before)throw new Error(env.name+' no-photo avatar unexpectedly selected game');
            if(errors.length)throw new Error(env.name+' page errors: '+errors.join(' | '));console.log('PASS',env.name,{probe,login,state,icons});await ctx.close();
          }
          for(const env of envs)await runEnv(env);
          for(const b of Object.values(launched))if(b)await b.close();
          EOF
          node qa-entry.mjs
