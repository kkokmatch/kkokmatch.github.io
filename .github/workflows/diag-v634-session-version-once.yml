name: Diagnose v6.34 session and version once
on:
  push:
    paths:
      - '.github/workflows/diag-v634-session-version-once.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture runtime hotspots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-v6.33.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          pats=[
            'function renderAll','renderAll=','renderAll =',
            'function renderSettings','renderSettings=','renderSettings =',
            'function submitLogin','submitLogin=','submitLogin =',
            'function showLoginInline16','showLoginInline16=',
            'pageshow','visibilitychange','location.reload','reload()',
            "classList.add('hide')","classList.remove('hide')",
            'version','latest-version','v6.20','v5.0','v6.33',
            'forceUpdateApp','sessionStorage','localStorage',
            'loadState=async','function loadState','reloginLatest'
          ]
          hit=[]
          for i,l in enumerate(lines,1):
            if any(x in l for x in pats): hit.append(i)
          out=[f'LINECOUNT {len(lines)} HITS {len(hit)}']
          used=set()
          for i in hit:
            a=max(1,i-4); b=min(len(lines),i+8)
            key=(a,b)
            if key in used: continue
            used.add(key)
            out.append(f'\n--- {a}:{b} ---')
            for j in range(a,b+1):
              out.append(f'{j}: {lines[j-1][:1800]}')
          Path('diag-v634.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report and remove one-shot workflow
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git add diag-v634.txt
          git rm .github/workflows/diag-v634-session-version-once.yml
          git commit -m 'Capture v6.34 session/version diagnostic report'
          git push
