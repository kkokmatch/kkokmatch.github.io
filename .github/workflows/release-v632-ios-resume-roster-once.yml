name: Release v6.32 iOS roster resume repair once
on:
  push:
    paths:
      - '.github/workflows/release-v632-ios-resume-roster-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.32 candidate
        run: python3 scripts/build-v632.py
      - name: Static checks
        run: |
          node --check app-v6.32.js
          node scripts/validate-standalone-runtime.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('app-v6.32.js','utf8');for(const x of ['__kokmatchResumeRoster632','__kokmatchRepairRosterResume632','pagehide','pageshow','visibilitychange','resume632','kmRosterBtns621'])if(!s.includes(x))throw new Error('missing '+x);console.log('PASS v6.32 static resume markers')"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Existing runtime QA
        run: node scripts/qa-current-runtime.mjs
      - name: Existing focused QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Background resume repair QA
        run: |
          cp scripts/qa-current-runtime.mjs scripts/qa-resume632-temp.mjs
          python3 -c "from pathlib import Path;p=Path('scripts/qa-resume632-temp.mjs');s=p.read_text();needle='  const uniqueAssets=[...new Set(appAssets)]';insert=\"\"\"  await page.evaluate(()=>{for(const card of document.querySelectorAll('#members .memberCard')){const cur=card.querySelector(':scope > .kmRosterActions621,:scope > .v6MemberActions,:scope > .memberActions48,:scope > .memberActions60,:scope > .memberActions65');if(cur)cur.outerHTML='<div class=\\\"memberActions60\\\"><div class=\\\"status\\\">복귀오류</div><div class=\\\"memberBtns\\\"><button class=\\\"btn ghost\\\" type=\\\"button\\\">수정</button></div></div>';}window.dispatchEvent(new Event('pagehide'));window.dispatchEvent(new Event('pageshow'));});\n  await page.waitForTimeout(900);\n  expect(await labels('out1'),['입장','관람','수정'],'resume-out');\n  expect(await labels('wait1'),['퇴장','관람','수정'],'resume-waiting');\n  expect(await labels('spec1'),['입장','퇴장','수정'],'resume-spectator');\n  console.log('PASS v6.32 background resume restores roster buttons');\n\n\"\"\";assert needle in s;p.write_text(s.replace(needle,insert+needle,1))"
          node scripts/qa-resume632-temp.mjs
          rm scripts/qa-resume632-temp.mjs
      - name: Commit only after green QA
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          rm -f .github/workflows/release-v632-ios-resume-roster-once.yml scripts/build-v632.py
          git add app-v6.32.js app-v6.32.css index.html latest-version.json kokmatch-sw.js sw.js .github/workflows/release-v632-ios-resume-roster-once.yml scripts/build-v632.py
          git commit -m 'v6.32 stabilize roster buttons after iOS resume'
          git push
