name: QA v5.4 member profile13
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix13.js'
      - 'app-v5.4-hotfix-loader.js'
      - '.github/workflows/qa-v54-member-profile13.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: verify iOS member profile routes to shared viewer
        run: |
          cat > qa.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const thumb='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
          const b=await webkit.launch({headless:true});
          const p=await b.newPage({...devices['iPhone 13']});
          const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          let ready=false;
          for(let i=0;i<8&&!ready;i++){
            await p.goto('https://kkokmatch.github.io/?qa=profile13&t='+Date.now(),{waitUntil:'domcontentloaded'});
            try{await p.waitForFunction(()=>window.__kokmatchV54Fix13===true&&window.__kokmatchMemberProfileTapPatch==='13.0'&&typeof window.openProfilePhoto80==='function'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});ready=true}catch{}
          }
          if(!ready)throw new Error('fix13/shared viewer not loaded on production');
          await p.evaluate(({thumb})=>{
            const box=document.getElementById('members');box.innerHTML='';box.classList.remove('hide');
            const card=document.createElement('div');card.className='memberCard';
            const id=document.createElement('div');id.className='avatar profileIdentity80 profileTap80 profileAvatar53 male';id.dataset.memberId='m1';id.dataset.photo='1';id.dataset.gender='남';id.setAttribute('role','button');
            const im=document.createElement('img');im.src=thumb;im.alt='QA 프로필';id.appendChild(im);card.appendChild(id);box.appendChild(card);
            window.__qaViewerCalls=[];
            window.openProfilePhoto80=(el)=>window.__qaViewerCalls.push({mid:el?.dataset?.memberId||'',photo:el?.dataset?.photo||''});
          },{thumb});
          const css=await p.locator('#members .profileIdentity80 img').evaluate(el=>({pointer:getComputedStyle(el).pointerEvents,callout:getComputedStyle(el).getPropertyValue('-webkit-touch-callout'),select:getComputedStyle(el).getPropertyValue('-webkit-user-select')}));
          if(css.pointer!=='none')throw new Error('member image still receives pointer events '+JSON.stringify(css));
          const ctxPrevented=await p.locator('#members .profileIdentity80').evaluate(el=>{const ev=new Event('contextmenu',{bubbles:true,cancelable:true});el.dispatchEvent(ev);return ev.defaultPrevented});
          if(!ctxPrevented)throw new Error('iOS image context menu was not prevented');
          let calls=await p.evaluate(()=>window.__qaViewerCalls.slice());
          if(calls.length!==1||calls[0].mid!=='m1')throw new Error('contextmenu did not route to shared viewer '+JSON.stringify(calls));
          await p.waitForTimeout(550);
          await p.locator('#members .profileIdentity80').evaluate(el=>el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerType:'touch',isPrimary:true})));
          calls=await p.evaluate(()=>window.__qaViewerCalls.slice());
          if(calls.length!==2||calls[1].mid!=='m1')throw new Error('touch pointer did not route to shared viewer '+JSON.stringify(calls));
          const version=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock}));
          if(version.title!=='콕매치 v5.4'||version.data!=='5.4'||version.lock!=='5.4')throw new Error('version changed '+JSON.stringify(version));
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('PASS profile13',css,ctxPrevented,calls,version);await b.close();
          EOF
          node qa.mjs
