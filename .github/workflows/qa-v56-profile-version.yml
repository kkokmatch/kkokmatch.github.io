name: QA v5.6 profile and version
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v56-profile-version.yml'
      - 'app-v5.6.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'latest-version.json'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Verify v5.6 identity isolation on iPhone
        run: |
          cat > qa.mjs <<'EOF'
          import {webkit,devices} from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let browser,code=0;
          try{
            await sleep(15000);
            browser=await webkit.launch({headless:true});
            const p=await browser.newPage({...devices['iPhone 13']});p.setDefaultTimeout(15000);
            const imgA='data:image/jpeg;base64,AAADEVPHOTO';
            await p.route(PROFILE+'**',async route=>{const u=new URL(route.request().url()),g=u.searchParams.get('groupId');await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:g==='grpA'?{dev:{image:imgA}}:{}})})});
            await p.goto('https://kkokmatch.github.io/?qa=v56&t='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__kokmatchV56===true,{timeout:30000});
            const meta=await p.evaluate(async()=>{const x=await fetch('/latest-version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());return{title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,latest:x.semanticVersion,v56:window.__kokmatchV56Patch}});
            if(meta.title!=='콕매치 v5.6'||meta.data!=='5.6'||meta.lock!=='5.6'||meta.latest!=='5.6'||meta.v56!=='1.1')throw new Error('version '+JSON.stringify(meta));console.log('PASS version',meta);
            await p.evaluate(()=>{T='qa';me={role:'member',globalAdmin:false,memberId:'other',displayName:'다른회원'};currentGroupId='grpA';S={courtCount:2,courtNames:['1코트','2코트'],members:[{id:'other',name:'여회원',gender:'여',year:'1990',age:'30',cls:'D',role:'member',type:'member',state:'out',totalGames:0},{id:'dev',name:'박태영',gender:'남',year:'1989',age:'30',cls:'C',role:'member',type:'member',state:'out',totalGames:0}],queue:[],pendingGames:[],games:[],history:[],pairCounts:{}};renderMembers();renderQueue()});
            await p.waitForTimeout(1200);
            let a=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>({name:c.querySelector('.name')?.textContent||'',id:c.querySelector(':scope>.profileIdentity80')?.dataset.memberId,gender:c.querySelector(':scope>.profileIdentity80')?.dataset.gender,photo:c.querySelector(':scope>.profileIdentity80')?.dataset.photo,src:c.querySelector(':scope>.profileIdentity80 img')?.getAttribute('src')||''})));
            const dev=a.find(x=>x.id==='dev'),other=a.find(x=>x.id==='other');if(!dev||dev.gender!=='남'||dev.photo!=='1'||dev.src!==imgA)throw new Error('dev identity A '+JSON.stringify(a));if(!other||other.gender!=='여'||other.photo!=='0'||other.src)throw new Error('other identity A '+JSON.stringify(a));console.log('PASS group A mapping',a);
            await p.evaluate(()=>{currentGroupId='grpB';S={courtCount:2,courtNames:['1코트','2코트'],members:[{id:'dev',name:'박태영',gender:'남',year:'1989',age:'30',cls:'C',role:'member',type:'member',state:'out',totalGames:0},{id:'other',name:'다른남회원',gender:'남',year:'1992',age:'30',cls:'C',role:'member',type:'member',state:'out',totalGames:0},{id:'female',name:'여회원2',gender:'여',year:'1994',age:'30',cls:'D',role:'member',type:'member',state:'out',totalGames:0}],queue:['female','other'],pendingGames:[],games:[],history:[],pairCounts:{}};renderMembers();renderQueue()});
            await p.waitForTimeout(1200);
            const b=await p.evaluate(()=>({members:[...document.querySelectorAll('#members .memberCard')].map(c=>({id:c.querySelector(':scope>.profileIdentity80')?.dataset.memberId,gender:c.querySelector(':scope>.profileIdentity80')?.dataset.gender,photo:c.querySelector(':scope>.profileIdentity80')?.dataset.photo,src:c.querySelector(':scope>.profileIdentity80 img')?.getAttribute('src')||''})),queue:[...document.querySelectorAll('#queue .queueCard')].map(c=>({id:c.querySelector(':scope>.profileIdentity80')?.dataset.memberId,gender:c.querySelector(':scope>.profileIdentity80')?.dataset.gender,photo:c.querySelector(':scope>.profileIdentity80')?.dataset.photo}))}));
            if(b.members.some(x=>x.photo==='1'||x.src))throw new Error('stale profile leaked '+JSON.stringify(b));const fm=b.members.find(x=>x.id==='female'),om=b.members.find(x=>x.id==='other');if(fm?.gender!=='여'||om?.gender!=='남')throw new Error('gender mapping B '+JSON.stringify(b));if(b.queue[0]?.id!=='female'||b.queue[0]?.gender!=='여'||b.queue[1]?.id!=='other'||b.queue[1]?.gender!=='남')throw new Error('queue mapping '+JSON.stringify(b));console.log('PASS group isolation and genders',b);
            await p.waitForTimeout(1200);const final=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock}));if(final.title!=='콕매치 v5.6'||final.data!=='5.6'||final.lock!=='5.6')throw new Error('legacy version overwrite '+JSON.stringify(final));console.log('PASS persistent 5.6');
          }catch(e){code=1;console.error('QA_FAIL',e?.stack||e)}finally{if(browser)await browser.close().catch(()=>{});process.exit(code)}
          EOF
          node qa.mjs
