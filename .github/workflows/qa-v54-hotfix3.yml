name: QA v5.4 production
on:
  push:
    paths:
      - '.github/workflows/qa-v54-hotfix3.yml'
      - 'app-v5.4.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix5.js'
      - 'app-v5.4-fix6.js'
      - 'app-v5.4-fix7.js'
      - 'app-v5.4-fix8.js'
      - 'app-v5.4-fix9.js'
      - 'app-v5.4-fix10.js'
      - 'app-v5.4-fix12.js'
      - 'app-v5.4-fix14.js'
      - 'app-v5.4-fix15.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: live production regression
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844}});
          const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          const clean=v=>String(v||'').replace(/^['"]|['"]$/g,'');
          let thumb='',full='',posts=0,fullPosts=0,fullGets=0;
          await p.route(PROFILE+'**',async route=>{const r=route.request(),u=new URL(r.url());if(r.method()==='POST'){posts++;const x=r.postDataJSON?.()||{};thumb=String(x.image||thumb||'');if(x.fullImage){full=String(x.fullImage);fullPosts++}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,image:thumb,fullSaved:!!x.fullImage})})}if(u.searchParams.get('full')==='1'){fullGets++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({image:thumb,fullImage:full||thumb})})}return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:thumb?{male1:{image:thumb}}:{}})})});
          let ready=false;for(let i=0;i<8&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=reg10&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Fix10===true&&window.__kokmatchProfileUiPatch==='10.0'&&window.__kokmatchVersionLock==='5.4',{timeout:12000});ready=true}catch{}}
          if(!ready)throw new Error('fix10 not ready on production');
          const boot=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,ui:window.__kokmatchProfileUiPatch}));if(boot.title!=='콕매치 v5.4'||boot.data!=='5.4'||boot.lock!=='5.4'||boot.ui!=='10.0')throw new Error('version/ui lock failed '+JSON.stringify(boot));
          await p.evaluate(()=>{T='qa-token';currentGroupId='grp_qa_reg10';currentView='settings';S=emptyClientState();S.members=[{id:'male1',name:'남자A',gender:'남',age:'30',cls:'C',type:'member',role:'manager',totalGames:0,state:'waiting',joinedAt:Date.now()-60000},{id:'female1',name:'여자B',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-30000}];S.queue=['male1','female1'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};group={groupId:'grp_qa_reg10',name:'QA'};groups=[];me={memberId:'male1',displayName:'남자A',role:'manager',globalAdmin:false,groupId:'grp_qa_reg10'};normalizeClient();draft.splice(0,draft.length,null,null,null,null);renderAll();goView('settings');document.getElementById('login')?.classList.add('hide')});
          await p.waitForSelector('#profileFile53',{state:'attached',timeout:10000});await p.evaluate(()=>{window.createImageBitmap=async()=>{throw new Error('force fallback')}});
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'qa.png',mimeType:'image/png',buffer:png});await p.waitForFunction(()=>window.__kokmatchProfileSaveState==='saved'||window.__kokmatchProfileSaveState==='error',{timeout:15000});if(await p.evaluate(()=>window.__kokmatchProfileSaveState)!=='saved')throw new Error('profile save failed');
          for(let i=0;i<30&&fullPosts<1;i++)await p.waitForTimeout(100);if(posts<2||fullPosts!==1||!thumb||!full)throw new Error(`profile payload failed posts=${posts} fullPosts=${fullPosts}`);
          await p.evaluate(()=>goView('members'));await p.waitForSelector('#members .profileIdentity80[data-member-id="male1"] img',{state:'visible'});await p.waitForSelector('#members .profileIdentity80[data-member-id="female1"] svg',{state:'visible'});await p.waitForTimeout(180);
          const members=await p.evaluate(()=>[...document.querySelectorAll('#members .memberCard')].map(c=>{const a=c.querySelector('.profileIdentity80');return {name:c.querySelector('.name')?.textContent||'',id:a?.dataset.memberId||'',g:a?.dataset.gender||'',photo:a?.dataset.photo||'',badge:getComputedStyle(a,'::after').content||'',svg:!!a?.querySelector('svg'),cls:a?.className||''}}));members.forEach(x=>x.badge=clean(x.badge));console.log('MEMBERS',members);const mm=members.find(x=>x.name.includes('남자A')),ff=members.find(x=>x.name.includes('여자B'));if(!mm||mm.id!=='male1'||mm.g!=='남'||mm.photo!=='1'||mm.badge!=='남'||!mm.cls.includes('genderVisual10'))throw new Error('male photo identity mismatch');if(!ff||ff.id!=='female1'||ff.g!=='여'||ff.photo!=='0'||ff.badge!=='여'||!ff.svg||!ff.cls.includes('genderVisual10'))throw new Error('female legacy avatar mismatch');
          const getBefore=fullGets;await p.locator('#members .profileIdentity80[data-member-id="male1"]').click();await p.waitForSelector('#profilePhotoModal80.on',{state:'visible'});const pop=await p.locator('#profilePhotoModal80 .profilePhotoState80').textContent();if(!String(pop||'').includes('고화질'))throw new Error('high-res popup missing');if(fullGets-getBefore>1)throw new Error('too many high-res fetches');await p.locator('#profilePhotoModal80 .profilePhotoClose80').click();
          await p.evaluate(()=>goView('queue'));await p.waitForTimeout(220);await p.waitForSelector('#queue .profileIdentity80[data-member-id="female1"]',{state:'visible'});await p.waitForFunction(()=>{const e=document.querySelector('#queue .profileIdentity80[data-member-id="female1"]');return e&&getComputedStyle(e,'::after').content.includes('여')});
          const beforePhoto=await p.evaluate(()=>JSON.stringify(draft));await p.locator('#queue .profileIdentity80[data-member-id="male1"]').click();await p.waitForSelector('#profilePhotoModal80.on',{state:'visible'});if(await p.evaluate(()=>JSON.stringify(draft))!==beforePhoto)throw new Error('photo tap selected game');await p.locator('#profilePhotoModal80 .profilePhotoClose80').click();
          const beforeFallback=await p.evaluate(()=>JSON.stringify(draft));await p.locator('#queue .profileIdentity80[data-member-id="female1"]').click();await p.waitForTimeout(120);if(await p.evaluate(()=>JSON.stringify(draft))!==beforeFallback)throw new Error('no-photo avatar selected game');if(await p.locator('#profilePhotoModal80.on').count())throw new Error('no-photo avatar opened popup');
          await p.locator('#queue .queueCard').first().locator('.queueInfo53').click();await p.waitForTimeout(80);const afterInfo=await p.evaluate(()=>JSON.stringify(draft));if(afterInfo===beforeFallback)throw new Error('normal queue info no longer selects player');
          const end=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,ui:window.__kokmatchProfileUiPatch}));if(end.title!=='콕매치 v5.4'||end.data!=='5.4'||end.ui!=='10.0')throw new Error('version changed after interactions');if(errors.length)throw new Error(errors.join(' | '));console.log('PASS regression',end,{posts,fullPosts,fullGets});await b.close();
          EOF
          node qa.mjs
