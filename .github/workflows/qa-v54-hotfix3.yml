name: QA v5.4 production
on:
  push:
    paths:
      - '.github/workflows/qa-v54-hotfix3.yml'
      - 'app-v5.1.js'
      - 'app-v5.2.js'
      - 'app-v5.3.js'
      - 'app-v5.4.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix5.js'
      - 'app-v5.4-fix6.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: live production browser qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const token='qa_vvn0c5leJpwUYXfZrEvfRyJDuiKS-ZqL';
          const b=await chromium.launch({headless:true});
          const ctx=await b.newContext({viewport:{width:390,height:844}});
          await ctx.addInitScript(()=>{const native=window.setInterval.bind(window);window.__qaIntervals=[];window.setInterval=(fn,ms,...args)=>{if(typeof fn==='function')window.__qaIntervals.push({fn,ms,args});return native(fn,ms,...args)}});
          const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          let ready=false;
          for(let i=0;i<8&&!ready;i++){
            await p.goto('https://kkokmatch.github.io/?qa=prod54&t='+Date.now(),{waitUntil:'networkidle'});
            try{await p.waitForFunction(()=>window.__kokmatchV54Hotfix3===true&&window.__kokmatchV54Fix4===true&&window.__kokmatchV54Fix5===true&&window.__kokmatchV54Fix6===true&&window.__kokmatchProfileFixReady==='6.3',{timeout:10000});ready=true}catch{}
          }
          if(!ready)throw new Error('production v5.4 hotfix chain did not become ready');
          const boot=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,profile:window.__kokmatchProfileFixReady,v:document.getElementById('currentVersion52')?.textContent||''}));console.log('BOOT_VERSION',boot);if(boot.title!=='콕매치 v5.4'||boot.data!=='5.4'||boot.lock!=='5.4'||boot.v!=='v5.4')throw new Error('production did not boot locked to v5.4');
          await p.evaluate(({token})=>{T=token;currentGroupId='grp_qa_profile54';currentView='queue';S=emptyClientState();S.members=[{id:'qa_profile_m1',name:'QA프로필',gender:'남',age:'30',cls:'C',type:'member',role:'manager',totalGames:0,state:'waiting',joinedAt:Date.now()-30000},{id:'m2',name:'여자B',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-20000},{id:'m3',name:'남자C',gender:'남',age:'40',cls:'D',type:'member',role:'organizer',totalGames:0,state:'matched',joinedAt:Date.now()-10000},{id:'m4',name:'여자D',gender:'여',age:'20',cls:'A',type:'member',role:'member',totalGames:0,state:'matched',joinedAt:Date.now()-10000}];S.queue=['qa_profile_m1','m2'];S.pendingGames=[{id:'p1',players:['qa_profile_m1','m2'],createdAt:Date.now()-10000}];S.games=[];S.history=[];S.pairCounts={};me={memberId:'qa_profile_m1',displayName:'QA프로필',role:'manager',groupId:'grp_qa_profile54'};group={groupId:'grp_qa_profile54',name:'QA'};groups=[];normalizeClient();draft.splice(0,draft.length,'qa_profile_m1','m2',null,null);renderAll();document.getElementById('login')?.classList.add('hide');document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'))},{token});
          const draftBefore=await p.evaluate(()=>({draft:[...draft],stored:JSON.parse(localStorage.getItem('kokmatch_draft_v54_grp_qa_profile54')||'[]')}));console.log('DRAFT_BEFORE',draftBefore);if(JSON.stringify(draftBefore.draft)!==JSON.stringify(draftBefore.stored))throw new Error('draft was not persisted before profile test');
          const snap=loc=>loc.evaluate(el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return {padding:c.padding,minHeight:c.minHeight,bg:c.backgroundColor,radius:c.borderRadius,display:c.display,dir:c.flexDirection,height:Math.round(r.height),name:el.querySelector('.slotName')?.className,meta:el.querySelector('.meta')?.className,role:el.querySelectorAll('.roleBadge').length,nameGender:el.querySelectorAll('.nameGender58').length,oldGender:el.querySelectorAll('.genderInline39,.genderMark53,.genderPerson54,.genderPerson57').length}});
          const pending=await snap(p.locator('.pendingCard:not(.composer54) .pendingSlot:not(.emptySlot)').first()),composer=await snap(p.locator('.composer54 .pendingSlot:not(.emptySlot)').first());console.log('PENDING',pending,'COMPOSER',composer);for(const k of ['padding','minHeight','bg','radius','display','dir','height','name','meta','role','nameGender','oldGender'])if(String(pending[k])!==String(composer[k]))throw new Error(`layout mismatch ${k}: ${pending[k]} != ${composer[k]}`);
          await p.evaluate(()=>{currentView='settings';goView('settings');window.createImageBitmap=async()=>{throw new Error('forced bitmap decode failure')}});await p.waitForSelector('#profileFile53',{state:'attached'});
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'iphone-fallback.png',mimeType:'image/png',buffer:png});
          await p.waitForFunction(()=>document.querySelector('#profileCard53 .profilePreview53 img')&&document.querySelector('#members .memberCard img')&&document.querySelector('#queue .queueCard img'),{timeout:10000});
          await p.waitForFunction(()=>window.__kokmatchProfileSaveState==='saved'||window.__kokmatchProfileSaveState==='error',{timeout:15000});
          const saveState=await p.evaluate(()=>window.__kokmatchProfileSaveState);if(saveState!=='saved')throw new Error('profile save state='+saveState);
          const ui=await p.evaluate(()=>({preview:document.querySelectorAll('#profileCard53 .profilePreview53 img').length,member:document.querySelectorAll('#members .memberCard img').length,queue:document.querySelectorAll('#queue .queueCard img').length,draft:[...draft],stored:JSON.parse(localStorage.getItem('kokmatch_draft_v54_grp_qa_profile54')||'[]')}));console.log('PROFILE_AND_DRAFT',ui);if(ui.preview!==1||ui.member<1||ui.queue<1)throw new Error('profile did not apply through fallback decoder');if(JSON.stringify(ui.draft)!==JSON.stringify(draftBefore.draft)||JSON.stringify(ui.stored)!==JSON.stringify(draftBefore.stored))throw new Error('profile flow changed retained draft');
          let image='',ok=false;for(let i=0;i<12&&!ok;i++){const res=await p.request.get('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53?groupId=grp_qa_profile54&t='+Date.now(),{headers:{authorization:'Bearer '+token}});const json=await res.json();image=json.profiles?.qa_profile_m1?.image||'';ok=res.ok()&&image.length>=100;if(!ok)await new Promise(r=>setTimeout(r,300))}console.log('SERVER_IMAGE_LEN',image.length);if(!ok)throw new Error('profile not persisted');
          await p.evaluate(async()=>{for(const x of (window.__qaIntervals||[]).filter(x=>Number(x.ms)>=30000)){try{await x.fn(...x.args)}catch{}};try{renderHeader();renderAll()}catch{}});
          const afterTimers=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,v:document.getElementById('currentVersion52')?.textContent||'',draft:[...draft],stored:JSON.parse(localStorage.getItem('kokmatch_draft_v54_grp_qa_profile54')||'[]')}));console.log('AFTER_LEGACY_TIMERS',afterTimers);if(afterTimers.title!=='콕매치 v5.4'||afterTimers.data!=='5.4'||afterTimers.v!=='v5.4')throw new Error('legacy version timers overwrote v5.4');if(JSON.stringify(afterTimers.draft)!==JSON.stringify(draftBefore.draft)||JSON.stringify(afterTimers.stored)!==JSON.stringify(draftBefore.stored))throw new Error('version/render cycle changed retained draft');
          await p.evaluate(()=>{currentView='queue';goView('queue')});await p.screenshot({path:'production-v54.png',fullPage:true});if(errors.length)throw new Error(errors.join('|'));await b.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-v54-screen
          path: production-v54.png
