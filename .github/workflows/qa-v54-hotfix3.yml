name: QA v5.4 production
on:
  push:
    paths:
      - '.github/workflows/qa-v54-hotfix3.yml'
      - 'app-v5.1.js'
      - 'app-v5.2.js'
      - 'app-v5.3.js'
      - 'app-v5.4.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix5.js'
      - 'app-v5.4-fix6.js'
      - 'app-v5.4-fix7.js'
      - 'app-v5.4-fix8.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: live production browser qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const PROFILE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53';
          const b=await chromium.launch({headless:true});
          const ctx=await b.newContext({viewport:{width:390,height:844}});
          await ctx.addInitScript(()=>{const native=window.setInterval.bind(window);window.__qaIntervals=[];window.setInterval=(fn,ms,...args)=>{if(typeof fn==='function')window.__qaIntervals.push({fn,ms,args});return native(fn,ms,...args)}});
          const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          let mockImage='',mockFull='',postCount=0,fullPostCount=0,fullGetCount=0;
          await p.route(PROFILE+'**',async route=>{const req=route.request(),url=new URL(req.url());if(req.method()==='POST'){postCount++;const body=req.postDataJSON?.()||{};mockImage=String(body.image||mockImage||'');if(body.fullImage){mockFull=String(body.fullImage);fullPostCount++}await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,image:mockImage,fullSaved:!!body.fullImage})})}else if(url.searchParams.get('full')==='1'){fullGetCount++;await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({image:mockImage,fullImage:mockFull||mockImage})})}else await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({profiles:mockImage?{qa_profile_m1:{image:mockImage}}:{}})})});
          let ready=false;
          for(let i=0;i<8&&!ready;i++){await p.goto('https://kkokmatch.github.io/?qa=prod54&t='+Date.now(),{waitUntil:'networkidle'});try{await p.waitForFunction(()=>window.__kokmatchV54Hotfix3===true&&window.__kokmatchV54Fix4===true&&window.__kokmatchV54Fix5===true&&window.__kokmatchV54Fix6===true&&window.__kokmatchV54Fix7===true&&window.__kokmatchV54Fix8===true&&window.__kokmatchProfileUiPatch==='8.0',{timeout:10000});ready=true}catch{}}
          if(!ready)throw new Error('production v5.4 hotfix chain did not become ready');
          const boot=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,lock:window.__kokmatchVersionLock,v:document.getElementById('currentVersion52')?.textContent||'',ui:window.__kokmatchProfileUiPatch}));console.log('BOOT_VERSION',boot);if(boot.title!=='콕매치 v5.4'||boot.data!=='5.4'||boot.lock!=='5.4'||boot.v!=='v5.4'||boot.ui!=='8.0')throw new Error('production did not boot profile ui 8.0');
          await p.evaluate(()=>{T='qa-local-only';currentGroupId='grp_qa_profile54';currentView='settings';S=emptyClientState();S.members=[{id:'qa_profile_m1',name:'남자A',gender:'남',age:'30',cls:'C',type:'member',role:'admin',totalGames:0,state:'waiting',joinedAt:Date.now()-30000},{id:'m2',name:'여자B',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-20000}];S.queue=['qa_profile_m1','m2'];S.pendingGames=[];S.games=[];S.history=[];S.pairCounts={};group={groupId:'grp_qa_profile54',name:'QA'};groups=[];normalizeClient();me={memberId:null,displayName:'남자A',role:'admin',globalAdmin:true,groupId:'grp_qa_profile54'};draft.splice(0,draft.length,null,null,null,null);renderAll();goView('settings');document.getElementById('login')?.classList.add('hide')});
          if(await p.evaluate(()=>window.resolveProfileMemberId54?.())!=='qa_profile_m1')throw new Error('global admin identity recovery failed');
          await p.waitForSelector('#profileFile53',{state:'attached',timeout:10000});
          await p.evaluate(()=>{window.createImageBitmap=async()=>{throw new Error('forced bitmap fallback')}});
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'iphone-fallback.png',mimeType:'image/png',buffer:png});
          await p.waitForFunction(()=>window.__kokmatchProfileSaveState==='saved'||window.__kokmatchProfileSaveState==='error',{timeout:15000});if(await p.evaluate(()=>window.__kokmatchProfileSaveState)!=='saved')throw new Error('profile save failed');
          for(let i=0;i<30&&fullPostCount<1;i++)await p.waitForTimeout(100);console.log('PROFILE_POSTS',postCount,'FULL_POSTS',fullPostCount);if(postCount<2||fullPostCount!==1||!mockFull)throw new Error('high-res profile was not separately saved');
          await p.evaluate(()=>goView('members'));await p.waitForSelector('#members .memberCard .profileIdentity80',{state:'visible',timeout:10000});
          await p.evaluate(()=>{const cards=[...document.querySelectorAll('#members .memberCard')];if(cards.length>1)cards[0].parentElement.insertBefore(cards[1],cards[0])});await p.waitForTimeout(150);
          const memberIds=await p.locator('#members .memberCard').evaluateAll(cards=>cards.map(c=>({name:c.querySelector('.memberName45,.name')?.textContent||'',mid:c.querySelector('.profileIdentity80')?.dataset.memberId||'',gender:c.querySelector('.profileIdentity80')?.dataset.gender||'',txt:c.querySelector('.genderFallback80')?.textContent||'',badge:c.querySelector('.profileGender80')?.textContent||''})));console.log('MEMBER_ID_GENDER',memberIds);const male=memberIds.find(x=>x.name.includes('남자A')),female=memberIds.find(x=>x.name.includes('여자B'));if(!male||male.mid!=='qa_profile_m1'||male.gender!=='남'||male.badge!=='남')throw new Error('male profile bound to wrong member/gender');if(!female||female.mid!=='m2'||female.gender!=='여'||female.txt!=='여')throw new Error('female fallback bound incorrectly');
          const getsBefore=fullGetCount;await p.locator('#members .profileIdentity80[data-member-id="qa_profile_m1"]').click();await p.waitForSelector('#profilePhotoModal80.on',{state:'visible'});await p.waitForTimeout(120);const popupState=await p.locator('#profilePhotoModal80 .profilePhotoState80').textContent();console.log('POPUP_STATE',popupState,'FULL_GET_DELTA',fullGetCount-getsBefore);if(!String(popupState||'').includes('고화질'))throw new Error('member popup did not use high-res image');if(fullGetCount-getsBefore>1)throw new Error('popup fetched high-res more than once');await p.locator('#profilePhotoModal80 .profilePhotoClose80').click();
          await p.evaluate(()=>goView('queue'));await p.waitForSelector('#queue .queueCard .profileIdentity80',{state:'visible',timeout:10000});
          const q=await p.locator('#queue .queueCard').evaluateAll(cards=>cards.map(c=>({mid:c.querySelector('.profileIdentity80')?.dataset.memberId||'',gender:c.querySelector('.profileIdentity80')?.dataset.gender||'',photo:c.querySelector('.profileIdentity80')?.dataset.photo||'',txt:c.querySelector('.genderFallback80')?.textContent||''})));console.log('QUEUE_ID_GENDER',q);if(q[0]?.mid!=='qa_profile_m1'||q[0]?.gender!=='남'||q[0]?.photo!=='1')throw new Error('queue male profile identity wrong');if(q[1]?.mid!=='m2'||q[1]?.gender!=='여'||q[1]?.photo!=='0'||q[1]?.txt!=='여')throw new Error('queue female fallback wrong');
          const beforePhotoTap=await p.evaluate(()=>JSON.stringify(draft));await p.locator('#queue .profileIdentity80[data-member-id="qa_profile_m1"]').click();await p.waitForSelector('#profilePhotoModal80.on',{state:'visible'});if(await p.evaluate(()=>JSON.stringify(draft))!==beforePhotoTap)throw new Error('queue profile tap registered game');await p.locator('#profilePhotoModal80 .profilePhotoClose80').click();
          const beforeFallbackTap=await p.evaluate(()=>JSON.stringify(draft));await p.locator('#queue .profileIdentity80[data-member-id="m2"]').click();await p.waitForTimeout(150);if(await p.evaluate(()=>JSON.stringify(draft))!==beforeFallbackTap)throw new Error('queue fallback gender tap registered game');if(await p.locator('#profilePhotoModal80.on').count())throw new Error('fallback gender unexpectedly opened popup');
          await p.locator('#queue .queueCard').first().locator('.queueInfo53,.queueInfo48').first().click();if(await p.evaluate(()=>JSON.stringify(draft))===beforeFallbackTap)throw new Error('normal queue card area no longer registers game');
          await p.evaluate(async()=>{for(const x of (window.__qaIntervals||[]).filter(x=>Number(x.ms)>=30000)){try{await x.fn(...x.args)}catch{}};try{renderHeader();renderAll()}catch{}});const after=await p.evaluate(()=>({title:document.title,data:document.documentElement.dataset.kokmatchVersion,v:document.getElementById('currentVersion52')?.textContent||''}));if(after.title!=='콕매치 v5.4'||after.data!=='5.4'||after.v!=='v5.4')throw new Error('legacy timers overwrote v5.4');if(errors.length)throw new Error(errors.join('|'));await b.close();
          EOF
          node qa.mjs
