name: QA v5.4 hotfix3
on:
  push:
    paths:
      - '.github/workflows/qa-v54-hotfix3.yml'
      - 'app-v5.4.js'
      - 'app-v5.4-fix4.js'
      - 'app-v5.4-fix5.js'
      - 'app-v5.4-fix6.js'
      - 'app-v5.4-hotfix-loader.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: live browser qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const token='qa_vvn0c5leJpwUYXfZrEvfRyJDuiKS-ZqL';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.goto('https://kkokmatch.github.io/?qa=hotfix6&t='+Date.now(),{waitUntil:'networkidle'});
          await p.waitForFunction(()=>window.__kokmatchV54Hotfix3===true,{timeout:30000});
          if(!(await p.evaluate(()=>window.__kokmatchV54Fix4===true)))await p.addScriptTag({url:'https://kkokmatch.github.io/app-v5.4-fix4.js?v=4&t='+Date.now()});
          if(!(await p.evaluate(()=>window.__kokmatchV54Fix5===true)))await p.addScriptTag({url:'https://kkokmatch.github.io/app-v5.4-fix5.js?v=5&t='+Date.now()});
          if(!(await p.evaluate(()=>window.__kokmatchV54Fix6===true)))await p.addScriptTag({url:'https://kkokmatch.github.io/app-v5.4-fix6.js?v=6&t='+Date.now()});
          await p.waitForFunction(()=>window.__kokmatchV54Fix4===true&&window.__kokmatchV54Fix5===true&&window.__kokmatchV54Fix6===true,{timeout:10000});
          await p.evaluate(({token})=>{T=token;currentGroupId='grp_qa_profile54';currentView='queue';S=emptyClientState();S.members=[{id:'qa_profile_m1',name:'QA프로필',gender:'남',age:'30',cls:'C',type:'member',role:'manager',totalGames:0,state:'waiting',joinedAt:Date.now()-30000},{id:'m2',name:'여자B',gender:'여',age:'30',cls:'B',type:'member',role:'member',totalGames:0,state:'waiting',joinedAt:Date.now()-20000},{id:'m3',name:'남자C',gender:'남',age:'40',cls:'D',type:'member',role:'organizer',totalGames:0,state:'matched',joinedAt:Date.now()-10000},{id:'m4',name:'여자D',gender:'여',age:'20',cls:'A',type:'member',role:'member',totalGames:0,state:'matched',joinedAt:Date.now()-10000}];S.queue=['qa_profile_m1','m2'];S.pendingGames=[{id:'p1',players:['qa_profile_m1','m2'],createdAt:Date.now()-10000}];S.games=[];S.history=[];S.pairCounts={};me={memberId:'qa_profile_m1',displayName:'QA프로필',role:'manager',groupId:'grp_qa_profile54'};group={groupId:'grp_qa_profile54',name:'QA'};groups=[];normalizeClient();draft.splice(0,draft.length,'qa_profile_m1','m2',null,null);renderAll();document.getElementById('login')?.classList.add('hide');document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='queue'))},{token});
          const snap=loc=>loc.evaluate(el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return {cls:el.className,padding:c.padding,minHeight:c.minHeight,bg:c.backgroundColor,radius:c.borderRadius,display:c.display,dir:c.flexDirection,height:Math.round(r.height),name:el.querySelector('.slotName')?.className,meta:el.querySelector('.meta')?.className,role:el.querySelectorAll('.roleBadge').length,html:el.innerHTML}});
          const pending=await snap(p.locator('.pendingCard:not(.composer54) .pendingSlot').first()),composer=await snap(p.locator('.composer54 .pendingSlot').first());console.log('PENDING',pending,'COMPOSER',composer);
          for(const k of ['padding','minHeight','bg','radius','display','dir','height','name','meta','role'])if(String(pending[k])!==String(composer[k]))throw new Error(`layout mismatch ${k}: ${pending[k]} != ${composer[k]}`);
          if(await p.locator('.composer54 .pendingHead').count()!==1)throw new Error('composer pendingHead missing');
          await p.evaluate(()=>{currentView='settings';goView('settings')});await p.waitForSelector('#profileFile53',{state:'attached'});
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZKxkAAAAASUVORK5CYII=','base64');await p.locator('#profileFile53').setInputFiles({name:'profile-test.png',mimeType:'image/png',buffer:png});
          await p.waitForFunction(()=>document.querySelector('#profileCard53 .profilePreview53 img')&&document.querySelector('#members .memberCard img')&&document.querySelector('#queue .queueCard img'),{timeout:10000});
          const ui=await p.evaluate(()=>({preview:document.querySelectorAll('#profileCard53 .profilePreview53 img').length,member:document.querySelectorAll('#members .memberCard img').length,queue:document.querySelectorAll('#queue .queueCard img').length}));console.log('PROFILE_UI_IMMEDIATE',ui);if(ui.preview!==1||ui.member<1||ui.queue<1)throw new Error('profile did not apply immediately');
          await p.waitForFunction(()=>{const l=document.querySelector('label[for="profileFile53"]');return l&&/저장됨|사진 변경/.test(l.textContent||'')},{timeout:10000});
          const res=await p.request.get('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-profile-v53?groupId=grp_qa_profile54&t='+Date.now(),{headers:{authorization:'Bearer '+token}}),json=await res.json(),image=json.profiles?.qa_profile_m1?.image||'';console.log('SERVER_IMAGE_LEN',image.length);if(!res.ok()||image.length<100)throw new Error('profile not persisted');
          await p.evaluate(()=>{currentView='queue';goView('queue')});await p.screenshot({path:'hotfix6.png',fullPage:true});if(errors.length)throw new Error(errors.join('|'));await b.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hotfix6-screen
          path: hotfix6.png
