name: Build v6.25 speed layout once
on:
  push:
    paths:
      - '.github/workflows/build-v625-once.yml'
      - 'scripts/build-v625-speed-layout.mjs'
      - 'scripts/qa-save-layout-current.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v6.25 candidate
        run: node scripts/build-v625-speed-layout.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          echo $! >/tmp/kokmatch-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/kokmatch-http.log
          exit 1
      - name: Boot diagnostic
        run: node scripts/qa-boot-diagnostic.mjs
      - name: Mobile roster QA
        run: node scripts/qa-current-runtime.mjs
      - name: Partner and poll QA
        run: node scripts/qa-partner-poll-current.mjs
      - name: Save speed and stats layout QA
        run: node scripts/qa-save-layout-current.mjs
      - name: Verify one runtime
        run: node scripts/validate-standalone-runtime.mjs
      - name: Commit v6.25 only after all QA passes
        run: |
          git config user.name 'kkokmatch'
          git config user.email 'hanarin0201@gmail.com'
          git add app-v6.25.js app-v6.25.css index.html latest-version.json
          git commit -m 'v6.25 speed up saves and restore poll layout'
          git push
