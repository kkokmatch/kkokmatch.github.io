name: Bump v5.6 hotfix loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump hotfix loader query
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          n=re.sub(r'/app-v5\.4-hotfix-loader\.js\?v=[^\"]+', '/app-v5.4-hotfix-loader.js?v=22.0', s)
          if n != s:
              p.write_text(n,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then
            echo "already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load v5.6 hotfix loader v22"
          git push
