name: QA v5.4 iOS member slot v27
on:
  push:
    branches: [main]
    paths:
      - 'app-v5.4-fix27.js'
      - 'ios-diagnostic.html'
      - '.github/tests/qa-v27-member-slot-touch.mjs'
      - '.github/workflows/qa-v54-ios-member-slot-v27.yml'
  workflow_dispatch:
jobs:
  webkit-member-slot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Tap member slot wrappers in iPhone Kakao WebKit
        run: |
          python3 -m http.server 4173 >/tmp/kokmatch-http.log 2>&1 &
          node .github/tests/qa-v27-member-slot-touch.mjs
