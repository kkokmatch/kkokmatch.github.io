name: Prune Kokmatch v6 runtime
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune-v6-runtime.mjs'
      - 'scripts/v6-canonical-member-controls.mjs'
      - 'scripts/v6-canonical-header.mjs'
      - 'scripts/v6-roster-cleanup.mjs'
      - 'scripts/v6-disable-legacy-auto-update.mjs'
      - 'scripts/v6-ui-terminology.mjs'
      - '.github/workflows/prune-v6-runtime.yml'
  workflow_dispatch:
concurrency:
  group: kokmatch-v6-runtime-cleanup
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prune-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical v6 runtime
        run: |
          node scripts/prune-v6-runtime.mjs
          node scripts/v6-canonical-member-controls.mjs
          node scripts/v6-canonical-header.mjs
          node scripts/v6-roster-cleanup.mjs
          node scripts/v6-disable-legacy-auto-update.mjs
          node scripts/v6-ui-terminology.mjs
      - name: Validate generated source only
        run: |
          node --check app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix22.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix23.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix24.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix26.js' app-v6.0.js
          ! grep -q 'auto-v6' app-v6.0.js
          grep -q "__kokmatchInteractionCore='6.0'" app-v6.0.js
          grep -q "__kokmatchRosterCanonicalV6='6.0.3'" app-v6.0.js
          grep -q 'function repairMemberControlsV6' app-v6.0.js
          grep -q 'function normalizeHeaderV6' app-v6.0.js
          grep -q 'memberRosterFooterV6' app-v6.0.js
          grep -q '__kokmatchRepairRosterV6' app-v6.0.js
          grep -q 'V6_CANONICAL_ROSTER_CSS_BEGIN' app-v6.0.css
          grep -q '구형 로그아웃 호출 차단' app-v6.0.js
          ! grep -Eq '총관리자|모임관리자|게임편성자|일반회원' app-v6.0.js
          ! grep -F ".src='/app-v" app-v6.0.js
          ! grep -F '.src="/app-v' app-v6.0.js
      - name: Update cleanup metadata and cache version
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const build='2026.08.31.standalone.7';
          const p='latest-version.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.version=60;x.label='6.0';x.semanticVersion='6.0';x.build=build;x.updatedAt='2026-08-31T13:10:00+09:00';x.note='v6.0 독립 운영본 · 역할배지 정리 · 같이한 경기 제거 · 월출석/파트너 · 4글자 이름 공간확보 · 급수 파스텔 · 명부 재진입 전체복원';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          fs.writeFileSync('v6-cleanup-report.json',JSON.stringify({version:'6.0',build,removed:['legacy automatic updater redirect','legacy fix22 roster ownership','app-v5.4-fix23.js interaction overlap','app-v5.4-fix24.js interaction overlap','app-v5.4-fix26.js interaction overlap','legacy duplicated runtime header/logout nodes','duplicated roster version markers'],replacement:'single v6.0 canonical interaction/member-controls/header/roster ownership',features:['role badges: 개발자/모임장/운영진/일반','remove roster together-game action and total-game badge','current-month attendance + partner setting row','four-character member name lane with right-aligned action area','grade-matched pastel roster cards','member roster re-entry forces full roster refresh','cache-busted JS/CSS URLs for Kakao/iOS webviews'],validation:['javascript syntax','standalone-source ownership','no legacy automatic updater redirect','no legacy role terminology','roster canonical 6.0.3 marker'],functionalQaPolicy:'functional/browser/device QA is non-blocking and omitted from deployment gate per operator request'},null,2)+'\n');
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/data-kokmatch-build="[^"]*"/g,`data-kokmatch-build="${build}"`);
          html=html.replace(/manifest\.webmanifest\?v=[^"']+/g,`manifest.webmanifest?v=${build}`);
          html=html.replace(/app-v6\.0\.css\?v=[^"']+/g,`app-v6.0.css?v=${build}`);
          html=html.replace(/app-v6\.0\.js\?v=[^"']+/g,`app-v6.0.js?v=${build}`);
          html=html.replace(/window\.__kokmatchBuild='[^']*'/g,`window.__kokmatchBuild='${build}'`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Commit canonical v6 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v6.0.js app-v6.0.css index.html latest-version.json v6-cleanup-report.json
          git commit -m "Apply roster UI and cache refresh fixes [skip ci]" || exit 0
          git pull --rebase origin main
          git push
