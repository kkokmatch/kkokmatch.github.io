name: Prune Kokmatch v6 runtime
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune-v6-runtime.mjs'
      - 'scripts/v6-canonical-member-controls.mjs'
      - 'scripts/v6-canonical-header.mjs'
      - 'scripts/v6-roster-cleanup.mjs'
      - 'scripts/v6-disable-legacy-auto-update.mjs'
      - 'scripts/v6-ui-terminology.mjs'
      - 'scripts/v6-ui-stability.mjs'
      - 'scripts/v6-ui-v614.mjs'
      - 'scripts/v6-ui-v616.mjs'
      - 'scripts/v6-ui-v617.mjs'
      - 'scripts/v6-ui-v618.mjs'
      - 'scripts/v6-ui-v619.mjs'
      - 'scripts/v6-ui-v620.mjs'
      - '.github/workflows/prune-v6-runtime.yml'
  workflow_dispatch:
concurrency:
  group: kokmatch-v6-runtime-cleanup
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prune-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical v6 runtime
        run: |
          node scripts/prune-v6-runtime.mjs
          node scripts/v6-canonical-member-controls.mjs
          node scripts/v6-canonical-header.mjs
          node scripts/v6-roster-cleanup.mjs
          node scripts/v6-disable-legacy-auto-update.mjs
          node scripts/v6-ui-terminology.mjs
          node scripts/v6-ui-stability.mjs
          node scripts/v6-ui-v614.mjs
          node scripts/v6-ui-v616.mjs
          node scripts/v6-ui-v617.mjs
          node scripts/v6-ui-v618.mjs
          node scripts/v6-ui-v619.mjs
          node scripts/v6-ui-v620.mjs
      - name: Validate generated source only
        run: |
          node --check app-v6.0.js
          ! grep -q 'auto-v6' app-v6.0.js
          ! grep -q 'refreshTo75' app-v6.0.js
          ! grep -q 'targetReady75' app-v6.0.js
          ! grep -Fq 'location.replace(`/refresh/v' app-v6.0.js
          ! grep -Fq 'location.assign(`/refresh/v' app-v6.0.js
          ! grep -Fq "setInterval(()=>{if(T&&!reloginBusy)loadState().catch(()=>{})},3000)" app-v6.0.js
          ! grep -Fq "setInterval(()=>{if(me){restoreDeveloper99();if(currentView==='members')ensureFullDeveloperRoster99()}},1200)" app-v6.0.js
          grep -q "__kokmatchInteractionCore='6.0'" app-v6.0.js
          grep -q "__kokmatchRosterCanonicalV6='6.0.4'" app-v6.0.js
          grep -q 'function forceLatestHeaderRefreshV6' app-v6.0.js
          grep -Fq "function buildLabelV6(){return 'v6.20'}" app-v6.0.js
          grep -Fq "__kokmatchMemberTemplateV618='v6.20'" app-v6.0.js
          grep -Fq "__kokmatchMemberSaveApiV620='v6.20'" app-v6.0.js
          grep -Fq "const x=await v620MemberApi('member_save'" app-v6.0.js
          grep -Fq "addEventListener('click',deleteMemberEditorV620)" app-v6.0.js
          grep -q 'memberEditorFormV618' app-v6.0.js
          grep -q 'standardizeRosterV618' app-v6.0.js
          test "$(grep -o 'const renderMembersV618=renderMembers;' app-v6.0.js | wc -l | tr -d ' ')" = "1"
          grep -Fq 'grid-template-columns:46px minmax(0,1fr) 104px' app-v6.0.css
          grep -Fq 'gap:6px!important' app-v6.0.css
          grep -Fq 'gap:5px!important' app-v6.0.css
          grep -q "data-kokmatch-entry='fresh-v1'\|dataset.kokmatchEntry='fresh-v1'" index.html
          grep -q "app-v6.0.js?_km=" index.html
          grep -q "app-v6.0.css?_km=" index.html
      - name: Update cleanup metadata
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const build='v6.20';
          const p='latest-version.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.version=60;x.label='v6.20';x.semanticVersion='6.20';x.build=build;x.updatedAt='2026-08-31T17:08:00+09:00';x.note='회원수정 저장 Can\'t find variable 오류 제거 · v6.20 독립 저장 API · 액션버튼 간격 2px 추가';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          fs.writeFileSync('v6-cleanup-report.json',JSON.stringify({version:'6.20',build,features:['active member editor save uses a self-contained kokmatch-v60-api client instead of the out-of-scope v6.15 helper','member delete uses the same self-contained API','member action grid spacing is 2px wider on desktop and mobile','v6.18 member template is generated exactly once on repeat builds','legacy auto-refresh and full-roster repaint loops remain disabled'],validation:['javascript syntax','active member save route','self-contained v6.20 API marker','single canonical v6.18 render wrapper','6px desktop action gap','5px mobile action gap','fresh-entry bootstrap'],functionalQaPolicy:'functional/browser/device QA omitted from deployment gate per operator request'},null,2)+'\n');
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/data-kokmatch-build="[^"]*"/,`data-kokmatch-build="${build}"`);
          html=html.replace(/const BUILD_FALLBACK='[^']*'/,`const BUILD_FALLBACK='${build}'`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Commit canonical v6 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v6.0.js app-v6.0.css index.html latest-version.json v6-cleanup-report.json
          git commit -m "Ship v6.20 member save scope fix [skip ci]" || exit 0
          git pull --rebase origin main
          git push
