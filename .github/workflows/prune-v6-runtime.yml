name: Prune Kokmatch v6 runtime
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune-v6-runtime.mjs'
      - 'scripts/v6-canonical-member-controls.mjs'
      - 'scripts/v6-canonical-header.mjs'
      - 'scripts/v6-roster-cleanup.mjs'
      - 'scripts/v6-disable-legacy-auto-update.mjs'
      - 'scripts/v6-ui-terminology.mjs'
      - 'scripts/v6-ui-stability.mjs'
      - 'scripts/v6-ui-v614.mjs'
      - 'scripts/v6-ui-v616.mjs'
      - '.github/workflows/prune-v6-runtime.yml'
  workflow_dispatch:
concurrency:
  group: kokmatch-v6-runtime-cleanup
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prune-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical v6 runtime
        run: |
          node scripts/prune-v6-runtime.mjs
          node scripts/v6-canonical-member-controls.mjs
          node scripts/v6-canonical-header.mjs
          node scripts/v6-roster-cleanup.mjs
          node scripts/v6-disable-legacy-auto-update.mjs
          node scripts/v6-ui-terminology.mjs
          node scripts/v6-ui-stability.mjs
          node scripts/v6-ui-v614.mjs
          node scripts/v6-ui-v616.mjs
      - name: Validate generated source only
        run: |
          node --check app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix22.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix23.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix24.js' app-v6.0.js
          ! grep -q 'migrated into v6.0: app-v5.4-fix26.js' app-v6.0.js
          ! grep -q 'auto-v6' app-v6.0.js
          ! grep -q 'refreshTo75' app-v6.0.js
          ! grep -q 'targetReady75' app-v6.0.js
          ! grep -Fq 'location.replace(`/refresh/v' app-v6.0.js
          ! grep -Fq 'location.assign(`/refresh/v' app-v6.0.js
          grep -q "__kokmatchInteractionCore='6.0'" app-v6.0.js
          grep -q "__kokmatchRosterCanonicalV6='6.0.4'" app-v6.0.js
          grep -q 'data-member-id22="${esc(m.id)}"' app-v6.0.js
          grep -q 'memberRosterFooterV6' app-v6.0.js
          grep -q '__kokmatchRepairRosterV6' app-v6.0.js
          grep -q 'V6_CANONICAL_ROSTER_CSS_BEGIN' app-v6.0.css
          grep -q 'function forceLatestHeaderRefreshV6' app-v6.0.js
          grep -q 'currentVersionV6' app-v6.0.js
          grep -q '최신버전으로 새로고침' app-v6.0.js
          grep -Fq "function buildLabelV6(){return 'v6.16'}" app-v6.0.js
          grep -Fq "__kokmatchReliableActionTapV6='v6.16'" app-v6.0.js
          grep -Fq "__kokmatchFastMemberActionsV6='v6.16'" app-v6.0.js
          grep -Fq "__kokmatchCanonicalMemberEditorV6='v6.16'" app-v6.0.js
          grep -Fq "__kokmatchFastPartnerV6='v6.16'" app-v6.0.js
          grep -Fq "__kokmatchMemberPointerRouterV615='v6.16'" app-v6.0.js
          grep -Fq "__kokmatchPartnerDisplayFilterV616='v6.16'" app-v6.0.js
          grep -q 'openMemberEditorV615' app-v6.0.js
          grep -q 'openPartnerOverlayV615' app-v6.0.js
          grep -q 'v615StripPartnerNames' app-v6.0.js
          grep -Fq '#modal,#memberEditorV615,#partnerOverlayV615,#members .memberCard' app-v6.0.js
          grep -q 'memberEditorOverlayV615' app-v6.0.css
          grep -q 'partnerOverlayV615' app-v6.0.css
          grep -q 'v615Pressed' app-v6.0.css
          grep -q 'margin:4px 0 0' app-v6.0.css
          grep -q 'v616PartnerNameHidden' app-v6.0.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' app-v6.0.css
          ! grep -Eq '총관리자|모임관리자|게임편성자|일반회원' app-v6.0.js
          grep -q "data-kokmatch-entry='fresh-v1'\|dataset.kokmatchEntry='fresh-v1'" index.html
          grep -q "app-v6.0.js?_km=" index.html
          grep -q "app-v6.0.css?_km=" index.html
      - name: Update cleanup metadata
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const build='v6.16';
          const p='latest-version.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.version=60;x.label='v6.16';x.semanticVersion='6.16';x.build=build;x.updatedAt='2026-08-31T16:22:00+09:00';x.note='회원카드 액션영역 레이아웃 복구 · 파트너명 DOM 보존형 숨김 · 이름과 년생성별 4px 간격';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          fs.writeFileSync('v6-cleanup-report.json',JSON.stringify({version:'6.16',build,features:['partner name is suppressed without deleting member-card DOM nodes','partner relation renderers no longer create visible partner-name rows','member action column is locked independently from member information height','entry, spectator, exit and edit buttons use a stable two-column action grid','name-to-birth/gender gap restored to 4px','single v6.15 pointer router remains the only roster action router','short visible version label v6.16'],validation:['javascript syntax','no automatic /refresh/vXX navigation','v6.16 partner display filter marker','4px member meta spacing','stable action-grid CSS marker','fresh-entry bootstrap marker'],functionalQaPolicy:'functional/browser/device QA omitted from deployment gate per operator request'},null,2)+'\n');
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/data-kokmatch-build="[^"]*"/,`data-kokmatch-build="${build}"`);
          html=html.replace(/const BUILD_FALLBACK='[^']*'/,`const BUILD_FALLBACK='${build}'`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Commit canonical v6 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v6.0.js app-v6.0.css index.html latest-version.json v6-cleanup-report.json
          git commit -m "Ship v6.16 member card layout repair [skip ci]" || exit 0
          git pull --rebase origin main
          git push
