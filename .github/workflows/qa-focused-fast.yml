name: QA focused partner and poll

on:
  push:
    paths:
      - '.github/workflows/qa-focused-fast.yml'
      - 'scripts/qa-partner-poll-current.mjs'
      - 'app-v6.22.js'
      - 'app-v6.22.css'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright chromium only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.25; done
          exit 1
      - name: Run focused QA
        run: node scripts/qa-partner-poll-current.mjs
